<style>

}
* { box-sizing: border-box; font-family: 'Inter', sans-serif !important; }
body {

/* HEADER */
.header {

}

}

}
.header-logo svg {

  fill: none;
}
.header-title h1 {

  font-size: 18px;

  color: var(--text);

}
.header-title p {

}
.header-right {

}
.header-user {

/* TABS MODERN — SEMUA TAMPIL */

  margin-bottom: 24px;

}

/* LIST ITEM */

  background: white; 
  border: 1px solid var(--border);

}
.list-item:hover { box-shadow: var(--shadow); }

}

/* FORM GRID */

/* DASHBOARD WELCOME */

.welcome-card h2 {

  position: relative;

/* LOGIN */
#loginBox {

/* RESPONSIVE */
@media (max-width: 640px) {

</style>

<script>
let savedPin = localStorage.getItem('ufo_admin_pin3') || '';
let currentTab = 'dash';
let allPromotor = {};
let allPenjualan = {};
let allAbsensi = {};
let allPelanggaran = {};
let allRewardsSaya = {};

/* ============================================================ */
/* ===== HELPER: CONVERT TANGGAL EXCEL ========================= */
/* ============================================================ */
function convertTanggalExcel(val) {
  if (val === undefined || val === null || val === '') return '';
  if (typeof val === 'number' && val > 1 && val < 100000) {
    const epochMs = Date.UTC(1899, 11, 30);
    const ms = epochMs + val * 24 * 60 * 60 * 1000;
    const d = new Date(ms);
    return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear();
  }
  const str = String(val).trim();
  if (!str) return '';
  if (/^\d{5}$/.test(str)) {
    const num = parseInt(str);
    const epochMs = Date.UTC(1899, 11, 30);
    const ms = epochMs + num * 24 * 60 * 60 * 1000;
    const d = new Date(ms);
    return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear();
  }
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
    const p = str.split(' ')[0].split('-');
    return `${p[2]}/${p[1]}/${p[0]}`;
  }
  if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(str)) {
    const parts = str.split(' ')[0].split('/');
    const mm = String(parts[0]).padStart(2, '0');
    const dd = String(parts[1]).padStart(2, '0');
    const yyyy = parts[2];
    return `${dd}/${mm}/${yyyy}`;
  }
  return str;
}

function convertJam(val) {
  if (val === undefined || val === null || val === '') return '';
  if (typeof val === 'number') {
    if (val === 0 || isNaN(val)) return '';
    const totalMenit = Math.round(val * 24 * 60);
    const jam = Math.floor(totalMenit / 60) % 24;
    const menit = totalMenit % 60;
    return String(jam).padStart(2, '0') + ':' + String(menit).padStart(2, '0');
  }
  const str = String(val).trim();
  if (!str) return '';
  if (/^\d*\.?\d+$/.test(str)) {
    const num = parseFloat(str);
    if (isNaN(num) || num === 0) return '';
    if (num < 1) {
      const totalMenit = Math.round(num * 24 * 60);
      const jam = Math.floor(totalMenit / 60) % 24;
      const menit = totalMenit % 60;
      return String(jam).padStart(2, '0') + ':' + String(menit).padStart(2, '0');
    } else {
      const jam = Math.floor(num);
      const menit = Math.round((num - jam) * 60);
      return String(jam).padStart(2, '0') + ':' + String(menit).padStart(2, '0');
    }
  }
  if (str.includes(':')) return str;
  return str;
}

function sanitizeKey(nama) {
  return String(nama || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_');
}

function getNamaBulan(bulan) {
  const nama = ['', 'Januari','Februari','Maret','April','Mei','Juni',
                'Juli','Agustus','September','Oktober','November','Desember'];
  return nama[bulan] || '?';
}

/* ============================================================ */
/* ===== FIREBASE READY ======================================== */
/* ============================================================ */
window.addEventListener('firebase-ready', () => {
  if (savedPin) {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('panelAdmin').classList.remove('hidden');
    document.getElementById('headerUser').classList.remove('hidden');
    document.getElementById('btnLogoutHeader').classList.remove('hidden');
    mulaiAdmin();
  }
});

/* ============================================================ */
/* ===== LOGIN / LOGOUT ======================================== */
/* ============================================================ */
async function loginAdmin() {
  const pin = document.getElementById('pinAdmin').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  if (!pin) { errEl.innerHTML = '⚠️ Masukkan PIN!'; errEl.classList.remove('hidden'); return; }
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'config/adminPin'));
    let pinBenar = '8888';
    if (snap.exists()) pinBenar = String(snap.val());
    else await window.dbSet(window.dbRef(window.db, 'config/adminPin'), '8888');
    if (pin === pinBenar) {
      savedPin = pin;
      localStorage.setItem('ufo_admin_pin3', pin);
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('panelAdmin').classList.remove('hidden');
      document.getElementById('headerUser').classList.remove('hidden');
      document.getElementById('btnLogoutHeader').classList.remove('hidden');
      mulaiAdmin();
    } else {
      errEl.innerHTML = '❌ PIN salah!';
      errEl.classList.remove('hidden');
    }
  } catch (err) {
    errEl.innerHTML = '❌ Gagal: ' + err.message;
    errEl.classList.remove('hidden');
  }
}

function logoutAdmin() {
  if (!confirm('Yakin ingin keluar?')) return;
  localStorage.removeItem('ufo_admin_pin3');
  savedPin = '';

/* ============================================================ */
/* ===== HANDLE FILE FINGER (SHEET "Punch") ==================== */
/* ============================================================ */
function handleFileFinger(e) {
  const file = e.target.files[0];
  if (!file) return;
  const el = document.getElementById('fingerInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Membaca file finger...</div>';
  
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      
      console.log('📋 Sheet terdeteksi:', wb.SheetNames);
      
      const sheetName = wb.SheetNames.find(n => 
        n.toLowerCase().includes('punch') || n.toLowerCase().includes('raw')
      ) || wb.SheetNames[0];
      
      const sheet = wb.Sheets[sheetName];
      if (!sheet) {
        el.innerHTML = '<div class="alert err">❌ Sheet tidak ditemukan!</div>';
        return;
      }
      
      console.log('📋 Pakai sheet:', sheetName);
      
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      console.log('📋 Total baris:', rows.length);
      
      const absensiData = {};
      let promotorCount = 0;
      let hariCount = 0;
      let skipList = [];
      let cocokList = [];
      
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        if (!row || !row[0]) continue;
        
        const rowText = String(row[0]);
        if (!rowText.includes('Nama:')) continue;
        
        const m = rowText.match(/Nama:(\S+)/);
        if (!m) continue;
        let namaFinger = m[1].trim();
        if (!namaFinger) continue;
        
        // Cari promotor yang cocok
        const cleanKey = sanitizeKey(namaFinger);
        let foundKey = null;
        let foundPromotor = null;
        
        if (allPromotor[cleanKey]) {
          foundKey = cleanKey;
          foundPromotor = allPromotor[cleanKey];
        } else {
          // Coba cari berdasarkan nama yang mengandung namaFinger
          const upperNamaFinger = namaFinger.toUpperCase();
          for (const k of Object.keys(allPromotor)) {
            const p = allPromotor[k];
            if (p.namaAbsen && String(p.namaAbsen).toUpperCase().includes(upperNamaFinger)) {
              foundKey = k;
              foundPromotor = p;
              break;
            }
          }
        }
        
        if (!foundKey) {
          if (skipList.indexOf(namaFinger) === -1) skipList.push(namaFinger);
          continue;
        }
        
        cocokList.push(`${namaFinger} → ${foundPromotor.namaAbsen}`);
        
        const dateRow = rows[i + 1];
        const jamRow = rows[i + 2];
        if (!dateRow || !jamRow) continue;
        
        if (!absensiData[foundKey]) absensiData[foundKey] = {};
        promotorCount++;
        
        const bulanIni = getNamaBulan(new Date().getMonth() + 1);
        
        for (let col = 1; col < Math.max(dateRow.length, jamRow.length); col++) {
          const hariNum = parseInt(dateRow[col]) || 0;
          const jamStr = String(jamRow[col] || '').trim();
          
          if (hariNum < 1 || hariNum > 31) continue;
          if (!jamStr) continue;
          
          const jamParts = jamStr.split(/\s+/).filter(j => j.includes(':'));
          
          let masuk = '', ist1 = '', kem1 = '', ist2 = '', kem2 = '', pulang = '';
          
          switch (jamParts.length) {
            case 1: masuk = jamParts[0]; break;
            case 2: masuk = jamParts[0]; pulang = jamParts[1]; break;
            case 3: masuk = jamParts[0]; ist1 = jamParts[1]; pulang = jamParts[2]; break;
            case 4: masuk = jamParts[0]; ist1 = jamParts[1]; kem1 = jamParts[2]; pulang = jamParts[3]; break;
            case 5: masuk = jamParts[0]; ist1 = jamParts[1]; kem1 = jamParts[2]; ist2 = jamParts[3]; pulang = jamParts[4]; break;
            default:
              masuk = jamParts[0] || ''; 
              ist1 = jamParts[1] || ''; 
              kem1 = jamParts[2] || ''; 
              ist2 = jamParts[3] || ''; 
              kem2 = jamParts[4] || ''; 
              pulang = jamParts[5] || '';
          }
          
          absensiData[foundKey]['hari_' + hariNum] = {
            nama: foundPromotor.namaAbsen,
            hari: hariNum,
            masuk: masuk,
            istirahat1: ist1,
            kembali1: kem1,
            istirahat2: ist2,
            kembali2: kem2,
            pulang: pulang,
            terlambat: '',
            bulan: bulanIni
          };
          hariCount++;
        }
      }
      
      console.log('✅ Proses selesai:', promotorCount, 'promotor,', hariCount, 'hari');
      
      if (promotorCount === 0) {
        el.innerHTML = `
          <div class="alert err">
            ❌ Tidak ada promotor yang cocok!<br><br>
            <b>Nama di file finger:</b> ${skipList.slice(0, 5).join(', ')}${skipList.length > 5 ? `, +${skipList.length - 5} lagi` : ''}<br><br>
            Pastikan nama di file finger sama dengan <b>Nama Absen</b> di MASTER_SALES.
          </div>
        `;
        return;
      }
      
      el.innerHTML = `
        <div class="alert ok">
          ✅ <b>${promotorCount} promotor</b> cocok • <b>${hariCount} hari absensi</b>
          ${skipList.length > 0 ? `<br><small style="color:#92400e;">⚠️ ${skipList.length} promotor tidak cocok: ${skipList.slice(0, 3).join(', ')}${skipList.length > 3 ? ', ...' : ''}</small>` : ''}
        </div>
        <button class="btn-success btn-full" onclick="konfirmasiUploadFinger()">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Konfirmasi Upload ke Firebase
        </button>
      `;
      
      window._fingerData = absensiData;
      
    } catch (err) {
      console.error(err);
      el.innerHTML = `<div class="alert err">❌ ${err.message}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

async function konfirmasiUploadFinger() {
  const data = window._fingerData;
  if (!data) return;
  
  const el = document.getElementById('fingerInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Uploading ke Firebase...</div>';
  
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'absensi'));
    const existing = snap.exists() ? snap.val() : {};
    
    const updates = {};
    let totalHari = 0;
    let totalUpdate = 0;
    
    Object.keys(data).forEach(keyPromotor => {
      Object.keys(data[keyPromotor]).forEach(hariKey => {
        const newData = data[keyPromotor][hariKey];
        const oldData = existing[keyPromotor]?.[hariKey];
        
        if (oldData && String(oldData.terlambat || '').toUpperCase() === 'YA') {
          newData.terlambat = 'YA';
          totalUpdate++;
        }
        
        updates[`absensi/${keyPromotor}/${hariKey}`] = newData;
        totalHari++;
      });
    });
    
    await window.dbUpdate(window.dbRef(window.db), updates);
    
    el.innerHTML = `
      <div class="alert ok">
        ✅ Berhasil upload!<br>
        <b>${Object.keys(data).length} promotor</b> • <b>${totalHari} hari absensi</b>
        ${totalUpdate > 0 ? `<br><small>🔒 ${totalUpdate} flag "terlambat" lama dipertahankan</small>` : ''}
      </div>
      <button class="btn-soft btn-full" onclick="location.reload()">Refresh Halaman</button>
    `;
    
    window._fingerData = null;
  } catch (err) {
    console.error(err);
    el.innerHTML = `<div class="alert err">❌ ${err.message}</div>`;
  }
}

/* ===== HANDLE FILE MASTER =================================== */

function handleFileMaster(e) {
  const file = e.target.files[0];
  if (!file) return;
  const el = document.getElementById('masterInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Membaca file master...</div>';
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const result = { promotor: [], penjualan: [], absensi: {}, info: {}, pelanggaran: {}, rewardsSaya: {} };

      console.log('📋 Sheet terdeteksi:', wb.SheetNames);

      const ms = wb.Sheets['MASTER_SALES'];
      if (ms) {
        const rows = XLSX.utils.sheet_to_json(ms, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const aktif = String(r[2]).trim().toUpperCase();
          const tampil = String(r[5] || '').trim().toUpperCase();
          const role = String(r[4] || 'USER').trim().toUpperCase();
          if (aktif !== 'YA') continue;
          if (tampil !== 'YA') continue;
          if (role !== 'USER') continue;
          result.promotor.push({
            namaAbsen: String(r[0]).trim(),
            namaSales: String(r[1]).trim(),
            pin: String(r[3]).trim().replace(/\.0$/, ''),
            ikutUC: String(r[6] || 'YA').trim().toUpperCase(),
            targetUC: Number(r[7]) || 16,
            merk: String(r[8] || '').trim(),
            aktif: true
          });
        }
      }

      const pj = wb.Sheets['PENJUALAN'];
      if (pj) {
        const rows = XLSX.utils.sheet_to_json(pj, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || !r[1]) continue;
          if (String(r[5]).trim().toUpperCase() === 'TOTAL') continue;
          result.penjualan.push({
            noFaktur: String(r[1]).trim(),
            tanggal: convertTanggalExcel(r[2]),
            barcode: String(r[3]).trim(),
            namaBarang: String(r[5]).trim(),
            qty: Number(r[6]) || 0,
            subtotal: Number(r[10]) || 0,
            namaSales: String(r[15]).trim(),
            kategori: String(r[17]).trim().toUpperCase(),
            merk: String(r[18]).trim().toUpperCase()
          });
        }
      }

      const ab = wb.Sheets['ABSENFINGER'];
      if (ab) {
        const rows = XLSX.utils.sheet_to_json(ab, { header: 1, defval: '' });
        let countAbsensi = 0;
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !r[0] || String(r[0]).trim() === '') continue;
          const namaAbsen = String(r[0]).trim();
          if (!namaAbsen) continue;
          let hariNum = 0;
          const tglRaw = r[1];
          if (tglRaw !== undefined && tglRaw !== null && tglRaw !== '') {
            if (typeof tglRaw === 'number') hariNum = Math.floor(tglRaw);
            else hariNum = parseInt(String(tglRaw).trim(), 10) || 0;
          }
          if (hariNum < 1 || hariNum > 31) continue;
          const cleanKey = sanitizeKey(namaAbsen);
          if (!result.absensi[cleanKey]) result.absensi[cleanKey] = {};
          if (result.absensi[cleanKey]['hari_' + hariNum]) continue;
          result.absensi[cleanKey]['hari_' + hariNum] = {
            nama: namaAbsen, hari: hariNum,
            masuk: convertJam(r[2]), istirahat1: convertJam(r[3]),
            kembali1: convertJam(r[4]), istirahat2: convertJam(r[5]),
            kembali2: convertJam(r[6]), pulang: convertJam(r[7]),
            terlambat: String(r[8] || '').trim().toUpperCase(),
            bulan: String(r[9] || '').trim()
          };
          countAbsensi++;
        }
      }

      const parseSheet = (sheet, cols) => {
        if (!sheet) return [];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        const out = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const obj = {};
          cols.forEach((c, idx) => { obj[c] = String(r[idx] || '').trim(); });
          out.push(obj);
        }
        return out;
      };
      result.info.promo = parseSheet(wb.Sheets['PROMO'], ['judul', 'periode', 'detail']);
      result.info.rules = parseSheet(wb.Sheets['RULES'], ['poin', 'deskripsi']);
      result.info.punishment = parseSheet(wb.Sheets['PUNISHMENT'], ['judul', 'level', 'detail']);
      result.info.reward = parseSheet(wb.Sheets['REWARD'], ['judul', 'periode', 'detail']);

      const pl = wb.Sheets['PELANGGARAN'];
      if (pl) {
        const rows = XLSX.utils.sheet_to_json(pl, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const cleanKey = sanitizeKey(String(r[0]).trim());
          if (!result.pelanggaran[cleanKey]) result.pelanggaran[cleanKey] = {};
          result.pelanggaran[cleanKey]['item_' + i] = {
            nama: String(r[0]).trim(),
            tanggal: String(r[1] || '').trim(),
            keterangan: String(r[2] || '').trim(),
            denda: String(r[3] || '').trim()
          };
        }
      }

      const rs = wb.Sheets['RewardSaya'];
      if (rs) {
        const rows = XLSX.utils.sheet_to_json(rs, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const cleanKey = sanitizeKey(String(r[0]).trim());
          if (!result.rewardsSaya[cleanKey]) result.rewardsSaya[cleanKey] = {};
          result.rewardsSaya[cleanKey]['item_' + i] = {
            nama: String(r[0]).trim(),
            judul: String(r[1] || '').trim(),
            detail: String(r[2] || '').trim(),
            tanggal: String(r[3] || '').trim()
          };
        }
      }

      const totalAbsensi = Object.values(result.absensi).reduce((s, o) => s + Object.keys(o).length, 0);

      el.innerHTML = `
        <div class="alert ok">
          ✅ Siap upload:<br>
          • ${result.promotor.length} promotor<br>
          • ${result.penjualan.length} transaksi<br>
          • ${Object.keys(result.absensi).length} orang absensi (${totalAbsensi} hari)<br>
          • ${Object.keys(result.pelanggaran).length} pelanggaran
        </div>
        <button class="btn-success btn-full" onclick="konfirmasiUploadMaster()">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Konfirmasi Upload
        </button>
      `;
      window._masterData = result;
    } catch (err) {
      console.error(err);
      el.innerHTML = `<div class="alert err">❌ ${err.message}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

async function konfirmasiUploadMaster() {
  const data = window._masterData;
  if (!data) return;
  const el = document.getElementById('masterInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Uploading...</div>';
  try {
    const updates = {};
    data.promotor.forEach(p => { updates['users/promotor/' + sanitizeKey(p.namaAbsen)] = p; });

    const snap = await window.dbGet(window.dbRef(window.db, 'penjualan'));
    const setExist = new Set();
    if (snap.exists()) {
      Object.values(snap.val()).forEach(x => {
        if (x && x.noFaktur && x.barcode) setExist.add(x.noFaktur + '|' + x.barcode);
      });
    }
    let cBaru = 0, cSkip = 0;
    data.penjualan.forEach((item, idx) => {
      const k = item.noFaktur + '|' + item.barcode;
      if (setExist.has(k)) { cSkip++; return; }
      updates['penjualan/t_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).substr(2, 6)] = item;
      cBaru++;
    });

    Object.keys(data.absensi).forEach(k => { updates['absensi/' + k] = data.absensi[k]; });
    if (data.info.promo.length) updates['info/promo'] = data.info.promo;
    if (data.info.rules.length) updates['info/rules'] = data.info.rules;
    if (data.info.punishment.length) updates['info/punishment'] = data.info.punishment;
    if (data.info.reward.length) updates['info/reward'] = data.info.reward;
    Object.keys(data.pelanggaran).forEach(k => { updates['pelanggaran/' + k] = data.pelanggaran[k]; });
    Object.keys(data.rewardsSaya).forEach(k => { updates['rewardsSaya/' + k] = data.rewardsSaya[k]; });

    await window.dbUpdate(window.dbRef(window.db), updates);
    const totalAbsensi = Object.values(data.absensi).reduce((s, o) => s + Object.keys(o).length, 0);
    el.innerHTML = `
      <div class="alert ok">
        ✅ Berhasil!<br>
        • ${data.promotor.length} promotor<br>
        • ${cBaru} transaksi baru (${cSkip} duplikat)<br>
        • ${Object.keys(data.absensi).length} orang absensi (${totalAbsensi} hari)
      </div>
      <button class="btn-soft btn-full" onclick="location.reload()">Refresh Halaman</button>
    `;
    window._masterData = null;
  } catch (err) {
    console.error(err);
    el.innerHTML = `<div class="alert err">❌ ${err.message}</div>`;
  }
}

/* ============================================================ */
/* ===== HANDLE FILE PENJUALAN ================================= */
/* ============================================================ */
function handleFilePenjualan(e) {
  const file = e.target.files[0];
  if (!file) return;
  const el = document.getElementById('penjualanInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Membaca file penjualan...</div>';
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      let hIdx = -1;
      for (let i = 0; i < rows.length; i++) {
        if (rows[i][0] === 'Store' && rows[i][1] === 'Nomor Faktur') { hIdx = i; break; }
      }
      if (hIdx === -1) { el.innerHTML = '<div class="alert err">❌ Format tidak dikenali</div>'; return; }
      const parsed = [];
      for (let i = hIdx + 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r || !r[1] || !r[2]) continue;
        if (String(r[5]).trim().toUpperCase() === 'TOTAL') continue;
        parsed.push({
          noFaktur: String(r[1]).trim(),
          tanggal: convertTanggalExcel(r[2]),
          barcode: String(r[3]).trim(),
          namaBarang: String(r[5]).trim(),
          qty: Number(r[6]) || 0,
          subtotal: Number(r[10]) || 0,
          namaSales: String(r[15]).trim(),
          kategori: String(r[17]).trim().toUpperCase(),
          merk: String(r[18]).trim().toUpperCase()
        });
      }
      const omzet = parsed.filter(x => x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS').reduce((s, x) => s + x.subtotal, 0);
      el.innerHTML = `
        <div class="alert ok">✅ ${parsed.length} baris — Omzet: Rp ${omzet.toLocaleString('id-ID')}</div>
        <button class="btn-success btn-full" onclick="konfirmasiUploadPenjualan()">Konfirmasi Upload</button>
      `;
      window._jualData = parsed;
    } catch (err) { el.innerHTML = `<div class="alert err">❌ ${err.message}</div>`; }
  };
  reader.readAsArrayBuffer(file);
}

async function konfirmasiUploadPenjualan() {
  const data = window._jualData;
  if (!data) return;
  const el = document.getElementById('penjualanInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner spinner-dark"></span> Uploading...</div>';
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'penjualan'));
    const setExist = new Set();
    if (snap.exists()) Object.values(snap.val()).forEach(x => {
      if (x && x.noFaktur && x.barcode) setExist.add(x.noFaktur + '|' + x.barcode);
    });
    const updates = {};
    let cBaru = 0, cSkip = 0;
    data.forEach((item, idx) => {
      const k = item.noFaktur + '|' + item.barcode;
      if (setExist.has(k)) { cSkip++; return; }
      updates['penjualan/t_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).substr(2, 6)] = item;
      cBaru++;
    });
    await window.dbUpdate(window.dbRef(window.db), updates);
    el.innerHTML = `<div class="alert ok">✅ ${cBaru} transaksi baru (${cSkip} duplikat)</div>`;
    window._jualData = null;
  } catch (err) { el.innerHTML = `<div class="alert err">❌ ${err.message}</div>`; }
}

/* ============================================================ */
/* ===== PROMOTOR ============================================== */
/* ============================================================ */
function renderPromotor() {
  const list = Object.keys(allPromotor).map(k => ({ key: k, ...allPromotor[k] })).sort((a,b) => (a.namaAbsen || '').localeCompare(b.namaAbsen || ''));
  return `
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Tambah Promotor
      </h3>
      <div class="form-grid">
        <input type="text" id="p_namaAbsen" placeholder="Nama Absen">
        <input type="text" id="p_namaSales" placeholder="Nama Sales">
        <input type="text" id="p_pin" placeholder="PIN 4 digit" maxlength="6">
        <input type="text" id="p_merk" placeholder="Merk">
        <input type="number" id="p_targetUC" placeholder="Target UC" value="16">
        <select id="p_ikutUC"><option value="YA">Ikut UC</option><option value="TIDAK">Tidak Ikut UC</option></select>
      </div>
      <button class="btn-primary btn-full" onclick="tambahPromotor()">Tambah Promotor</button>
      <div id="promotorMsg" style="margin-top:10px;"></div>
    </div>
    <div class="card">
      <h3>Daftar Promotor (${list.length})</h3>
      ${list.length === 0 ? '<div class="alert warn">Belum ada promotor.</div>' : ''}
      ${list.map(p => `
        <div class="list-item">
          <div class="kiri">
            <div class="nama">${p.namaAbsen}</div>
            <div class="detail">PIN: <b>${p.pin}</b> • ${p.namaSales} • ${p.merk || '-'} • Target UC: ${p.targetUC}</div>
          </div>
          <div class="kanan">
            <button class="btn-danger btn-sm" onclick="hapusPromotor('${p.key}', '${p.namaAbsen}')">Hapus</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

async function tambahPromotor() {
  const namaAbsen = document.getElementById('p_namaAbsen').value.trim();
  const namaSales = document.getElementById('p_namaSales').value.trim();
  const pin = document.getElementById('p_pin').value.trim();
  const merk = document.getElementById('p_merk').value.trim();
  const targetUC = Number(document.getElementById('p_targetUC').value) || 16;
  const ikutUC = document.getElementById('p_ikutUC').value;
  const msg = document.getElementById('promotorMsg');
  if (!namaAbsen || !namaSales || !pin) { msg.innerHTML = '<div class="alert err">Isi semua field!</div>'; return; }
  try {
    await window.dbSet(window.dbRef(window.db, 'users/promotor/' + sanitizeKey(namaAbsen)), { namaAbsen, namaSales, pin, merk, targetUC, ikutUC, aktif: true });
    msg.innerHTML = '<div class="alert ok">✅ Promotor ditambahkan</div>';
    ['p_namaAbsen','p_namaSales','p_pin','p_merk'].forEach(id => document.getElementById(id).value = '');
    setTimeout(() => msg.innerHTML = '', 3000);
  } catch (err) { msg.innerHTML = `<div class="alert err">❌ ${err.message}</div>`; }
}

async function hapusPromotor(key, nama) {
  if (!confirm(`Hapus "${nama}"?`)) return;
  await window.dbRemove(window.dbRef(window.db, 'users/promotor/' + key));
}

/* ============================================================ */
/* ===== TERLAMBAT ============================================= */
/* ============================================================ */
function renderTerlambat() {
  const listPromotor = Object.keys(allPromotor).map(k => ({ key: k, ...allPromotor[k] }))
    .sort((a,b) => (a.namaAbsen || '').localeCompare(b.namaAbsen || ''));
  
  const today = new Date();
  const bulanIni = today.getMonth() + 1;
  const tahunIni = today.getFullYear();
  const hariIni = today.getDate();
  
  let html = `
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Kelola Terlambat — ${getNamaBulan(bulanIni)} ${tahunIni}
      </h3>
      <p>Pilih tanggal, lalu klik <b>Tandai</b> pada promotor yang telat hari itu.</p>
      <div style="background:white; border:1px solid var(--border); border-radius:12px; padding:14px;">
        <label>Tanggal (hari ke-)</label>
        <input type="number" id="tglTerlambat" min="1" max="31" value="${hariIni}" 
               style="width:120px; font-size:16px; text-align:center; font-weight:800;"
               onchange="renderTab()">
      </div>
    </div>
  `;
  
  const tglDipilih = Number(document.getElementById('tglTerlambat')?.value) || hariIni;
  
  html += `<div class="card">
    <h3>Daftar Promotor — Tandai Terlambat</h3>
    ${listPromotor.length === 0 ? '<div class="alert warn">Belum ada promotor.</div>' : ''}
  `;
  
  listPromotor.forEach(p => {
    const absensiP = allAbsensi[p.key] || {};
    const hariKeyToday = 'hari_' + tglDipilih;
    const h = absensiP[hariKeyToday];
    
    const adaFinger = h && h.masuk && String(h.masuk).trim() !== '' && h.masuk !== '-';
    const sudahTerlambat = adaFinger && String(h.terlambat || '').toUpperCase() === 'YA';
    
    let totalBulanIni = 0;
    Object.values(absensiP).forEach(a => {
      const adaMasuk = a && a.masuk && String(a.masuk).trim() !== '' && a.masuk !== '-';
      if (adaMasuk && String(a.terlambat || '').toUpperCase() === 'YA') totalBulanIni++;
    });
    
    html += `
      <div class="list-item ${sudahTerlambat ? 'late-item' : ''}">
        <div class="kiri">
          <div class="nama">${p.namaAbsen}</div>
          <div class="detail">
            ${p.namaSales || '-'} • ${p.merk || '-'}
            ${!adaFinger ? '<span style="color:#94a3b8; font-style:italic;"> • Finger belum diupload</span>' : ''}
            ${totalBulanIni > 0 ? `<span style="color:#d97706; font-weight:700;"> • ${totalBulanIni}x terlambat bulan ini</span>` : ''}
          </div>
        </div>
        <div class="kanan">
          ${sudahTerlambat ? '<span class="late-marker">TERLAMBAT</span>' : ''}
          ${adaFinger ? `
            <button class="${sudahTerlambat ? 'btn-danger' : 'btn-primary'} btn-sm" 
                    onclick="toggleTerlambat('${p.key}', ${tglDipilih}, ${sudahTerlambat})">
              ${sudahTerlambat ? 'Batal' : 'Tandai'}
            </button>
          ` : `
            <button class="btn-soft btn-sm" disabled style="opacity:0.4; cursor:not-allowed;">-</button>
          `}
        </div>
      </div>
    `;
  });
  
  html += `</div>`;
  return html;
}

async function toggleTerlambat(promotorKey, hari, sudahTerlambat) {
  try {
    const path = `absensi/${promotorKey}/hari_${hari}`;
    const snap = await window.dbGet(window.dbRef(window.db, path));
    
    if (snap.exists()) {
      await window.dbUpdate(window.dbRef(window.db, path), {
        terlambat: sudahTerlambat ? '' : 'YA'
      });
    } else {
      const today = new Date();
      await window.dbSet(window.dbRef(window.db, path), {
        nama: allPromotor[promotorKey]?.namaAbsen || '',
        hari: Number(hari),
        masuk: '',
        istirahat1: '',
        kembali1: '',
        istirahat2: '',
        kembali2: '',
        pulang: '',
        terlambat: sudahTerlambat ? '' : 'YA',
        bulan: getNamaBulan(today.getMonth() + 1)
      });
    }
    
    renderTab();
  } catch (err) {
    alert('Gagal update: ' + err.message);
  }
}

/* ===== DANGER ZONE =========================================== */
/* ============================================================ */
function renderDanger() {
  return `
    <div class="card">
      <h3 style="color:var(--danger);">
        <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Danger Zone
      </h3>
      <p>Hati-hati! Data yang dihapus tidak bisa dikembalikan.</p>
      <button class="btn-danger btn-full" style="margin-bottom:8px;" onclick="hapusPenjualan()">Hapus Semua Penjualan</button>
      <button class="btn-danger btn-full" style="margin-bottom:8px;" onclick="hapusAbsensi()">Hapus Semua Absensi</button>
      <button class="btn-danger btn-full" style="margin-bottom:8px;" onclick="hapusPromotorAll()">Hapus Semua Promotor</button>
      <button class="btn-danger btn-full" onclick="hapusSemua()">Hapus SEMUA Data</button>
    </div>
  `;
}

async function hapusPenjualan() { if (confirm("Hapus SEMUA penjualan?")) { await window.dbRemove(window.dbRef(window.db, 'penjualan')); alert("✅ Dihapus."); } }
async function hapusAbsensi() { if (confirm("Hapus SEMUA absensi?")) { await window.dbRemove(window.dbRef(window.db, 'absensi')); alert("✅ Dihapus."); } }
async function hapusPromotorAll() { if (confirm("Hapus SEMUA promotor?")) { await window.dbRemove(window.dbRef(window.db, 'users/promotor')); alert("✅ Dihapus."); } }
async function hapusSemua() {
  if (prompt('Ketik "HAPUS":') !== 'HAPUS') return;
  await window.dbRemove(window.dbRef(window.db, 'penjualan'));
  await window.dbRemove(window.dbRef(window.db, 'users'));
  await window.dbRemove(window.dbRef(window.db, 'info'));
  await window.dbRemove(window.dbRef(window.db, 'absensi'));
  await window.dbRemove(window.dbRef(window.db, 'pelanggaran'));
  await window.dbRemove(window.dbRef(window.db, 'rewardsSaya'));
  await window.dbRemove(window.dbRef(window.db, 'config/lastUpload'));
  alert("✅ Semua data dihapus.");
}
