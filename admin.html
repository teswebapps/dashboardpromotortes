<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Dashboard UFO Kebonsari</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNj8nRMP0ijH1GUXKeJlsE-EG5AYCkHBU",
  authDomain: "dashboardpromotor.firebaseapp.com",
  databaseURL: "https://dashboardpromotor-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dashboardpromotor",
  storageBucket: "dashboardpromotor.firebasestorage.app",
  messagingSenderId: "474469951678",
  appId: "1:474469951678:web:f769fed156a36505cbd6ef"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

signInAnonymously(auth).then(() => {
  window.db = db; window.dbRef = ref; window.dbSet = set; window.dbGet = get;
  window.dbUpdate = update; window.dbRemove = remove; window.dbOnValue = onValue;
  window.dbPush = push;
  window.dispatchEvent(new Event('firebase-ready'));
}).catch(err => alert("Gagal koneksi Firebase: " + err.message));

onAuthStateChanged(auth, user => {
  if (!user) setTimeout(() => location.reload(), 1000);
});
</script>

<style>
:root {
  --bg: #f8fafc; --card: #ffffff; --soft: #f1f5f9; --text: #0f172a;
  --muted: #64748b; --border: #e2e8f0; --primary: #2563eb;
  --success: #059669; --danger: #dc2626; --warning: #d97706; --gold: #d4af37;
}
* { box-sizing: border-box; font-family: 'Inter', sans-serif !important; }
body {
  margin: 0; padding: 16px;
  background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
  color: var(--text); min-height: 100vh;
  display: flex; justify-content: center;
}
.container {
  width: 100%; max-width: 820px;
  background: var(--card); border-radius: 20px;
  padding: 24px; border: 1px solid var(--border);
  box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.05);
  height: fit-content;
}
.header {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  border-radius: 14px; padding: 20px; color: white;
  text-align: center; margin-bottom: 20px;
}
.header h1 { margin: 0; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
.header h1 svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }
.header p { margin: 6px 0 0; font-size: 12.5px; color: #94a3b8; }
.card {
  background: var(--soft); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px; margin-bottom: 16px;
}
.card h3 {
  margin: 0 0 12px; font-size: 13px; font-weight: 800;
  text-transform: uppercase; color: var(--primary);
  letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px;
}
.card h3 svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.2; fill: none; }
label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 6px; letter-spacing: 0.3px;
}
input, select {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: #f8fafc;
  font-size: 14px; font-weight: 600; color: var(--text);
  outline: none; box-sizing: border-box;
}
input:focus { border-color: var(--primary); background: #fff; }
button {
  width: 100%; padding: 12px 16px; border-radius: 12px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  border: none; text-transform: uppercase;
  letter-spacing: 0.3px; transition: all 0.2s;
  display: inline-flex; justify-content: center; align-items: center; gap: 8px;
}
button svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.4; fill: none; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: #1d4ed8; }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-soft { background: var(--soft); color: var(--text); border: 1px solid var(--border); }
.btn-soft:hover { background: #e2e8f0; }
.btn-sm { padding: 8px 12px; font-size: 11px; width: auto; }
.hidden { display: none !important; }
.tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
.tab-btn {
  flex-shrink: 0; padding: 9px 16px; border-radius: 10px;
  background: var(--soft); border: 1px solid var(--border);
  color: var(--muted); font-size: 11.5px; font-weight: 700;
  cursor: pointer; text-transform: uppercase; letter-spacing: 0.3px;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab-btn svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 2.2; fill: none; }
.tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.file-wrap {
  border: 2px dashed var(--primary);
  border-radius: 12px; padding: 24px;
  text-align: center; cursor: pointer;
  background: rgba(37, 99, 235, 0.05);
}
.file-wrap:hover { background: rgba(37, 99, 235, 0.1); }
.file-wrap svg { width: 42px; height: 42px; stroke: var(--primary); stroke-width: 1.8; fill: none; margin-bottom: 8px; }
.file-wrap p { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.file-wrap strong { color: var(--primary); }
.file-wrap input { display: none; }
.alert { padding: 12px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.alert svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.4; fill: none; flex-shrink: 0; }
.alert.ok { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }
.alert.err { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
.alert.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.list-item {
  background: white; border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; margin-bottom: 8px;
  display: flex; justify-content: space-between;
  align-items: center; gap: 10px;
}
.list-item .kiri { flex: 1; min-width: 0; }
.list-item .nama { font-size: 13px; font-weight: 700; }
.list-item .detail { font-size: 11px; color: var(--muted); margin-top: 2px; }
.list-item .kanan { display: flex; gap: 6px; flex-shrink: 0; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
.stat-card .label { font-size: 9.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
.stat-card .value { font-size: 16px; font-weight: 900; color: var(--primary); }
.stat-card.full { grid-column: 1 / -1; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 480px) {
  body { padding: 12px; }
  .container { padding: 16px; border-radius: 16px; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Admin Dashboard
    </h1>
    <p>UFO Malang Kebonsari</p>
  </div>

  <div id="loginBox">
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Login Admin
      </h3>
      <label>PIN Admin</label>
      <input type="password" id="pinAdmin" placeholder="••••" maxlength="6"
        inputmode="numeric" pattern="[0-9]*"
        style="text-align:center; font-size:18px; letter-spacing:6px; font-weight:800;"
        oninput="this.value = this.value.replace(/\D/g, '')"
        onkeypress="if(event.key === 'Enter') loginAdmin()">
      <div style="height:10px;"></div>
      <button class="btn-primary" onclick="loginAdmin()">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Masuk
      </button>
      <div id="loginError" class="alert err hidden" style="margin-top:10px;"></div>
    </div>
  </div>

  <div id="panelAdmin" class="hidden">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('dash', event)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </button>
      <button class="tab-btn" onclick="switchTab('upload', event)">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Upload
      </button>
      <button class="tab-btn" onclick="switchTab('promotor', event)">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Promotor
      </button>
      <button class="tab-btn" onclick="switchTab('danger', event)">
        <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Reset
      </button>
    </div>
    <div id="tabContent"></div>
    <div style="height:8px;"></div>
    <button class="btn-soft" onclick="logoutAdmin()">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </button>
  </div>
</div>

<script>
let savedPin = localStorage.getItem('ufo_admin_pin3') || '';
let currentTab = 'dash';
let allPromotor = {};
let allPenjualan = {};
let allAbsensi = {};
let allPelanggaran = {};
let allRewardsSaya = {};

window.addEventListener('firebase-ready', () => {
  if (savedPin) {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('panelAdmin').classList.remove('hidden');
    mulaiAdmin();
  }
});

async function loginAdmin() {
  const pin = document.getElementById('pinAdmin').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  if (!pin) { errEl.innerHTML = 'Masukkan PIN!'; errEl.classList.remove('hidden'); return; }
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'config/adminPin'));
    let pinBenar = '8888';
    if (snap.exists()) pinBenar = String(snap.val());
    else await window.dbSet(window.dbRef(window.db, 'config/adminPin'), '8888');
    if (pin === pinBenar) {
      savedPin = pin;
      localStorage.setItem('ufo_admin_pin3', pin);
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('panelAdmin').classList.remove('hidden');
      mulaiAdmin();
    } else {
      errEl.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> PIN salah!';
      errEl.classList.remove('hidden');
    }
  } catch (err) { errEl.innerText = 'Gagal: ' + err.message; errEl.classList.remove('hidden'); }
}

function logoutAdmin() {
  localStorage.removeItem('ufo_admin_pin3');
  savedPin = '';
  document.getElementById('panelAdmin').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
}

function mulaiAdmin() {
  window.dbOnValue(window.dbRef(window.db, 'users/promotor'), snap => {
    allPromotor = snap.exists() ? snap.val() : {};
    if (currentTab !== 'upload') renderTab();
  });
  window.dbOnValue(window.dbRef(window.db, 'penjualan'), snap => {
    allPenjualan = snap.exists() ? snap.val() : {};
    if (currentTab === 'dash') renderTab();
  });
  window.dbOnValue(window.dbRef(window.db, 'absensi'), snap => {
    allAbsensi = snap.exists() ? snap.val() : {};
  });
  window.dbOnValue(window.dbRef(window.db, 'pelanggaran'), snap => {
    allPelanggaran = snap.exists() ? snap.val() : {};
  });
  window.dbOnValue(window.dbRef(window.db, 'rewardsSaya'), snap => {
    allRewardsSaya = snap.exists() ? snap.val() : {};
  });
  renderTab();
}

function switchTab(tab, evt) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
  renderTab();
}

function renderTab() {
  const el = document.getElementById('tabContent');
  if (currentTab === 'dash') el.innerHTML = renderDash();
  else if (currentTab === 'upload') el.innerHTML = renderUpload();
  else if (currentTab === 'promotor') el.innerHTML = renderPromotor();
  else if (currentTab === 'danger') el.innerHTML = renderDanger();
}

function renderDash() {
  const jmlPromotor = Object.keys(allPromotor).length;
  const trans = Object.values(allPenjualan);
  const jmlTrans = trans.length;
  const jmlAbsensi = Object.keys(allAbsensi).length;
  const jmlPelanggaran = Object.keys(allPelanggaran).length;
  const totalOmzet = trans
    .filter(x => x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS')
    .reduce((s, x) => s + (Number(x.subtotal) || 0), 0);
  return `
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        Statistik Sistem
      </h3>
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Promotor</div><div class="value">${jmlPromotor}</div></div>
        <div class="stat-card"><div class="label">Transaksi</div><div class="value">${jmlTrans}</div></div>
        <div class="stat-card"><div class="label">Absensi</div><div class="value">${jmlAbsensi}</div></div>
        <div class="stat-card"><div class="label">Pelanggaran</div><div class="value">${jmlPelanggaran}</div></div>
        <div class="stat-card"><div class="label">Rewards</div><div class="value">${Object.keys(allRewardsSaya).length}</div></div>
        <div class="stat-card"><div class="label">Upload</div><div class="value">-</div></div>
        <div class="stat-card full">
          <div class="label">Total Omzet</div>
          <div class="value" style="color:var(--success);font-size:20px;">Rp ${totalOmzet.toLocaleString('id-ID')}</div>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        Info Sistem
      </h3>
      <p style="font-size:12.5px; line-height:1.7; margin:0;">
        <b>PIN Admin:</b> <code style="background:#e2e8f0;padding:2px 6px;border-radius:4px;">8888</code><br>
        <b>Upload Master:</b> Sekali saja untuk setup<br>
        <b>Upload Penjualan:</b> Setiap hari dari kasir<br>
        <b>Login Promotor:</b> Nama Absen + PIN 4 digit
      </p>
    </div>
  `;
}

function renderUpload() {
  return `
    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Upload Data Master
      </h3>
      <p style="font-size:12px; color:var(--muted); margin:0 0 10px;">
        Upload file <b>ABSEN FINGER.xlsx</b> lengkap (sheet MASTER_SALES, PENJUALAN, ABSENFINGER, PROMO, RULES, PUNISHMENT, REWARD, PELANGGARAN, RewardSaya). Cukup sekali.
      </p>
      <div class="file-wrap" onclick="document.getElementById('fileMaster').click()">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p><strong>Klik pilih file Master</strong></p>
        <p style="font-size:11px;">File .xlsx lengkap</p>
        <input type="file" id="fileMaster" accept=".xlsx,.xls" onchange="handleFileMaster(event)">
      </div>
      <div id="masterInfo" style="margin-top:12px;"></div>
    </div>

    <div class="card">
      <h3>
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Upload Penjualan Harian
      </h3>
      <p style="font-size:12px; color:var(--muted); margin:0 0 10px;">
        Upload file <b>Penjualan Detail DD_MM_YYYY.xlsx</b> dari kasir. Bisa tiap hari, duplikat auto-skip.
      </p>
      <div class="file-wrap" onclick="document.getElementById('filePenjualan').click()">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p><strong>Klik pilih file Penjualan</strong></p>
        <p style="font-size:11px;">File .xlsx dari kasir</p>
        <input type="file" id="filePenjualan" accept=".xlsx,.xls" onchange="handleFilePenjualan(event)">
      </div>
      <div id="penjualanInfo" style="margin-top:12px;"></div>
    </div>
  `;
}

function handleFileMaster(e) {
  const file = e.target.files[0];
  if (!file) return;
  const el = document.getElementById('masterInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner" style="border-color:rgba(217,119,6,0.3);border-top-color:#d97706;"></span> Membaca file...</div>';
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const result = { promotor: [], penjualan: [], absensi: {}, info: {}, pelanggaran: {}, rewardsSaya: {} };

      // MASTER_SALES
      const ms = wb.Sheets['MASTER_SALES'];
      if (ms) {
        const rows = XLSX.utils.sheet_to_json(ms, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const aktif = String(r[2]).trim().toUpperCase();
          const tampil = String(r[5] || '').trim().toUpperCase();
          const role = String(r[4] || 'USER').trim().toUpperCase();
          if (aktif !== 'YA') continue;
          if (tampil !== 'YA') continue;
          if (role !== 'USER') continue;
          result.promotor.push({
            namaAbsen: String(r[0]).trim(),
            namaSales: String(r[1]).trim(),
            pin: String(r[3]).trim().replace(/\.0$/, ''),
            ikutUC: String(r[6] || 'YA').trim().toUpperCase(),
            targetUC: Number(r[7]) || 16,
            merk: String(r[8] || '').trim(),
            aktif: true
          });
        }
      }

      // PENJUALAN
      const pj = wb.Sheets['PENJUALAN'];
      if (pj) {
        const rows = XLSX.utils.sheet_to_json(pj, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || !r[1]) continue;
          if (String(r[5]).trim().toUpperCase() === 'TOTAL') continue;
          let tglStr = String(r[2] || '').trim();
          if (tglStr.includes(' ')) tglStr = tglStr.split(' ')[0];
          let tgl = tglStr;
          if (/^\d{4}-\d{2}-\d{2}$/.test(tglStr)) {
            const p = tglStr.split('-');
            tgl = `${p[2]}/${p[1]}/${p[0]}`;
          }
          result.penjualan.push({
            noFaktur: String(r[1]).trim(), tanggal: tgl,
            barcode: String(r[3]).trim(), namaBarang: String(r[5]).trim(),
            qty: Number(r[6]) || 0, subtotal: Number(r[10]) || 0,
            namaSales: String(r[15]).trim(),
            kategori: String(r[17]).trim().toUpperCase(),
            merk: String(r[18]).trim().toUpperCase()
          });
        }
      }

      // ABSENFINGER → per nama per tanggal
      const ab = wb.Sheets['ABSENFINGER'];
      if (ab) {
        const rows = XLSX.utils.sheet_to_json(ab, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || !r[1]) continue;
          const namaAbsen = String(r[0]).trim();
          const cleanKey = sanitizeKey(namaAbsen);
          const tanggal = String(r[1]).trim();
          const tglKey = tanggal.replace(/[^0-9]/g, '-').split('-').filter(Boolean);
          // Pakai format untuk key: coba parse sebagai hari
          const hari = String(r[1]).trim();
          // Format: "2.0" (tanggal 2)
          const hariNum = parseInt(hari) || 0;
          // Buat tanggal dari hari — asumsi bulan = bulan saat ini (dari kolom J)
          // Karena kolom J = bulan, tapi file lama tidak ada data
          // Kita simpan langsung dengan key unik per baris
          if (!result.absensi[cleanKey]) result.absensi[cleanKey] = {};
          result.absensi[cleanKey]['hari_' + hariNum + '_' + i] = {
            hari: hariNum,
            masuk: String(r[2]).trim(),
            istirahat1: String(r[3]).trim(),
            kembali1: String(r[4]).trim(),
            istirahat2: String(r[5]).trim(),
            kembali2: String(r[6]).trim(),
            pulang: String(r[7]).trim(),
            terlambat: String(r[8]).trim().toUpperCase(),
            bulan: String(r[9] || '').trim()
          };
        }
      }

      // Info tambahan
      const parseSheet = (sheet, cols) => {
        if (!sheet) return [];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        const out = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const obj = {};
          cols.forEach((c, idx) => { obj[c] = String(r[idx] || '').trim(); });
          out.push(obj);
        }
        return out;
      };
      result.info.promo = parseSheet(wb.Sheets['PROMO'], ['judul', 'periode', 'detail']);
      result.info.rules = parseSheet(wb.Sheets['RULES'], ['poin', 'deskripsi']);
      result.info.punishment = parseSheet(wb.Sheets['PUNISHMENT'], ['judul', 'level', 'detail']);
      result.info.reward = parseSheet(wb.Sheets['REWARD'], ['judul', 'periode', 'detail']);

      // PELANGGARAN
      const pl = wb.Sheets['PELANGGARAN'];
      if (pl) {
        const rows = XLSX.utils.sheet_to_json(pl, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const cleanKey = sanitizeKey(String(r[0]).trim());
          if (!result.pelanggaran[cleanKey]) result.pelanggaran[cleanKey] = {};
          result.pelanggaran[cleanKey]['item_' + i] = {
            nama: String(r[0]).trim(),
            tanggal: String(r[1] || '').trim(),
            keterangan: String(r[2] || '').trim(),
            denda: String(r[3] || '').trim()
          };
        }
      }

      // RewardSaya
      const rs = wb.Sheets['RewardSaya'];
      if (rs) {
        const rows = XLSX.utils.sheet_to_json(rs, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const cleanKey = sanitizeKey(String(r[0]).trim());
          if (!result.rewardsSaya[cleanKey]) result.rewardsSaya[cleanKey] = {};
          result.rewardsSaya[cleanKey]['item_' + i] = {
            nama: String(r[0]).trim(),
            judul: String(r[1] || '').trim(),
            detail: String(r[2] || '').trim(),
            tanggal: String(r[3] || '').trim()
          };
        }
      }

      el.innerHTML = `
        <div class="alert ok">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Siap: ${result.promotor.length} promotor, ${result.penjualan.length} transaksi, ${Object.keys(result.absensi).length} absensi, ${Object.keys(result.pelanggaran).length} pelanggaran, ${Object.keys(result.rewardsSaya).length} rewards
        </div>
        <button class="btn-success" onclick='konfirmasiUploadMaster()'>
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Konfirmasi Upload
        </button>
      `;
      window._masterData = result;
    } catch (err) {
      el.innerHTML = `<div class="alert err"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> ${err.message}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

async function konfirmasiUploadMaster() {
  const data = window._masterData;
  if (!data) return;
  const el = document.getElementById('masterInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner" style="border-color:rgba(217,119,6,0.3);border-top-color:#d97706;"></span> Uploading... (jangan tutup)</div>';
  try {
    const updates = {};
    data.promotor.forEach(p => {
      updates['users/promotor/' + sanitizeKey(p.namaAbsen)] = p;
    });

    // Cek duplikat penjualan
    const snap = await window.dbGet(window.dbRef(window.db, 'penjualan'));
    const setExist = new Set();
    if (snap.exists()) {
      Object.values(snap.val()).forEach(x => {
        if (x && x.noFaktur && x.barcode) setExist.add(x.noFaktur + '|' + x.barcode);
      });
    }
    let cBaru = 0, cSkip = 0;
    data.penjualan.forEach((item, idx) => {
      const k = item.noFaktur + '|' + item.barcode;
      if (setExist.has(k)) { cSkip++; return; }
      updates['penjualan/t_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).substr(2, 6)] = item;
      cBaru++;
    });

    // Absensi
    Object.keys(data.absensi).forEach(cleanKey => {
      updates['absensi/' + cleanKey] = data.absensi[cleanKey];
    });
    // Info
    if (data.info.promo.length) updates['info/promo'] = data.info.promo;
    if (data.info.rules.length) updates['info/rules'] = data.info.rules;
    if (data.info.punishment.length) updates['info/punishment'] = data.info.punishment;
    if (data.info.reward.length) updates['info/reward'] = data.info.reward;
    // Pelanggaran
    Object.keys(data.pelanggaran).forEach(cleanKey => {
      updates['pelanggaran/' + cleanKey] = data.pelanggaran[cleanKey];
    });
    // RewardsSaya
    Object.keys(data.rewardsSaya).forEach(cleanKey => {
      updates['rewardsSaya/' + cleanKey] = data.rewardsSaya[cleanKey];
    });
    // Metadata
    updates['config/lastUpload'] = { tanggal: Date.now(), totalTransaksi: cBaru, totalPromotor: data.promotor.length };

    await window.dbUpdate(window.dbRef(window.db), updates);
    el.innerHTML = `
      <div class="alert ok">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Berhasil! ${data.promotor.length} promotor, ${cBaru} transaksi baru (${cSkip} duplikat dilewati)
      </div>
    `;
  } catch (err) {
    el.innerHTML = `<div class="alert err"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> ${err.message}</div>`;
  }
}

function handleFilePenjualan(e) {
  const file = e.target.files[0];
  if (!file) return;
  const el = document.getElementById('penjualanInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner" style="border-color:rgba(217,119,6,0.3);border-top-color:#d97706;"></span> Membaca file...</div>';
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      let hIdx = -1;
      for (let i = 0; i < rows.length; i++) {
        if (rows[i][0] === 'Store' && rows[i][1] === 'Nomor Faktur') { hIdx = i; break; }
      }
      if (hIdx === -1) { el.innerHTML = '<div class="alert err">Format tidak dikenali</div>'; return; }
      const parsed = [];
      for (let i = hIdx + 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r || !r[1] || !r[2]) continue;
        if (String(r[5]).trim().toUpperCase() === 'TOTAL') continue;
        let tglStr = String(r[2] || '').trim();
        if (tglStr.includes(' ')) tglStr = tglStr.split(' ')[0];
        let tgl = tglStr;
        if (/^\d{4}-\d{2}-\d{2}$/.test(tglStr)) {
          const p = tglStr.split('-');
          tgl = `${p[2]}/${p[1]}/${p[0]}`;
        }
        parsed.push({
          noFaktur: String(r[1]).trim(), tanggal: tgl,
          barcode: String(r[3]).trim(), namaBarang: String(r[5]).trim(),
          qty: Number(r[6]) || 0, subtotal: Number(r[10]) || 0,
          namaSales: String(r[15]).trim(),
          kategori: String(r[17]).trim().toUpperCase(),
          merk: String(r[18]).trim().toUpperCase()
        });
      }
      const omzet = parsed.filter(x => x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS').reduce((s, x) => s + x.subtotal, 0);
      el.innerHTML = `
        <div class="alert ok">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          ${parsed.length} baris — Omzet: Rp ${omzet.toLocaleString('id-ID')}
        </div>
        <button class="btn-success" onclick='konfirmasiUploadPenjualan()'>
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Konfirmasi Upload
        </button>
      `;
      window._jualData = parsed;
    } catch (err) { el.innerHTML = `<div class="alert err">${err.message}</div>`; }
  };
  reader.readAsArrayBuffer(file);
}

async function konfirmasiUploadPenjualan() {
  const data = window._jualData;
  if (!data) return;
  const el = document.getElementById('penjualanInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner" style="border-color:rgba(217,119,6,0.3);border-top-color:#d97706;"></span> Uploading...</div>';
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'penjualan'));
    const setExist = new Set();
    if (snap.exists()) Object.values(snap.val()).forEach(x => {
      if (x && x.noFaktur && x.barcode) setExist.add(x.noFaktur + '|' + x.barcode);
    });
    const updates = {};
    let cBaru = 0, cSkip = 0;
    data.forEach((item, idx) => {
      const k = item.noFaktur + '|' + item.barcode;
      if (setExist.has(k)) { cSkip++; return; }
      updates['penjualan/t_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).substr(2, 6)] = item;
      cBaru++;
    });
    await window.dbUpdate(window.dbRef(window.db), updates);
    el.innerHTML = `<div class="alert ok"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> ${cBaru} transaksi baru (${cSkip} duplikat)</div>`;
    window._jualData = null;
  } catch (err) { el.innerHTML = `<div class="alert err">${err.message}</div>`; }
}

            </button>

      `).join('')}

async function tambahPromotor() {
  const namaAbsen = document.getElementById('p_namaAbsen').value.trim();
  const namaSales = document.getElementById('p_namaSales').value.trim();
  const pin = document.getElementById('p_pin').value.trim();
  const merk = document.getElementById('p_merk').value.trim();
  const targetUC = Number(document.getElementById('p_targetUC').value) || 16;
  const ikutUC = document.getElementById('p_ikutUC').value;
  const msg = document.getElementById('promotorMsg');
  if (!namaAbsen || !namaSales || !pin) { msg.innerHTML = '<div class="alert err">Isi semua field!</div>'; return; }
  try {
    await window.dbSet(window.dbRef(window.db, 'users/promotor/' + sanitizeKey(namaAbsen)), {
      namaAbsen, namaSales, pin, merk, targetUC, ikutUC, aktif: true
    });
    msg.innerHTML = '<div class="alert ok">Promotor ditambahkan</div>';
    ['p_namaAbsen','p_namaSales','p_pin','p_merk'].forEach(id => document.getElementById(id).value = '');
    setTimeout(() => msg.innerHTML = '', 3000);
  } catch (err) { msg.innerHTML = `<div class="alert err">${err.message}</div>`; }
}

async function hapusPromotor(key, nama) {
  if (!confirm(`Hapus "${nama}"?`)) return;
  await window.dbRemove(window.dbRef(window.db, 'users/promotor/' + key));
}

async function hapusPenjualan() {
  if (!confirm("Hapus SEMUA penjualan?")) return;
  await window.dbRemove(window.dbRef(window.db, 'penjualan'));
  alert("Penjualan dihapus.");
}
async function hapusPromotorAll() {
  if (!confirm("Hapus SEMUA promotor?")) return;
  await window.dbRemove(window.dbRef(window.db, 'users/promotor'));
  alert("Promotor dihapus.");
}
async function hapusSemua() {
  if (prompt('Ketik "HAPUS":') !== 'HAPUS') return;
  await window.dbRemove(window.dbRef(window.db, 'penjualan'));
  await window.dbRemove(window.dbRef(window.db, 'users'));
  await window.dbRemove(window.dbRef(window.db, 'info'));
  await window.dbRemove(window.dbRef(window.db, 'absensi'));
  await window.dbRemove(window.dbRef(window.db, 'pelanggaran'));
  await window.dbRemove(window.dbRef(window.db, 'rewardsSaya'));
  await window.dbRemove(window.dbRef(window.db, 'config/lastUpload'));
  alert("Semua data dihapus.");
}

function sanitizeKey(nama) {
  return String(nama || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_');
}
