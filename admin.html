<script>
let savedPin = localStorage.getItem('ufo_admin_pin3') || '';
let currentTab = 'dash';
let allPromotor = {};
let allPenjualan = {};
let allAbsensi = {};
let allPelanggaran = {};
let allRewardsSaya = {};

/* ===== CONVERT TANGGAL EXCEL KE DD/MM/YYYY ===== */
function convertTanggalExcel(val) {
  if (val === undefined || val === null || val === '') return '';
  
  // KASUS 1: ANGKA SERIAL EXCEL (46032) → konversi
  if (typeof val === 'number' && val > 1 && val < 100000) {
    const epochMs = Date.UTC(1899, 11, 30);
    const ms = epochMs + val * 24 * 60 * 60 * 1000;
    const d = new Date(ms);
    return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear();
  }
  
  const str = String(val).trim();
  if (!str) return '';
  
  // KASUS 2: STRING SERIAL "46032" → konversi
  if (/^\d{5}$/.test(str)) {
    const num = parseInt(str);
    const epochMs = Date.UTC(1899, 11, 30);
    const ms = epochMs + num * 24 * 60 * 60 * 1000;
    const d = new Date(ms);
    return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear();
  }
  
  // KASUS 3: ISO "2026-10-01"
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
    const p = str.split(' ')[0].split('-');
    return `${p[2]}/${p[1]}/${p[0]}`;
  }
  
  // KASUS 4: STRING "MM/DD/YYYY" dari XLSX library → TUKAR ke DD/MM
  if (/^\d{1,2}\/\d{1,2}\/\d{4}/.test(str)) {
    const parts = str.split(' ')[0].split('/');
    const mm = String(parts[0]).padStart(2, '0');
    const dd = String(parts[1]).padStart(2, '0');
    const yyyy = parts[2];
    return `${dd}/${mm}/${yyyy}`;
  }
  
  return str;
}
  /* ===== CONVERT JAM dari angka desimal Excel ===== */
function convertJam(val) {
  if (val === undefined || val === null || val === '') return '';
  if (typeof val === 'number') {
    if (val === 0 || isNaN(val)) return '';
    const totalMenit = Math.round(val * 24 * 60);
    const jam = Math.floor(totalMenit / 60) % 24;
    const menit = totalMenit % 60;
    return String(jam).padStart(2, '0') + ':' + String(menit).padStart(2, '0');
  }
  const str = String(val).trim();
  if (!str) return '';
  if (/^\d*\.?\d+$/.test(str)) {
    const num = parseFloat(str);
    if (isNaN(num) || num === 0) return '';
    if (num < 1) {
      const totalMenit = Math.round(num * 24 * 60);
      const jam = Math.floor(totalMenit / 60) % 24;
      const menit = totalMenit % 60;
      return String(jam).padStart(2, '0') + ':' + String(menit).padStart(2, '0');
    } else {
      const jam = Math.floor(num);
      const menit = Math.round((num - jam) * 60);
      return String(jam).padStart(2, '0') + ':' + String(menit).padStart(2, '0');
    }
  }
  if (str.includes(':')) return str;
  if (str.includes('.')) {
    const parts = str.split('.');
    if (parts.length === 2) {
      return parts[0].padStart(2, '0') + ':' + parts[1].padStart(2, '0').slice(0, 2);
    }
  }
  return str;
}
function sanitizeKey(nama) {
  return String(nama || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_');
}

window.addEventListener('firebase-ready', () => {
  if (savedPin) {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('panelAdmin').classList.remove('hidden');
    mulaiAdmin();
  }
});

async function loginAdmin() {
  const pin = document.getElementById('pinAdmin').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  if (!pin) { errEl.innerHTML = 'Masukkan PIN!'; errEl.classList.remove('hidden'); return; }
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'config/adminPin'));
    let pinBenar = '8888';
    if (snap.exists()) pinBenar = String(snap.val());
    else await window.dbSet(window.dbRef(window.db, 'config/adminPin'), '8888');
    if (pin === pinBenar) {
      savedPin = pin;
      localStorage.setItem('ufo_admin_pin3', pin);
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('panelAdmin').classList.remove('hidden');
      mulaiAdmin();
    } else {
      errEl.innerHTML = 'PIN salah!';
      errEl.classList.remove('hidden');
    }
  } catch (err) { errEl.innerText = 'Gagal: ' + err.message; errEl.classList.remove('hidden'); }
}

function logoutAdmin() {
  localStorage.removeItem('ufo_admin_pin3');
  savedPin = '';
  document.getElementById('panelAdmin').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
}

function mulaiAdmin() {
  window.dbOnValue(window.dbRef(window.db, 'users/promotor'), snap => {
    allPromotor = snap.exists() ? snap.val() : {};
    if (currentTab !== 'upload') renderTab();
  });
  window.dbOnValue(window.dbRef(window.db, 'penjualan'), snap => {
    allPenjualan = snap.exists() ? snap.val() : {};
    if (currentTab === 'dash') renderTab();
  });
 window.dbOnValue(window.dbRef(window.db, 'absensi'), snap => {
  allAbsensi = snap.exists() ? snap.val() : {};
  if (currentTab === 'terlambat') renderTab();
});
  window.dbOnValue(window.dbRef(window.db, 'pelanggaran'), snap => { allPelanggaran = snap.exists() ? snap.val() : {}; });
  window.dbOnValue(window.dbRef(window.db, 'rewardsSaya'), snap => { allRewardsSaya = snap.exists() ? snap.val() : {}; });
  renderTab();
}

function switchTab(tab, evt) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
  renderTab();
}

function renderTab() {
  const el = document.getElementById('tabContent');
  if (currentTab === 'dash') el.innerHTML = renderDash();
  else if (currentTab === 'upload') el.innerHTML = renderUpload();
  else if (currentTab === 'promotor') el.innerHTML = renderPromotor();
  else if (currentTab === 'terlambat') el.innerHTML = renderTerlambat();
  else if (currentTab === 'danger') el.innerHTML = renderDanger();
}

function renderDash() {
  const jmlPromotor = Object.keys(allPromotor).length;
  const trans = Object.values(allPenjualan);
  const jmlTrans = trans.length;
  const jmlAbsensi = Object.keys(allAbsensi).length;
  const jmlPelanggaran = Object.keys(allPelanggaran).length;
  const totalOmzet = trans.filter(x => x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS').reduce((s, x) => s + (Number(x.subtotal) || 0), 0);
  return `
    <div class="card">
      <h3>Statistik Sistem</h3>
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Promotor</div><div class="value">${jmlPromotor}</div></div>
        <div class="stat-card"><div class="label">Transaksi</div><div class="value">${jmlTrans}</div></div>
        <div class="stat-card"><div class="label">Absensi</div><div class="value">${jmlAbsensi}</div></div>
        <div class="stat-card"><div class="label">Pelanggaran</div><div class="value">${jmlPelanggaran}</div></div>
        <div class="stat-card"><div class="label">Rewards</div><div class="value">${Object.keys(allRewardsSaya).length}</div></div>
        <div class="stat-card"><div class="label">Upload</div><div class="value">-</div></div>
        <div class="stat-card full">
          <div class="label">Total Omzet</div>
          <div class="value" style="color:var(--success);font-size:20px;">Rp ${totalOmzet.toLocaleString('id-ID')}</div>
        </div>
      </div>
    </div>
  `;
}

function renderUpload() {
  return `
    <div class="card">
      <h3>Upload Data Master</h3>
      <p style="font-size:12px; color:var(--muted); margin:0 0 10px;">Upload file <b>ABSEN FINGER.xlsx</b> lengkap. Cukup sekali.</p>
      <div class="file-wrap" onclick="document.getElementById('fileMaster').click()">
        <p><strong>Klik pilih file Master</strong></p>
        <input type="file" id="fileMaster" accept=".xlsx,.xls" onchange="handleFileMaster(event); this.value='';">
      </div>
      <div id="masterInfo" style="margin-top:12px;"></div>
    </div>
    <div class="card">
      <h3>Upload Penjualan Harian</h3>
      <p style="font-size:12px; color:var(--muted); margin:0 0 10px;">Upload file <b>Penjualan Detail.xlsx</b> dari kasir.</p>
      <div class="file-wrap" onclick="document.getElementById('filePenjualan').click()">
        <p><strong>Klik pilih file Penjualan</strong></p>
        <input type="file" id="filePenjualan" accept=".xlsx,.xls" onchange="handleFilePenjualan(event); this.value='';">
      </div>
      <div id="penjualanInfo" style="margin-top:12px;"></div>
    </div>
  `;
}

function handleFileMaster(e) {
  const file = e.target.files[0];
  if (!file) return;
  const el = document.getElementById('masterInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner" style="border-color:rgba(217,119,6,0.3);border-top-color:#d97706;"></span> Membaca file...</div>';
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const result = { promotor: [], penjualan: [], absensi: {}, info: {}, pelanggaran: {}, rewardsSaya: {} };

      console.log('📋 Sheet terdeteksi:', wb.SheetNames);

      // MASTER_SALES
      const ms = wb.Sheets['MASTER_SALES'];
      if (ms) {
        const rows = XLSX.utils.sheet_to_json(ms, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const aktif = String(r[2]).trim().toUpperCase();
          const tampil = String(r[5] || '').trim().toUpperCase();
          const role = String(r[4] || 'USER').trim().toUpperCase();
          if (aktif !== 'YA') continue;
          if (tampil !== 'YA') continue;
          if (role !== 'USER') continue;
          result.promotor.push({
            namaAbsen: String(r[0]).trim(),
            namaSales: String(r[1]).trim(),
            pin: String(r[3]).trim().replace(/\.0$/, ''),
            ikutUC: String(r[6] || 'YA').trim().toUpperCase(),
            targetUC: Number(r[7]) || 16,
            merk: String(r[8] || '').trim(),
            aktif: true
          });
        }
      }

      // PENJUALAN
      const pj = wb.Sheets['PENJUALAN'];
      if (pj) {
        const rows = XLSX.utils.sheet_to_json(pj, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0] || !r[1]) continue;
          if (String(r[5]).trim().toUpperCase() === 'TOTAL') continue;
          result.penjualan.push({
            noFaktur: String(r[1]).trim(),
            tanggal: convertTanggalExcel(r[2]),
            barcode: String(r[3]).trim(),
            namaBarang: String(r[5]).trim(),
            qty: Number(r[6]) || 0,
            subtotal: Number(r[10]) || 0,
            namaSales: String(r[15]).trim(),
            kategori: String(r[17]).trim().toUpperCase(),
            merk: String(r[18]).trim().toUpperCase()
          });
        }
      }

      // ABSENFINGER
      const ab = wb.Sheets['ABSENFINGER'];
      if (ab) {
        const rows = XLSX.utils.sheet_to_json(ab, { header: 1, defval: '' });
        console.log('🔍 Sheet ABSENFINGER. Baris:', rows.length);
        let countAbsensi = 0;
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !r[0] || String(r[0]).trim() === '') continue;
          const namaAbsen = String(r[0]).trim();
          if (!namaAbsen) continue;
          let hariNum = 0;
          const tglRaw = r[1];
          if (tglRaw !== undefined && tglRaw !== null && tglRaw !== '') {
            if (typeof tglRaw === 'number') hariNum = Math.floor(tglRaw);
            else hariNum = parseInt(String(tglRaw).trim(), 10) || 0;
          }
          if (hariNum < 1 || hariNum > 31) continue;
          const cleanKey = sanitizeKey(namaAbsen);
          if (!result.absensi[cleanKey]) result.absensi[cleanKey] = {};
          const sudah = Object.keys(result.absensi[cleanKey]).some(k => k === 'hari_' + hariNum);
          if (sudah) continue;
          result.absensi[cleanKey]['hari_' + hariNum] = {
            nama: namaAbsen, hari: hariNum,
            masuk: convertJam(r[2]), istirahat1: convertJam(r[3]),
            kembali1: convertJam(r[4]), istirahat2: convertJam(r[5]),
            kembali2: convertJam(r[6]), pulang: convertJam(r[7]),
            terlambat: String(r[8] || '').trim().toUpperCase(),
            bulan: String(r[9] || '').trim()
          };
          countAbsensi++;
        }
        console.log('✅ Absensi:', Object.keys(result.absensi).length, 'orang,', countAbsensi, 'baris');
      }

      const parseSheet = (sheet, cols) => {
        if (!sheet) return [];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        const out = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const obj = {};
          cols.forEach((c, idx) => { obj[c] = String(r[idx] || '').trim(); });
          out.push(obj);
        }
        return out;
      };
      result.info.promo = parseSheet(wb.Sheets['PROMO'], ['judul', 'periode', 'detail']);
      result.info.rules = parseSheet(wb.Sheets['RULES'], ['poin', 'deskripsi']);
      result.info.punishment = parseSheet(wb.Sheets['PUNISHMENT'], ['judul', 'level', 'detail']);
      result.info.reward = parseSheet(wb.Sheets['REWARD'], ['judul', 'periode', 'detail']);

      const pl = wb.Sheets['PELANGGARAN'];
      if (pl) {
        const rows = XLSX.utils.sheet_to_json(pl, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const cleanKey = sanitizeKey(String(r[0]).trim());
          if (!result.pelanggaran[cleanKey]) result.pelanggaran[cleanKey] = {};
          result.pelanggaran[cleanKey]['item_' + i] = {
            nama: String(r[0]).trim(),
            tanggal: String(r[1] || '').trim(),
            keterangan: String(r[2] || '').trim(),
            denda: String(r[3] || '').trim()
          };
        }
      }

      const rs = wb.Sheets['RewardSaya'];
      if (rs) {
        const rows = XLSX.utils.sheet_to_json(rs, { header: 1, defval: '' });
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r[0]) continue;
          const cleanKey = sanitizeKey(String(r[0]).trim());
          if (!result.rewardsSaya[cleanKey]) result.rewardsSaya[cleanKey] = {};
          result.rewardsSaya[cleanKey]['item_' + i] = {
            nama: String(r[0]).trim(),
            judul: String(r[1] || '').trim(),
            detail: String(r[2] || '').trim(),
            tanggal: String(r[3] || '').trim()
          };
        }
      }

      const totalAbsensi = Object.values(result.absensi).reduce((s, o) => s + Object.keys(o).length, 0);

      el.innerHTML = `
        <div class="alert ok">
          Siap: ${result.promotor.length} promotor • ${result.penjualan.length} transaksi • ${Object.keys(result.absensi).length} orang absensi (${totalAbsensi} hari) • ${Object.keys(result.pelanggaran).length} pelanggaran
        </div>
        <button class="btn-success" onclick="konfirmasiUploadMaster()">Konfirmasi Upload</button>
      `;
      window._masterData = result;
    } catch (err) {
      console.error(err);
      el.innerHTML = `<div class="alert err">${err.message}</div>`;
    }
  };
  reader.readAsArrayBuffer(file);
}

async function konfirmasiUploadMaster() {
  const data = window._masterData;
  if (!data) return;
  const el = document.getElementById('masterInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner" style="border-color:rgba(217,119,6,0.3);border-top-color:#d97706;"></span> Uploading...</div>';
  try {
    const updates = {};
    data.promotor.forEach(p => { updates['users/promotor/' + sanitizeKey(p.namaAbsen)] = p; });

    const snap = await window.dbGet(window.dbRef(window.db, 'penjualan'));
    const setExist = new Set();
    if (snap.exists()) {
      Object.values(snap.val()).forEach(x => {
        if (x && x.noFaktur && x.barcode) setExist.add(x.noFaktur + '|' + x.barcode);
      });
    }
    let cBaru = 0, cSkip = 0;
    data.penjualan.forEach((item, idx) => {
      const k = item.noFaktur + '|' + item.barcode;
      if (setExist.has(k)) { cSkip++; return; }
      updates['penjualan/t_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).substr(2, 6)] = item;
      cBaru++;
    });

    Object.keys(data.absensi).forEach(k => { updates['absensi/' + k] = data.absensi[k]; });
    if (data.info.promo.length) updates['info/promo'] = data.info.promo;
    if (data.info.rules.length) updates['info/rules'] = data.info.rules;
    if (data.info.punishment.length) updates['info/punishment'] = data.info.punishment;
    if (data.info.reward.length) updates['info/reward'] = data.info.reward;
    Object.keys(data.pelanggaran).forEach(k => { updates['pelanggaran/' + k] = data.pelanggaran[k]; });
    Object.keys(data.rewardsSaya).forEach(k => { updates['rewardsSaya/' + k] = data.rewardsSaya[k]; });

    await window.dbUpdate(window.dbRef(window.db), updates);
    const totalAbsensi = Object.values(data.absensi).reduce((s, o) => s + Object.keys(o).length, 0);
    el.innerHTML = `
      <div class="alert ok">✅ Berhasil! ${data.promotor.length} promotor, ${cBaru} transaksi baru (${cSkip} duplikat), ${Object.keys(data.absensi).length} orang absensi (${totalAbsensi} hari)</div>
      <button class="btn-soft" onclick="location.reload()">Refresh Halaman</button>
    `;
    window._masterData = null;
  } catch (err) {
    console.error(err);
    el.innerHTML = `<div class="alert err">${err.message}</div>`;
  }
}

function handleFilePenjualan(e) {
  const file = e.target.files[0];
  if (!file) return;
  const el = document.getElementById('penjualanInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner" style="border-color:rgba(217,119,6,0.3);border-top-color:#d97706;"></span> Membaca file...</div>';
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      let hIdx = -1;
      for (let i = 0; i < rows.length; i++) {
        if (rows[i][0] === 'Store' && rows[i][1] === 'Nomor Faktur') { hIdx = i; break; }
      }
      if (hIdx === -1) { el.innerHTML = '<div class="alert err">Format tidak dikenali</div>'; return; }
      const parsed = [];
      for (let i = hIdx + 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r || !r[1] || !r[2]) continue;
        if (String(r[5]).trim().toUpperCase() === 'TOTAL') continue;
        parsed.push({
          noFaktur: String(r[1]).trim(),
          tanggal: convertTanggalExcel(r[2]),
          barcode: String(r[3]).trim(),
          namaBarang: String(r[5]).trim(),
          qty: Number(r[6]) || 0,
          subtotal: Number(r[10]) || 0,
          namaSales: String(r[15]).trim(),
          kategori: String(r[17]).trim().toUpperCase(),
          merk: String(r[18]).trim().toUpperCase()
        });
      }
      const omzet = parsed.filter(x => x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS').reduce((s, x) => s + x.subtotal, 0);
      el.innerHTML = `
        <div class="alert ok">${parsed.length} baris — Omzet: Rp ${omzet.toLocaleString('id-ID')}</div>
        <button class="btn-success" onclick="konfirmasiUploadPenjualan()">Konfirmasi Upload</button>
      `;
      window._jualData = parsed;
    } catch (err) { el.innerHTML = `<div class="alert err">${err.message}</div>`; }
  };
  reader.readAsArrayBuffer(file);
}

async function konfirmasiUploadPenjualan() {
  const data = window._jualData;
  if (!data) return;
  const el = document.getElementById('penjualanInfo');
  el.innerHTML = '<div class="alert warn"><span class="spinner" style="border-color:rgba(217,119,6,0.3);border-top-color:#d97706;"></span> Uploading...</div>';
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'penjualan'));
    const setExist = new Set();
    if (snap.exists()) Object.values(snap.val()).forEach(x => {
      if (x && x.noFaktur && x.barcode) setExist.add(x.noFaktur + '|' + x.barcode);
    });
    const updates = {};
    let cBaru = 0, cSkip = 0;
    data.forEach((item, idx) => {
      const k = item.noFaktur + '|' + item.barcode;
      if (setExist.has(k)) { cSkip++; return; }
      updates['penjualan/t_' + Date.now() + '_' + idx + '_' + Math.random().toString(36).substr(2, 6)] = item;
      cBaru++;
    });
    await window.dbUpdate(window.dbRef(window.db), updates);
    el.innerHTML = `<div class="alert ok">${cBaru} transaksi baru (${cSkip} duplikat)</div>`;
    window._jualData = null;
  } catch (err) { el.innerHTML = `<div class="alert err">${err.message}</div>`; }
}

async function tambahPromotor() {
  const namaAbsen = document.getElementById('p_namaAbsen').value.trim();
  const namaSales = document.getElementById('p_namaSales').value.trim();
  const pin = document.getElementById('p_pin').value.trim();
  const merk = document.getElementById('p_merk').value.trim();
  const targetUC = Number(document.getElementById('p_targetUC').value) || 16;
  const ikutUC = document.getElementById('p_ikutUC').value;
  const msg = document.getElementById('promotorMsg');
  if (!namaAbsen || !namaSales || !pin) { msg.innerHTML = '<div class="alert err">Isi semua field!</div>'; return; }
  try {
    await window.dbSet(window.dbRef(window.db, 'users/promotor/' + sanitizeKey(namaAbsen)), { namaAbsen, namaSales, pin, merk, targetUC, ikutUC, aktif: true });
    msg.innerHTML = '<div class="alert ok">Promotor ditambahkan</div>';
    ['p_namaAbsen','p_namaSales','p_pin','p_merk'].forEach(id => document.getElementById(id).value = '');
    setTimeout(() => msg.innerHTML = '', 3000);
  } catch (err) { msg.innerHTML = `<div class="alert err">${err.message}</div>`; }
}

async function hapusPromotor(key, nama) {
  if (!confirm(`Hapus "${nama}"?`)) return;
  await window.dbRemove(window.dbRef(window.db, 'users/promotor/' + key));
}

  await window.dbRemove(window.dbRef(window.db, 'users'));

}

function getNamaBulan(bulan) {
  const nama = ['', 'Januari','Februari','Maret','April','Mei','Juni',
                'Juli','Agustus','September','Oktober','November','Desember'];
  return nama[bulan] || '?';
}

function renderTerlambat() {
  const listPromotor = Object.keys(allPromotor).map(k => ({ key: k, ...allPromotor[k] }))
    .sort((a,b) => (a.namaAbsen || '').localeCompare(b.namaAbsen || ''));
  
  const today = new Date();
  const bulanIni = today.getMonth() + 1;
  const tahunIni = today.getFullYear();
  const hariIni = today.getDate();
  
  let html = `
    <div class="card">
      <h3>Kelola Terlambat — ${getNamaBulan(bulanIni)} ${tahunIni}</h3>
      <p style="font-size:12px; color:var(--muted); margin:0 0 12px;">
        Pilih <b>tanggal</b>, lalu klik <b>Tandai Terlambat</b> pada promotor yang telat hari itu.
        Data otomatis muncul di dashboard promotor dengan warna kuning neon.
      </p>
      <div style="background:white; border:1px solid var(--border); border-radius:10px; padding:12px;">
        <label style="margin-bottom:8px;">Tanggal (hari ke-)</label>
        <input type="number" id="tglTerlambat" min="1" max="31" value="${hariIni}" 
               style="width:100px; font-size:16px; text-align:center; font-weight:800;"
               onchange="renderRiwayatTerlambat(Number(this.value))">
      </div>
    </div>
  `;
  
  html += `<div class="card">
    <h3>Daftar Promotor — Tandai Terlambat</h3>
    ${listPromotor.length === 0 ? '<div class="alert warn">Belum ada promotor.</div>' : ''}
  `;
  
 listPromotor.forEach(p => {
    const absensiP = allAbsensi[p.key] || {};
    const hariKeyToday = 'hari_' + hariIni;
    const h = absensiP[hariKeyToday];
    
    // ✅ FIX: Cek apakah finger hari ini sudah ada
    const adaFinger = h && h.masuk && String(h.masuk).trim() !== '' && h.masuk !== '-';
    const sudahTerlambat = adaFinger && String(h.terlambat || '').toUpperCase() === 'YA';
    
    // Hitung total terlambat bulan ini (hanya yang ada finger)
    let totalBulanIni = 0;
    Object.values(absensiP).forEach(a => {
      const adaMasuk = a && a.masuk && String(a.masuk).trim() !== '' && a.masuk !== '-';
      if (adaMasuk && String(a.terlambat || '').toUpperCase() === 'YA') totalBulanIni++;
    });
    
    html += `
      <div class="list-item ${sudahTerlambat ? 'late-item' : ''}">
        <div class="kiri">
          <div class="nama">${p.namaAbsen}</div>
          <div class="detail">
            ${p.namaSales || '-'} • ${p.merk || '-'}
            ${!adaFinger ? '<span style="color:#94a3b8; font-style:italic;"> • Finger belum diupload</span>' : ''}
            ${totalBulanIni > 0 ? `<span style="color:#d97706; font-weight:700;"> • ${totalBulanIni}x terlambat bulan ini</span>` : ''}
          </div>
        </div>
        <div class="kanan">
          ${sudahTerlambat ? '<span class="late-marker">TERLAMBAT</span>' : ''}
          ${adaFinger ? `
            <button class="${sudahTerlambat ? 'btn-danger' : 'btn-soft'} btn-sm" 
                    onclick="toggleTerlambat('${p.key}', ${hariIni}, ${sudahTerlambat})">
              ${sudahTerlambat ? 'Batal' : 'Tandai'}
            </button>
          ` : `
            <button class="btn-soft btn-sm" disabled style="opacity:0.4; cursor:not-allowed;">-</button>
          `}
        </div>
      </div>
    `;
});
  
  html += `</div>`;
  
  html += `<div class="card">
    <h3>Riwayat Terlambat — Tanggal ${hariIni}</h3>
    <div id="riwayatTerlambat"></div>
  </div>`;
  
  setTimeout(() => renderRiwayatTerlambat(hariIni), 100);
  
  return html;
}

function renderRiwayatTerlambat(hari) {
  const el = document.getElementById('riwayatTerlambat');
  if (!el) return;
  
  let rows = [];
  Object.keys(allPromotor).forEach(key => {
    const p = allPromotor[key];
    const absensiP = allAbsensi[key] || {};
    const h = absensiP['hari_' + hari];
    if (h && String(h.terlambat || '').toUpperCase() === 'YA') {
      rows.push({
        nama: p.namaAbsen || '-',
        hari: h.hari || hari,
        masuk: h.masuk || '-',
        pulang: h.pulang || '-'
      });
    }
  });
  
  if (rows.length === 0) {
    el.innerHTML = '<div class="alert warn">Belum ada promotor yang ditandai terlambat di tanggal ini.</div>';
    return;
  }
  
  el.innerHTML = rows.map(r => `
    <div class="list-item">
      <div class="kiri">
        <div class="nama">${r.nama}</div>
        <div class="detail">Masuk: ${r.masuk} • Pulang: ${r.pulang}</div>
      </div>
      <div class="kanan">
        <span class="late-marker">TERLAMBAT</span>
      </div>
    </div>
  `).join('');
}

async function toggleTerlambat(promotorKey, hari, sudahTerlambat) {
  try {
    const path = `absensi/${promotorKey}/hari_${hari}`;
    const snap = await window.dbGet(window.dbRef(window.db, path));
    
    if (snap.exists()) {
      await window.dbUpdate(window.dbRef(window.db, path), {
        terlambat: sudahTerlambat ? '' : 'YA'
      });
    } else {
      const today = new Date();
      await window.dbSet(window.dbRef(window.db, path), {
        nama: allPromotor[promotorKey]?.namaAbsen || '',
        hari: Number(hari),
        masuk: '',
        istirahat1: '',
        kembali1: '',
        istirahat2: '',
        kembali2: '',
        pulang: '',
        terlambat: sudahTerlambat ? '' : 'YA',
        bulan: getNamaBulan(today.getMonth() + 1)
      });
    }
    
    renderTab();
  } catch (err) {
    alert('Gagal update: ' + err.message);
  }
}
