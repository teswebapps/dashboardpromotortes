<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promotor — Rekap Penjualan UFO Kebonsari</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrrS4E_6e3G1DBfqkFbWoYLhdq6ZIzapg",
  authDomain: "tes-webapps.firebaseapp.com",
  databaseURL: "https://tes-webapps-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tes-webapps",
  storageBucket: "tes-webapps.firebasestorage.app",
  messagingSenderId: "87638829660",
  appId: "1:87638829660:web:5a04a73f02206803fa9499"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

signInAnonymously(auth).then(() => {
  window.db = db;
  window.dbRef = ref;
  window.dbSet = set;
  window.dbGet = get;
  window.dbUpdate = update;
  window.dbRemove = remove;
  window.dbOnValue = onValue;
  window.dbPush = push;
  window.dispatchEvent(new Event('firebase-ready'));
}).catch(err => {
  alert("Gagal koneksi Firebase: " + err.message);
});

onAuthStateChanged(auth, user => {
  if (!user) setTimeout(() => location.reload(), 1000);
});
</script>

<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --soft: #f1f5f9;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e2e8f0;
  --primary: #2563eb;
  --success: #059669;
  --danger: #dc2626;
  --warning: #d97706;
  --gold: #d4af37;
}
* { box-sizing: border-box; font-family: 'Inter', sans-serif !important; }
body {
  margin: 0; padding: 16px;
  background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
  color: var(--text); min-height: 100vh;
  display: flex; justify-content: center;
}
.container {
  width: 100%; max-width: 720px;
  background: var(--card); border-radius: 20px;
  padding: 24px; border: 1px solid var(--border);
  box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.05);
  height: fit-content;
}
.header {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  border-radius: 14px; padding: 20px; color: white;
  text-align: center; margin-bottom: 20px;
}
.header h1 { margin: 0; font-size: 20px; font-weight: 800; }
.header p { margin: 6px 0 0; font-size: 12.5px; color: #94a3b8; }
.card {
  background: var(--soft); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px; margin-bottom: 16px;
}
.card h3 {
  margin: 0 0 12px; font-size: 13px; font-weight: 800;
  text-transform: uppercase; color: var(--primary);
  letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px;
}
label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 6px; letter-spacing: 0.3px;
}
input, select {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: #f8fafc;
  font-size: 14px; font-weight: 600; color: var(--text);
  outline: none; box-sizing: border-box;
}
input:focus { border-color: var(--primary); background: #fff; }
button {
  width: 100%; padding: 12px 16px; border-radius: 12px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  border: none; text-transform: uppercase;
  letter-spacing: 0.3px; transition: all 0.2s;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: #1d4ed8; }
.btn-soft { background: var(--soft); color: var(--text); border: 1px solid var(--border); }
.btn-soft:hover { background: #e2e8f0; }
.hidden { display: none !important; }
.user-badge {
  display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white; padding: 14px 18px; border-radius: 12px;
  margin-bottom: 16px; gap: 10px;
}
.user-badge .nama { font-weight: 800; font-size: 15px; }
.user-badge .role { font-size: 11px; color: #94a3b8; font-weight: 600; margin-top: 2px; }
.user-badge button {
  width: auto; padding: 8px 14px; font-size: 11px;
  background: rgba(255,255,255,0.1); color: white;
  border: 1px solid rgba(255,255,255,0.2);
}
.tabs {
  display: flex; gap: 6px; margin-bottom: 14px;
  overflow-x: auto; padding-bottom: 4px;
}
.tab-btn {
  flex-shrink: 0; padding: 9px 16px; border-radius: 10px;
  background: var(--soft); border: 1px solid var(--border);
  color: var(--muted); font-size: 11.5px; font-weight: 700;
  cursor: pointer; text-transform: uppercase; letter-spacing: 0.3px;
}
.tab-btn.active {
  background: var(--primary); color: white; border-color: var(--primary);
}
.stat-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 10px; margin-bottom: 14px;
}
.stat-card {
  background: white; border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; text-align: center;
}
.stat-card .label {
  font-size: 10px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.3px;
  margin-bottom: 6px;
}
.stat-card .value {
  font-size: 18px; font-weight: 900; color: var(--primary);
  line-height: 1.2;
}
.stat-card .value.green { color: var(--success); }
.stat-card .value.gold { color: var(--gold); }
.stat-card .value.red { color: var(--danger); }
.stat-card.full { grid-column: 1 / -1; }
.list-item {
  background: white; border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; margin-bottom: 8px;
  display: flex; justify-content: space-between;
  align-items: flex-start; gap: 10px;
}
.list-item .kiri { flex: 1; min-width: 0; }
.list-item .produk {
  font-size: 12.5px; font-weight: 700;
  color: var(--text); margin-bottom: 3px;
  word-break: break-word;
}
.list-item .info {
  font-size: 10.5px; color: var(--muted); font-weight: 600;
}
.list-item .kanan { text-align: right; flex-shrink: 0; }
.list-item .harga {
  font-size: 13px; font-weight: 800; color: var(--success);
}
.list-item .qty {
  font-size: 10px; color: var(--muted); font-weight: 700; margin-top: 2px;
}
.empty {
  text-align: center; padding: 30px 15px;
  color: var(--muted); font-size: 13px;
  background: white; border-radius: 12px;
  border: 1px dashed var(--border);
}
.empty .icon { font-size: 32px; margin-bottom: 8px; }
.rank-item {
  display: flex; align-items: center; gap: 12px;
  background: white; border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px;
  margin-bottom: 6px;
}
.rank-item.me {
  background: linear-gradient(135deg, #dbeafe, #bfdbfe);
  border-color: var(--primary);
}
.rank-item .pos {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--soft); border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 12px; flex-shrink: 0;
}
.rank-item .pos.gold { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
.rank-item .pos.silver { background: #f1f5f9; color: #475569; border-color: #94a3b8; }
.rank-item .pos.bronze { background: #fed7aa; color: #9a3412; border-color: #fb923c; }
.rank-item .nama { flex: 1; font-size: 13px; font-weight: 700; }
.rank-item .omzet { font-size: 12.5px; font-weight: 800; color: var(--success); }
.info-block {
  background: white; border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; margin-bottom: 8px;
}
.info-block .judul {
  font-size: 13px; font-weight: 800; color: var(--primary);
  margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
}
.info-block .deskripsi {
  font-size: 12px; color: var(--text); line-height: 1.5;
}
.info-block .meta {
  font-size: 11px; color: var(--muted); margin-top: 4px;
}
@media (max-width: 480px) {
  body { padding: 12px; }
  .container { padding: 16px; border-radius: 16px; }
  .stat-card .value { font-size: 16px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>💰 Rekap Penjualan UFO</h1>
    <p>Malang Kebonsari</p>
  </div>

  <!-- LOGIN -->
  <div id="loginBox">
    <div class="card">
      <h3>🔐 Login Promotor</h3>
      <label>Nama Absen</label>
      <select id="selectNama">
        <option value="">-- Memuat daftar promotor --</option>
      </select>
      <div style="height:10px;"></div>
      <label>PIN</label>
      <input type="password" id="inputPin" placeholder="••••" maxlength="6"
        inputmode="numeric" pattern="[0-9]*"
        style="text-align:center; font-size:18px; letter-spacing:6px; font-weight:800;"
        oninput="this.value = this.value.replace(/\D/g, '')"
        onkeypress="if(event.key === 'Enter') loginPromotor()">
      <div style="height:10px;"></div>
      <button class="btn-primary" onclick="loginPromotor()">Masuk</button>
      <div id="loginError" class="alert err hidden" style="margin-top:10px;"></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <div class="user-badge">
      <div>
        <div class="nama" id="userNama">-</div>
        <div class="role">PROMOTOR</div>
      </div>
      <button onclick="logoutPromotor()">🚪 Keluar</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('dash', event)">📊 Dashboard</button>
      <button class="tab-btn" onclick="switchTab('hari', event)">📅 Hari Ini</button>
      <button class="tab-btn" onclick="switchTab('minggu', event)">📆 Minggu</button>
      <button class="tab-btn" onclick="switchTab('bulan', event)">🗓️ Bulan</button>
      <button class="tab-btn" onclick="switchTab('brand', event)">🏷️ Brand</button>
      <button class="tab-btn" onclick="switchTab('rank', event)">🏆 Ranking</button>
      <button class="tab-btn" onclick="switchTab('info', event)">ℹ️ Info</button>
    </div>

    <div id="tabContent"></div>

    <div style="height:8px;"></div>
    <button class="btn-soft" onclick="logoutPromotor()">🚪 Keluar</button>
  </div>
</div>

<script>
let allPenjualan = [];
let allPromotor = {};
let infoData = { promo: [], rules: [], punishment: [], reward: [] };
let currentUser = null;
let currentTab = 'dash';

window.addEventListener('firebase-ready', () => {
  loadPromotorList();
  const saved = localStorage.getItem('ufo_promotor_session');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      currentUser = data;
      tampilkanDashboard();
    } catch(e) {}
  }
});

function loadPromotorList() {
  window.dbOnValue(window.dbRef(window.db, 'users/promotor'), snap => {
    const sel = document.getElementById('selectNama');
    if (!snap.exists()) {
      sel.innerHTML = '<option value="">-- Belum ada promotor (hubungi admin) --</option>';
      return;
    }
    allPromotor = snap.val();
    const list = Object.keys(allPromotor).map(k => ({ key: k, ...allPromotor[k] }))
      .filter(p => p.aktif !== false)
      .sort((a,b) => a.namaAbsen.localeCompare(b.namaAbsen));
    const curVal = sel.value;
    sel.innerHTML = '<option value="">-- Pilih Nama --</option>' +
      list.map(p => `<option value="${p.key}">${p.namaAbsen}</option>`).join('');
    if (curVal) sel.value = curVal;
  });
}

async function loginPromotor() {
  const key = document.getElementById('selectNama').value;
  const pin = document.getElementById('inputPin').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  if (!key) { errEl.innerText = 'Pilih nama dulu!'; errEl.classList.remove('hidden'); return; }
  if (!pin) { errEl.innerText = 'Masukkan PIN!'; errEl.classList.remove('hidden'); return; }
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'users/promotor/' + key));
    if (!snap.exists()) {
      errEl.innerText = 'Promotor tidak ditemukan.'; errEl.classList.remove('hidden'); return;
    }
    const data = snap.val();
    if (String(data.pin) !== pin) {
      errEl.innerText = '❌ PIN salah!'; errEl.classList.remove('hidden');
      document.getElementById('inputPin').value = '';
      return;
    }
    currentUser = { key, ...data };
    localStorage.setItem('ufo_promotor_session', JSON.stringify(currentUser));
    tampilkanDashboard();
  } catch (err) {
    errEl.innerText = 'Gagal: ' + err.message; errEl.classList.remove('hidden');
  }
}

function logoutPromotor() {
  if (!confirm("Yakin ingin keluar?")) return;
  localStorage.removeItem('ufo_promotor_session');
  currentUser = null;
  allPenjualan = [];
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
  document.getElementById('selectNama').value = '';
  document.getElementById('inputPin').value = '';
}

function tampilkanDashboard() {
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('userNama').innerText = currentUser.namaAbsen;

  window.dbOnValue(window.dbRef(window.db, 'penjualan'), snap => {
    allPenjualan = [];
    if (snap.exists()) {
      const data = snap.val();
      Object.values(data).forEach(item => {
        if (item && item.namaSales) allPenjualan.push(item);
      });
    }
    renderTab();
  });

  window.dbOnValue(window.dbRef(window.db, 'info'), snap => {
    if (snap.exists()) {
      const data = snap.val();
      infoData.promo = data.promo || [];
      infoData.rules = data.rules || [];
      infoData.punishment = data.punishment || [];
      infoData.reward = data.reward || [];
    }
    if (currentTab === 'info') renderTab();
  });
}

function switchTab(tab, evt) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  if (evt && evt.target) evt.target.classList.add('active');
  renderTab();
}

/* ============================================================ */
/* HELPER */
/* ============================================================ */
function parseTanggal(str) {
  if (!str) return null;
  const p = String(str).split('/');
  if (p.length !== 3) return null;
  return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
}
function isHariIni(tgl) {
  const d = parseTanggal(tgl); if (!d) return false;
  const n = new Date();
  return d.getDate() === n.getDate() && d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
}
function isMingguIni(tgl) {
  const d = parseTanggal(tgl); if (!d) return false;
  const n = new Date();
  const start = new Date(n); start.setDate(n.getDate() - n.getDay()); start.setHours(0,0,0,0);
  const end = new Date(start); end.setDate(start.getDate() + 7);
  return d >= start && d < end;
}
function isBulanIni(tgl) {
  const d = parseTanggal(tgl); if (!d) return false;
  const n = new Date();
  return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
}
function getDataSaya() {
  return allPenjualan.filter(x => x.namaSales === currentUser.namaSales);
}
function hitungOmzet(list) {
  return list.filter(x => x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS')
             .reduce((s, x) => s + (Number(x.subtotal) || 0), 0);
}
function hitungUnit(list) {
  return list.filter(x => x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS')
             .reduce((s, x) => s + (Number(x.qty) || 0), 0);
}
function hitungUC(list) {
  return list.filter(x => x.kategori === 'GARANSI')
             .reduce((s, x) => s + (Number(x.qty) || 0), 0);
}

/* ============================================================ */
/* RENDER */
/* ============================================================ */
function renderTab() {
  const el = document.getElementById('tabContent');
  if (currentTab === 'dash') el.innerHTML = renderDashboard();
  else if (currentTab === 'hari') el.innerHTML = renderListFilter(isHariIni, 'Hari Ini');
  else if (currentTab === 'minggu') el.innerHTML = renderListFilter(isMingguIni, 'Minggu Ini');
  else if (currentTab === 'bulan') el.innerHTML = renderListFilter(isBulanIni, 'Bulan Ini');
  else if (currentTab === 'brand') el.innerHTML = renderBrand();
  else if (currentTab === 'rank') el.innerHTML = renderRanking();
  else if (currentTab === 'info') el.innerHTML = renderInfo();
}

function renderDashboard() {
  const dataSaya = getDataSaya();
  const dataHari = dataSaya.filter(x => isHariIni(x.tanggal));
  const dataBulan = dataSaya.filter(x => isBulanIni(x.tanggal));

  const omzetHari = hitungOmzet(dataHari);
  const omzetBulan = hitungOmzet(dataBulan);
  const unitBulan = hitungUnit(dataBulan);
  const ucBulan = hitungUC(dataBulan);

  const rank = hitungRankingList();
  const posSaya = rank.findIndex(x => x.namaSales === currentUser.namaSales) + 1;

  const targetUC = Number(currentUser.targetUC) || 0;
  const ikutUC = currentUser.ikutUC === 'YA';
  const kurangUC = ikutUC && ucBulan < targetUC ? (targetUC - ucBulan) : 0;

  return `
    <div class="stat-grid">
      <div class="stat-card full">
        <div class="label">Omzet Hari Ini</div>
        <div class="value green">Rp ${omzetHari.toLocaleString('id-ID')}</div>
      </div>
      <div class="stat-card full">
        <div class="label">Omzet Bulan Ini</div>
        <div class="value green">Rp ${omzetBulan.toLocaleString('id-ID')}</div>
      </div>
      <div class="stat-card">
        <div class="label">Unit Bulan Ini</div>
        <div class="value">${unitBulan}</div>
      </div>
      <div class="stat-card">
        <div class="label">UC ${ikutUC ? `(Target ${targetUC})` : '(Non-Target)'}</div>
        <div class="value ${kurangUC > 0 ? 'red' : 'gold'}">${ucBulan}${kurangUC > 0 ? ' ⚠️' : ''}</div>
      </div>
      <div class="stat-card full">
        <div class="label">Peringkat Toko</div>
        <div class="value">#${posSaya || '-'} dari ${rank.length} promotor</div>
      </div>
    </div>
    <div class="card" style="margin-top:12px;">
      <h3>📊 5 Transaksi Terakhir</h3>
      ${dataSaya.slice(-5).reverse().map(x => renderItem(x)).join('') || '<div class="empty"><div class="icon">📭</div>Belum ada transaksi</div>'}
    </div>
  `;
}

function renderListFilter(filterFn, judul) {
  const list = getDataSaya().filter(x => filterFn(x.tanggal));
  const omzet = hitungOmzet(list);
  const unit = hitungUnit(list);
  const uc = hitungUC(list);
  return `
    <div class="stat-grid">
      <div class="stat-card full">
        <div class="label">Omzet ${judul}</div>
        <div class="value green">Rp ${omzet.toLocaleString('id-ID')}</div>
      </div>
      <div class="stat-card"><div class="label">Unit</div><div class="value">${unit}</div></div>
      <div class="stat-card"><div class="label">UC</div><div class="value gold">${uc}</div></div>
    </div>
    <div style="margin-top:12px;">
      ${list.length === 0 ? '<div class="empty"><div class="icon">📭</div>Belum ada transaksi</div>' 
        : list.slice().reverse().map(x => renderItem(x)).join('')}
    </div>
  `;
}

function renderItem(x) {
  return `
    <div class="list-item">
      <div class="kiri">
        <div class="produk">${x.namaBarang || '-'}</div>
        <div class="info">${x.tanggal} • ${x.merk || '-'} • ${x.kategori || '-'}</div>
      </div>
      <div class="kanan">
        <div class="harga">Rp ${Number(x.subtotal || 0).toLocaleString('id-ID')}</div>
        <div class="qty">Qty: ${x.qty || 0}</div>
      </div>
    </div>
  `;
}

function renderBrand() {
  const list = getDataSaya().filter(x => isBulanIni(x.tanggal) && x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS');
  const perBrand = {};
  list.forEach(x => {
    const b = x.merk || 'TANPA MERK';
    if (!perBrand[b]) perBrand[b] = { omzet: 0, unit: 0 };
    perBrand[b].omzet += Number(x.subtotal) || 0;
    perBrand[b].unit += Number(x.qty) || 0;
  });
  const arr = Object.keys(perBrand).map(k => ({ brand: k, ...perBrand[k] })).sort((a,b) => b.omzet - a.omzet);
  return `
    <div class="card">
      <h3>🏷️ Rekap Brand — Bulan Ini</h3>
      ${arr.length === 0 ? '<div class="empty"><div class="icon">📦</div>Belum ada penjualan</div>'
        : arr.map(x => `
          <div class="list-item">
            <div class="kiri">
              <div class="produk">${x.brand}</div>
              <div class="info">${x.unit} unit terjual</div>
            </div>
            <div class="kanan">
              <div class="harga">Rp ${x.omzet.toLocaleString('id-ID')}</div>
            </div>
          </div>
        `).join('')}
    </div>
  `;
}

function hitungRankingList() {
  const perSales = {};
  allPenjualan.filter(x => isBulanIni(x.tanggal) && x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS')
    .forEach(x => {
      const n = x.namaSales;
      if (!perSales[n]) perSales[n] = { namaSales: n, omzet: 0, unit: 0 };
      perSales[n].omzet += Number(x.subtotal) || 0;
      perSales[n].unit += Number(x.qty) || 0;
    });
  return Object.values(perSales).sort((a,b) => b.omzet - a.omzet);
}

function renderRanking() {
  const rank = hitungRankingList();
  // Map namaSales ke namaAbsen
  const mapNama = {};
  Object.values(allPromotor).forEach(p => { mapNama[p.namaSales] = p.namaAbsen; });
  return `
    <div class="card">
      <h3>🏆 Ranking Omzet — Bulan Ini</h3>
      ${rank.length === 0 ? '<div class="empty"><div class="icon">🏆</div>Belum ada data</div>'
        : rank.map((x, i) => {
          const isMe = x.namaSales === currentUser.namaSales;
          const pos = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
          const nama = mapNama[x.namaSales] || x.namaSales;
          return `
            <div class="rank-item ${isMe ? 'me' : ''}">
              <div class="pos ${pos}">${i + 1}</div>
              <div class="nama">${nama}${isMe ? ' <span style="color:var(--primary);">(Anda)</span>' : ''}</div>
              <div class="omzet">Rp ${x.omzet.toLocaleString('id-ID')}</div>
            </div>
          `;
        }).join('')}
    </div>
  `;
}

function renderInfo() {
  const renderInfoList = (arr, icon, judulField, subField, detailField) => {
    if (!arr || arr.length === 0) return `<div class="empty"><div class="icon">📭</div>Belum ada data</div>`;
    return arr.map(x => `
      <div class="info-block">
        <div class="judul">${icon} ${x[judulField] || '-'}</div>
        ${subField && x[subField] ? `<div class="meta">${x[subField]}</div>` : ''}
        ${detailField && x[detailField] ? `<div class="deskripsi" style="margin-top:6px;">${x[detailField]}</div>` : ''}
      </div>
    `).join('');
  };
  return `
    <div class="card">
      <h3>🏷️ Promo Toko</h3>
      ${renderInfoList(infoData.promo, '🔥', 'judul', 'periode', 'detail')}
    </div>
    <div class="card">
      <h3>✨ SOP Promotor</h3>
      ${renderInfoList(infoData.rules, '📌', 'poin', null, 'deskripsi')}
    </div>
    <div class="card">
      <h3>⚠️ Punishment</h3>
      ${renderInfoList(infoData.punishment, '⚠️', 'judul', 'level', 'detail')}
    </div>
    <div class="card">
      <h3>🏆 Reward</h3>
      ${renderInfoList(infoData.reward, '🏆', 'judul', 'periode', 'detail')}
    </div>
  `;
}
</script>
