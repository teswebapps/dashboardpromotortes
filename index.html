<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNj8nRMP0ijH1GUXKeJlsE-EG5AYCkHBU",
  authDomain: "dashboardpromotor.firebaseapp.com",
  databaseURL: "https://dashboardpromotor-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dashboardpromotor",
  storageBucket: "dashboardpromotor.firebasestorage.app",
  messagingSenderId: "474469951678",
  appId: "1:474469951678:web:f769fed156a36505cbd6ef"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

window.db = db;
window.dbGet = get;
window.dbRef = ref;
window.dbOnValue = onValue;
window.firebaseAuth = auth;
window.firebaseSignOut = signOut;
window.firebaseGoogleAuthProvider = GoogleAuthProvider;
window.firebaseSignInWithPopup = signInWithPopup;

// ========= BULAN HELPER =========
function getBulanIni() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
window.getBulanIni = getBulanIni;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.firebaseUser = null;
    window.dispatchEvent(new Event('firebase-ready'));
    return;
  }
  if (!user.email) {
    alert('Akun Google Anda tidak mengirimkan email.');
    await signOut(auth);
    return;
  }
  try {
    const emailKey = user.email.replace(/\./g, ',');
    const snap = await get(ref(db, 'users/whitelist/' + emailKey));
    if (!snap.exists()) {
      alert('Akun Google Anda (' + user.email + ') tidak terdaftar. Hubungi admin.');
      await signOut(auth);
      return;
    }
    const wl = snap.val();
    window.firebaseUser = {
      email: user.email,
      uid: user.uid,
      namaTampil: wl.nama || user.displayName || user.email,
      role: wl.role || 'PROMOTOR',
      promotorKey: wl.promotorKey || null
    };
    window.dispatchEvent(new Event('firebase-ready'));
  } catch (err) {
    console.error('Gagal verifikasi whitelist:', err);
    alert('Gagal verifikasi akun: ' + err.message);
    await signOut(auth);
  }
});
</script>

  const nama = ['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const [thn, bln] = bulanStr.split('-');
  return `${nama[parseInt(bln)]} ${thn}`;
}

function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
window.escapeHtml = escapeHtml;

function safeImageUrl(url) {
    if (!url) return '';
    const s = String(url).trim();
    if (!/^https:\/\//i.test(s) && !/^data:image\//i.test(s)) return '';
    return escapeHtml(s);
}
window.safeImageUrl = safeImageUrl;

/* ===== FIREBASE READY ===== */
window.addEventListener('firebase-ready', () => {
  initParticles();
  loadPromotorList();
  loadInfoRealtime();
  if (window.firebaseUser) setTimeout(() => tampilkanDashboard(), 400);
});

function initParticles() {
    const container = document.getElementById('fut-particles');
    if (!container) return;
    container.innerHTML = '';
    for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'fut-particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        const colors = ['#22d3ee', '#a855f7', '#3b82f6'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        p.style.background = color;
        p.style.boxShadow = `0 0 6px ${color}, 0 0 12px ${color}`;
        container.appendChild(p);
    }
}

async function loginDenganGoogle() {
    const btn = document.getElementById('btn-login-google');
    const txt = document.getElementById('btn-login-text');
    const asli = txt.innerText;
    btn.disabled = true;
    txt.innerText = 'MEMBUKA GOOGLE...';
    try {
        const provider = new window.firebaseGoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        await window.firebaseSignInWithPopup(window.firebaseAuth, provider);
    } catch (err) {
        console.error('Login gagal:', err);
        if (err.code !== 'auth/popup-closed-by-user') alert('Login gagal: ' + err.message);
        btn.disabled = false;
        txt.innerText = asli;
    }
}
window.loginDenganGoogle = loginDenganGoogle;

function loadPromotorList() {
  const liveEl = document.getElementById('live-status-text');
  if (!window.firebaseAuth || !window.firebaseAuth.currentUser) {
    if (liveEl) liveEl.innerText = 'Sistem Siap';
    return;
  }
  window.dbOnValue(window.dbRef(window.db, 'users/promotor'), snap => {
    if (!snap.exists()) { allPromotor = {}; if (liveEl) liveEl.innerText = 'Belum ada promotor'; return; }
    allPromotor = snap.val();
    const list = Object.keys(allPromotor).map(k => ({ key: k, ...allPromotor[k] })).filter(p => p.aktif !== false).sort((a,b) => (a.namaAbsen || '').localeCompare(b.namaAbsen || ''));
    if (liveEl) liveEl.innerText = `${list.length} promotor terdaftar`;
    if (currentUser && currentUser.role === 'ADMIN') isiDropdownPromotor(list);
  }, (error) => {
    console.error('Gagal load promotor:', error);
    if (liveEl) liveEl.innerText = 'Akses ditolak';
  });
}

function isiDropdownPromotor(list) {
  const menuEl = document.getElementById('dropdownMenu');
  const labelEl = document.getElementById('dropdownLabel');
  const hiddenInput = document.getElementById('selectPromotor');
  if (!menuEl) return;
  if (!list || list.length === 0) {
    menuEl.innerHTML = '<div class="dd-option" style="color:#64748b;font-style:italic;justify-content:center;">Belum ada promotor</div>';
    if (labelEl) labelEl.innerText = '-- Pilih Nama Promotor --';
    return;
  }
  let html = '';
  list.forEach(p => {
    const key = escapeHtml(p.key);
    const label = escapeHtml(p.namaAbsen || '-');
    html += `<div class="dd-option" data-value="${key}" onclick="pilihDropdownPromotor('${key}', '${label}')">${label}</div>`;
  });
  menuEl.innerHTML = html;
  if (promotorTerpilih && allPromotor[promotorTerpilih]) {
    const activeProm = allPromotor[promotorTerpilih];
    if (labelEl) labelEl.innerText = activeProm.namaAbsen || '-';
    if (hiddenInput) hiddenInput.value = promotorTerpilih;
    const selectedOpt = menuEl.querySelector(`.dd-option[data-value="${promotorTerpilih}"]`);
    if (selectedOpt) {
      menuEl.querySelectorAll('.dd-option').forEach(o => o.classList.remove('selected'));
      selectedOpt.classList.add('selected');
    }
  } else {
    if (labelEl) labelEl.innerText = '-- Pilih Nama Promotor --';
    if (hiddenInput) hiddenInput.value = '';
  }
}
window.isiDropdownPromotor = isiDropdownPromotor;

function toggleDropdownPromotor() {
  const menu = document.getElementById('dropdownMenu');
  const trigger = document.getElementById('dropdownTrigger');
  if (!menu || !trigger) return;
  menu.classList.toggle('open');
  trigger.classList.toggle('open');
}
window.toggleDropdownPromotor = toggleDropdownPromotor;

function pilihDropdownPromotor(key, label) {
  const menu = document.getElementById('dropdownMenu');
  const trigger = document.getElementById('dropdownTrigger');
  const labelEl = document.getElementById('dropdownLabel');
  const hidden = document.getElementById('selectPromotor');
  if (hidden) hidden.value = key;
  if (labelEl) labelEl.innerText = label;
  if (menu) {

/* ===== HELPER ===== */
function tanggalKeNama(tglStr) {
  if (!tglStr) return '-';
  const parts = String(tglStr).split('/');
  if (parts.length !== 3) return tglStr;
  const mm = parseInt(parts[1]);
  const dd = parseInt(parts[0]);
  const yyyy = parts[2];
  if (isNaN(dd) || isNaN(mm)) return tglStr;
  const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni','Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  return `${dd} ${namaBulan[mm - 1] || '?'} ${yyyy}`;
}

function parseTanggal(str) {
  if (!str) return null;
  const p = String(str).split('/');
  if (p.length !== 3) return null;
  return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
}

function getPeriodeRentangDinamis() {
  if (!allPenjualan || allPenjualan.length === 0) return { pertama: '1 ' + getNamaBulanIndo(BULAN_INI), terakhir: getNamaBulanIndo(BULAN_INI) };
  const tglValid = allPenjualan.map(x => x.tanggal).filter(Boolean).sort((a, b) => (parseTanggal(a) || 0) - (parseTanggal(b) || 0));
  if (tglValid.length === 0) return { pertama: '-', terakhir: '-' };
  return { pertama: tanggalKeNama(tglValid[0]), terakhir: tanggalKeNama(tglValid[tglValid.length - 1]) };
}

function getDataSaya() {
    if (!currentUser) return [];
    const targetKey = (currentUser.role === 'ADMIN' && promotorTerpilih) ? promotorTerpilih : currentUser.key;
    const dataP = allPromotor[targetKey] || currentUser;
    const namaAbsenUser = String(dataP.namaAbsen || '').trim().toUpperCase();
    const namaSalesUser = String(dataP.namaSales || '').trim().toUpperCase();
    return allPenjualan.filter(x => {
        if (!x) return false;
        const salesTrans = String(x.namaSales || '').trim().toUpperCase();
        return (namaSalesUser && salesTrans === namaSalesUser) || (namaAbsenUser && (salesTrans.includes(namaAbsenUser) || namaAbsenUser.includes(salesTrans)));
    });
}

function getPromotorTerpilih() {
    const targetKey = (currentUser.role === 'ADMIN' && promotorTerpilih) ? promotorTerpilih : currentUser.key;
    return allPromotor[targetKey] || currentUser;
}

/* ===== RENDER ABSENSI ===== */
function renderAbsensi() {
  const isAdmin = currentUser.role === 'ADMIN';
  if (isAdmin && !promotorTerpilih) return `<div class="empty-state">${ICONS.empty}<div class="pesan">Pilih promotor dulu</div></div>`;
  let entries = [];
  const targetKey = isAdmin ? promotorTerpilih : currentUser.key;
  let dataP = {};
  if (allAbsensiAll[targetKey]) dataP = allAbsensiAll[targetKey];
  else if (allAbsensi) dataP = allAbsensi;
  Object.values(dataP).forEach(item => { if (item && typeof item === 'object' && (item.hari || item.masuk || item.pulang)) entries.push(item); });
  entries.sort((a, b) => (Number(a.hari) || 0) - (Number(b.hari) || 0));
  if (entries.length === 0) return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data absensi bulan ini</div></div>`;
  let totalTerlambat = 0, tidakMasuk = 0, tidakPulang = 0;
  entries.forEach(x => {
    const isNoMasuk = !x.masuk || String(x.masuk).trim() === "" || x.masuk === "-";
    const isNoPulang = !x.pulang || String(x.pulang).trim() === "" || x.pulang === "-";
    const isTerlambat = !isNoMasuk && ['YA','Y','YES','TRUE'].includes(String(x.terlambat || '').trim().toUpperCase());
    if (isTerlambat) totalTerlambat++;
    if (isNoMasuk) tidakMasuk++;
    if (isNoPulang) tidakPulang++;
  });
  const dataProm = getPromotorTerpilih();
  let html = `<div class="summary-card"><h2>${ICONS.trophy} ${escapeHtml(dataProm.namaAbsen || '-')}</h2>
      <p>Total Hari Absen : <b>${entries.length}</b></p>
      <p>Datang Terlambat : <b>${totalTerlambat}</b></p>
      <p>Tidak Finger Masuk : <b style="color:#f87171;">${tidakMasuk}</b></p>
      <p>Tidak Finger Pulang : <b style="color:#f87171;">${tidakPulang}</b></p>
    </div><div class="card-grid">`;
  entries.forEach(x => {
    const isNoMasuk = !x.masuk || String(x.masuk).trim() === "" || x.masuk === "-";
    const isNoPulang = !x.pulang || String(x.pulang).trim() === "" || x.pulang === "-";
    const isTerlambat = !isNoMasuk && String(x.terlambat || "").toUpperCase() === "YA";
    let statusText = "Lengkap";
    if (isNoMasuk && isNoPulang) statusText = "Tidak Finger";
    else if (isNoMasuk) statusText = "Tidak Finger Masuk";
    else if (isNoPulang) statusText = "Tidak Finger Pulang";
    const status = `<span class="${(isNoMasuk || isNoPulang || isTerlambat) ? 'status-warning' : 'status-ok'}">${statusText}</span>`;
    let tglAbsenStr = `10/${String(x.hari).padStart(2, '0')}/2026`;
    const formatTglFinal = tanggalKeNama(tglAbsenStr);
    const kelasTambahan = isTerlambat ? 'late' : '';
    const labelTerlambat = isTerlambat ? '<div style="color:#facc15;font-weight:900;margin-top:6px;font-size:11px;">⚠️ TERLAMBAT</div>' : '';
    html += `<div class="card ${isNoMasuk || isNoPulang ? 'warning' : 'success'} ${kelasTambahan}">
        <div class="tanggal">${ICONS.calendar} ${formatTglFinal}<br>${status}${labelTerlambat}</div>
        <div class="row"><span>Masuk</span>${isNoMasuk ? '<span class="kosong">TIDAK FINGER</span>' : `<span class="ok">${escapeHtml(x.masuk)}</span>`}</div>
        <div class="row"><span>Istirahat 1</span>${x.istirahat1 ? `<span class="ok">${escapeHtml(x.istirahat1)}</span>` : '<span class="kosong">-</span>'}</div>
        <div class="row"><span>Kembali 1</span>${x.kembali1 ? `<span class="ok">${escapeHtml(x.kembali1)}</span>` : '<span class="kosong">-</span>'}</div>
        <div class="row"><span>Istirahat 2</span>${x.istirahat2 ? `<span class="ok">${escapeHtml(x.istirahat2)}</span>` : '<span class="kosong">-</span>'}</div>
        <div class="row"><span>Kembali 2</span>${x.kembali2 ? `<span class="ok">${escapeHtml(x.kembali2)}</span>` : '<span class="kosong">-</span>'}</div>
        <div class="row"><span>Pulang</span>${isNoPulang ? '<span class="kosong">TIDAK FINGER</span>' : `<span class="ok">${escapeHtml(x.pulang)}</span>`}</div>
      </div>`;
  });
  html += `</div>`;
  return html;
}

/* ===== RENDER PENJUALAN ===== */
function renderPenjualan() {
  const isAdmin = currentUser.role === 'ADMIN';
  if (isAdmin && !promotorTerpilih) return `<div class="empty-state">${ICONS.empty}<div class="pesan">Pilih promotor dulu</div></div>`;
  const list = getDataSaya();
  const totalOmzet = list.reduce((s, x) => s + (Number(x.subtotal || x.omzet) || 0), 0);
  const totalUnit = list.reduce((s, x) => s + (Number(x.qty) || 1), 0);
  const periode = getPeriodeRentangDinamis();
  const dataProm = getPromotorTerpilih();
  let html = `<div class="summary-card"><h2>${ICONS.money} ${escapeHtml(dataProm.namaAbsen || '-')}</h2>
      <p>Periode : <b>${periode.pertama} - ${periode.terakhir}</b></p>
      <p>Total Unit : <b>${totalUnit}</b></p>
      <p>Total Omzet : <span style="font-weight:bold; color:#34d399;">Rp ${totalOmzet.toLocaleString('id-ID')}</span></p>
    </div>`;
  if (list.length === 0) return html + `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada transaksi bulan ini</div></div>`;
  const grupTanggal = {};
  list.forEach(x => { const tglKey = x.tanggal || 'Tanpa Tanggal'; if (!grupTanggal[tglKey]) grupTanggal[tglKey] = []; grupTanggal[tglKey].push(x); });
  const keysSorted = Object.keys(grupTanggal).sort((a, b) => (parseTanggal(b) || 0) - (parseTanggal(a) || 0));
  html += `<div class="card-grid">`;
  keysSorted.forEach(tgl => {
    const items = grupTanggal[tgl];
    const totalHari = items.reduce((s, x) => s + (Number(x.subtotal || x.omzet) || 0), 0);
    let isiProduk = '';
    items.forEach((it, idx) => {
      const kat = it.kategori ? ` <span style="font-size:11px; color:#38bdf8;">(${escapeHtml(it.kategori)})</span>` : '';
      isiProduk += `<div style="${idx > 0 ? 'margin-top:8px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.05);' : ''}">
          <div style="font-size:12.5px; font-weight:600; line-height:1.3; margin-bottom:4px; color:#e5e7eb;">${escapeHtml(it.namaBarang || '-')}${kat}</div>
          <div class="row"><span>Qty</span><span>${escapeHtml(it.qty || 1)}</span></div>
          <div class="row"><span>Omzet</span><span>Rp ${Number(it.subtotal || 0).toLocaleString('id-ID')}</span></div>
        </div>`;
    });
    html += `<div class="card success"><div class="tanggal">${ICONS.calendar} ${tanggalKeNama(tgl)}</div>${isiProduk}
        <div class="row" style="font-weight:700; font-size:13px; margin-top:6px; border-top:1px solid rgba(255,255,255,0.1); padding-top:6px;">
          <span>Total Hari Ini</span><span style="color:#34d399;">Rp ${totalHari.toLocaleString('id-ID')}</span>
        </div></div>`;
  });
  html += `</div>`;
  return html;
}
window.renderPenjualan = renderPenjualan;

/* ===== RENDER UC ===== */

/* ===== RENDER BRAND ===== */
function renderBrand() {
    const isAdmin = currentUser.role === 'ADMIN';
    if (isAdmin && !promotorTerpilih) return `<div class="empty-state">${ICONS.empty}<div class="pesan">Pilih promotor dulu</div></div>`;
    const dataProm = getPromotorTerpilih();
    const brandPromotor = dataProm && dataProm.merk ? String(dataProm.merk).trim().toUpperCase() : "";
    const list = getDataSaya().filter(x => {
        if (!x) return false;
        const merkBarang = String(x.merk || '').trim().toUpperCase();
        const kat = String(x.kategori || '').trim().toUpperCase();
        if (kat === 'GARANSI' || kat === 'ONGKOS') return false;
        return !brandPromotor || (merkBarang === brandPromotor || merkBarang.includes(brandPromotor));
    });
    let totalBrandQty = 0, totalOmzetBrand = 0;
    list.forEach(x => { totalBrandQty += Number(x.qty || 1); totalOmzetBrand += Number(x.subtotal || x.omzet || 0); });
    const periode = getPeriodeRentangDinamis();
    let html = `<div class="summary-card"><h2>${ICONS.brand} ${escapeHtml(dataProm ? dataProm.namaAbsen : "Promotor")}</h2>
        <p>Brand : <b>${escapeHtml(dataProm && dataProm.merk ? dataProm.merk : "Semua Brand")}</b></p>
        <p>Periode : <b>${periode.pertama} - ${periode.terakhir}</b></p>
        <p>Total Perolehan Unit : <b>${totalBrandQty} Unit</b></p>
        <p>Total Omzet Brand : <span style="font-weight:bold; color:#34d399;">Rp ${totalOmzetBrand.toLocaleString("id-ID")}</span></p>
      </div>`;
    if (list.length === 0) return html + `<div class="card"><div style="text-align:center; padding:20px; color:#9ca3af;">Belum ada data untuk brand ini</div></div>`;
    const grupTanggal = {};
    list.forEach(x => { const tglKey = x.tanggal || 'Tanpa Tanggal'; if (!grupTanggal[tglKey]) grupTanggal[tglKey] = []; grupTanggal[tglKey].push(x); });
    const keysSorted = Object.keys(grupTanggal).sort((a, b) => (parseTanggal(b) || 0) - (parseTanggal(a) || 0));
    html += `<div class="card-grid">`;
    keysSorted.forEach(tgl => {
        const items = grupTanggal[tgl];
        let subQty = 0, subOmzet = 0, isiProduk = '';
        items.forEach((it, idx) => {
            const q = Number(it.qty || 1), om = Number(it.subtotal || 0);
            subQty += q; subOmzet += om;
            isiProduk += `<div style="${idx > 0 ? 'margin-top:8px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.05);' : ''}">
                <div style="font-size:11px; color:#d4af37;">Brand: ${escapeHtml(it.merk || '-')}</div>
                <div style="font-size:11px; color:#9ca3af;">Kategori: ${escapeHtml(it.kategori || '-')}</div>
                <div style="font-size:12.5px; font-weight:600; margin-bottom:4px; color:#e5e7eb;">${escapeHtml(it.namaBarang || '-')}</div>
                <div class="row"><span>Qty</span><span>${q} Unit</span></div>
                <div class="row"><span>Omzet</span><span>Rp ${om.toLocaleString("id-ID")}</span></div>
              </div>`;
        });
        html += `<div class="card success"><div class="tanggal">${ICONS.calendar} ${tanggalKeNama(tgl)}</div>${isiProduk}
            <div class="row" style="font-weight:700; font-size:13px; margin-top:6px; border-top:1px solid rgba(255,255,255,0.1); padding-top:6px;">
              <span>Total Hari Ini</span><span style="color:#34d399;">${subQty} Unit (Rp ${subOmzet.toLocaleString("id-ID")})</span>
            </div></div>`;
    });
    html += `</div>`;
    return html;
}

/* ===== RENDER INFO LIST ===== */
function renderInfoList(arr, jenis) {
  let list = Array.isArray(arr) ? arr : (arr && typeof arr === 'object' ? Object.values(arr) : []);
  list = list.filter(x => x && (x.judul || x.poin));
  if (!list || list.length === 0) return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data</div></div>`;
  if (jenis === 'promo') {
    return list.map(x => {
      const judul = escapeHtml((x.judul || '-').trim());
      const periode = escapeHtml((x.periode || '').trim());
      const detail = escapeHtml((x.detail || '').trim());
      return `<div class="info-block" style="background: rgba(17, 24, 39, 0.75); border: 1px solid rgba(212, 175, 55, 0.25); border-left: 4px solid #d4af37; border-radius: 16px; padding: 18px 20px; margin-bottom: 14px;">
          <div style="color:#facc15; font-weight: 800; font-size: 16px; margin-bottom: 8px;">🔥 ${judul}</div>
          ${periode ? `<div style="color:#9ca3af; font-size: 12px; margin-bottom: 10px; font-weight:600;">📅 ${periode}</div>` : ''}
          ${detail ? `<div style="border-top:1px solid rgba(255,255,255,0.06); padding-top:10px; color:#e5e7eb; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap;">${detail}</div>` : ''}
        </div>`;
    }).join('');
  }
  if (jenis === 'rules') {
    return list.map((x, i) => {
      const judul = escapeHtml((x.poin || x.judul || '-').trim());
      const gambarUrl = safeImageUrl(x.gambar || x.url || x.image || '');
      const thumb = gambarUrl ? `<div style="width:55px; height:55px; flex-shrink:0; background:#0a192f; border-radius:8px; overflow:hidden; border:1px solid rgba(212,175,55,0.3);"><img src="${gambarUrl}" alt="${judul}" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.parentElement.style.display='none'"></div>` : '';
      return `<div style="background:rgba(17,24,39,0.75); border:1px solid rgba(212,175,55,0.25); border-left:4px solid #d4af37; border-radius:14px; padding:16px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer;" data-sop-url="${gambarUrl}" data-sop-judul="${judul}" onclick="bukaModalSOP(this.dataset.sopUrl, this.dataset.sopJudul)">
          <div style="flex:1; min-width:0;">
            <div style="font-size:14px; color:#d4af37; font-weight:700; margin-bottom:3px;">📌 ${judul}</div>
            <div style="font-size:11.5px; color:#9ca3af;">Ketuk untuk memperbesar</div>
          </div>
          ${thumb}
        </div>`;
    }).join('');
  }
  return '';
}

function bukaModalSOP(urlGambar, judulSop) {
  const old = document.getElementById('sopModal');
  if (old) old.remove();
  if (!urlGambar) return;
  const modalDiv = document.createElement("div");
  modalDiv.id = "sopModal";
  modalDiv.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);display:flex;justify-content:center;align-items:center;z-index:999999;padding:16px;`;
  modalDiv.onclick = function(e) { if (e.target === modalDiv) modalDiv.remove(); };
  modalDiv.innerHTML = `<div style="position:relative; max-width:95%; max-height:85vh; background:#111827; padding:20px 15px 15px; border-radius:16px; border:1px solid rgba(212,175,55,0.4); text-align:center;">
      <div onclick="document.getElementById('sopModal').remove()" style="position:absolute;top:-10px;right:-10px;background:#ef4444;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;cursor:pointer;border:2px solid #fff;">✕</div>
      <div style="color:#d4af37;font-weight:700;font-size:15px;margin-bottom:10px;">📌 ${escapeHtml(judulSop)}</div>
      <img src="${urlGambar}" alt="${escapeHtml(judulSop)}" style="width:100%;max-height:70vh;object-fit:contain;border-radius:10px;">
    </div>`;
  document.body.appendChild(modalDiv);
}
window.bukaModalSOP = bukaModalSOP;

/* ===== PEROLEHAN ===== */
function renderPerolehan() {
    if (!allPenjualan || allPenjualan.length === 0) return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data penjualan</div></div>`;
    const perPromotor = {};
    Object.keys(allPromotor).forEach(key => {
        const p = allPromotor[key];
        if (p.aktif === false) return;
        perPromotor[key] = { key, nama: p.namaAbsen || '-', omzet: 0, unit: 0, transaksi: 0, uc: 0, brand: 0 };
    });
    allPenjualan.forEach(x => {
        if (!x || !x.namaSales) return;
        const salesName = String(x.namaSales).trim().toUpperCase();
        const kat = String(x.kategori || '').trim().toUpperCase();
        const brg = String(x.namaBarang || '').toUpperCase();
        const merkBarang = String(x.merk || '').trim().toUpperCase();
        Object.keys(perPromotor).forEach(k => {
            const p = allPromotor[k];
            const pSales = String(p.namaSales || '').trim().toUpperCase();
            const pAbsen = String(p.namaAbsen || '').trim().toUpperCase();
            const pMerk = String(p.merk || '').trim().toUpperCase();
            if (salesName === pSales || salesName.includes(pAbsen) || pAbsen.includes(salesName)) {
                const omzetTrans = Number(x.subtotal || x.omzet || 0);
                perPromotor[k].omzet += omzetTrans;
                perPromotor[k].unit += Number(x.qty || 1);
                perPromotor[k].transaksi += 1;
                if (pMerk && kat !== 'GARANSI' && kat !== 'ONGKOS' && (merkBarang === pMerk || merkBarang.includes(pMerk))) perPromotor[k].brand += omzetTrans;
                if (kat === 'GARANSI' && brg.includes('UFO CARE')) perPromotor[k].uc += Number(x.qty || 1);
            }
        });
    });
    const arr = Object.values(perPromotor).sort((a, b) => b.omzet - a.omzet);
    const totalOmzetSemua = arr.reduce((s, x) => s + x.omzet, 0);
    const totalUCSemua = arr.reduce((s, x) => s + x.uc, 0);
    const periode = getPeriodeRentangDinamis();
    let html = `<div class="summary-card"><h2>${ICONS.chart} Perolehan All Promotor</h2>
        <p>Periode : <b>${periode.pertama} - ${periode.terakhir}</b></p>
        <p>${ICONS.users} Jumlah Promotor : <b>${arr.length}</b></p>
        <p>${ICONS.moneySmall} Total Omzet : <span style="font-weight:bold; color:#34d399;">Rp ${totalOmzetSemua.toLocaleString('id-ID')}</span></p>
        <p>${ICONS.diamondSmall} Total UFO CARE : <b>${totalUCSemua}</b></p>
        <div style="margin-top:14px;"><button onclick="unduhExcelPerolehan()" style="padding:10px 18px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:10px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Unduh Excel</button></div>
      </div><div class="summary-card">`;
    arr.forEach((p, i) => {
        const omzetVal = Number(p.omzet || 0);
        let warnaOmzet = '#ff2d55';
        if (omzetVal >= 100000000) warnaOmzet = '#00ff88';
        else if (omzetVal >= 80000000) warnaOmzet = '#ffdd00';
        const isSelected = (currentUser.role === 'ADMIN' && promotorTerpilih === p.key);
        const bgStyle = isSelected ? 'background:rgba(212,175,55,0.15); border-radius:8px; padding:10px 12px; margin:4px 0;' : '';
        html += `<div class="row-perolehan" style="display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); ${bgStyle}">
            <div style="display:flex; align-items:center; gap:10px; min-width:0; flex:1;">
              <div style="width:26px; height:26px; border-radius:50%; background:#1f2937; border:1px solid rgba(212,175,55,0.3); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; color:#d4af37;">${i + 1}</div>
              <div style="font-weight:600; font-size:13.5px; color:#ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(p.nama)}</div>
            </div>
            <div style="text-align:right; white-space:nowrap;">
              <div style="font-weight:700; font-size:13.5px; color:${warnaOmzet};">Rp ${omzetVal.toLocaleString('id-ID')}</div>
              <div class="uc-label" style="font-size:11.5px; font-weight:700; color:#d4af37; margin-top:2px;">${ICONS.star} UFO CARE : ${p.uc || 0}</div>
            </div>
          </div>`;
    });
    html += `</div>`;
    return html;
}

function unduhExcelPerolehan() {
    if (!allPenjualan || allPenjualan.length === 0) { alert('Belum ada data.'); return; }
    const perPromotor = {};
    Object.keys(allPromotor).forEach(key => {
        const p = allPromotor[key];
        if (p.aktif === false) return;
        perPromotor[key] = { key, nama: p.namaAbsen || '-', omzet: 0, brand: 0, uc: 0 };
    });
    allPenjualan.forEach(x => {
        if (!x || !x.namaSales) return;
        const salesName = String(x.namaSales).trim().toUpperCase();
        const kat = String(x.kategori || '').trim().toUpperCase();
        const brg = String(x.namaBarang || '').toUpperCase();
        const merkBarang = String(x.merk || '').trim().toUpperCase();
        Object.keys(perPromotor).forEach(k => {
            const p = allPromotor[k];
            const pSales = String(p.namaSales || '').trim().toUpperCase();
            const pAbsen = String(p.namaAbsen || '').trim().toUpperCase();
            const pMerk = String(p.merk || '').trim().toUpperCase();
            if (salesName === pSales || salesName.includes(pAbsen) || pAbsen.includes(salesName)) {
                const omzetTrans = Number(x.subtotal || x.omzet || 0);
                perPromotor[k].omzet += omzetTrans;
                if (pMerk && kat !== 'GARANSI' && kat !== 'ONGKOS' && (merkBarang === pMerk || merkBarang.includes(pMerk))) perPromotor[k].brand += omzetTrans;
                if (kat === 'GARANSI' && brg.includes('UFO CARE')) perPromotor[k].uc += Number(x.qty || 1);
            }
        });
    });
    const arr = Object.values(perPromotor).sort((a, b) => b.omzet - a.omzet);
    const dataExcel = arr.map((p, i) => ({ 'No': i + 1, 'Nama Promotor': p.nama, 'Perolehan Toko': p.omzet, 'Perolehan Brand': p.brand, 'Perolehan UC': p.uc }));
    const totalOmzet = arr.reduce((s, x) => s + x.omzet, 0);
    const totalBrand = arr.reduce((s, x) => s + x.brand, 0);
    const totalUC = arr.reduce((s, x) => s + x.uc, 0);
    dataExcel.push({ 'No': '', 'Nama Promotor': 'TOTAL', 'Perolehan Toko': totalOmzet, 'Perolehan Brand': totalBrand, 'Perolehan UC': totalUC });
    const ws = XLSX.utils.json_to_sheet(dataExcel);
    ws['!cols'] = [{ wch: 5 }, { wch: 28 }, { wch: 18 }, { wch: 18 }, { wch: 14 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Perolehan');
    XLSX.writeFile(wb, `Perolehan_UFO_${BULAN_INI}.xlsx`);
}
window.unduhExcelPerolehan = unduhExcelPerolehan;

/* ===== DENDA ===== */
function renderDenda() {
    const DENDA_UC = 5000, DENDA_LATE = 10000, TARGET = 16;
    if (!allPromotor || Object.keys(allPromotor).length === 0) return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada promotor</div></div>`;
    let html = `<div class="summary-card"><h2>${ICONS.warning} Denda & Keterlambatan</h2>
        <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:8px;">
          <div style="flex:1; background:rgba(239,68,68,0.1); padding:10px; border-radius:10px; border:1px solid rgba(239,68,68,0.3);">
            <div style="font-size:10px; color:#9ca3af; font-weight:700;">DENDA UC</div>
            <div style="font-size:12.5px; color:#f87171; font-weight:700;">Rp 5.000 / Unit</div>
          </div>
          <div style="flex:1; background:rgba(250,204,21,0.1); padding:10px; border-radius:10px; border:1px solid rgba(250,204,21,0.3);">
            <div style="font-size:10px; color:#9ca3af; font-weight:700;">DENDA LATE</div>
            <div style="font-size:12.5px; color:#facc15; font-weight:700;">Rp 10.000 / Kali</div>
          </div>
        </div>
      </div><div class="card-grid">`;
    Object.keys(allPromotor).forEach(key => {
        const p = allPromotor[key];
        if (p.aktif === false) return;
        const cleanNama = String(p.namaSales || p.namaAbsen || '').trim().toUpperCase();
        let totalUC = 0;
        allPenjualan.forEach(x => {
            if (!x || !x.namaSales) return;
            const salesTrans = String(x.namaSales).trim().toUpperCase();
            const kat = String(x.kategori || '').trim().toUpperCase();
            const brg = String(x.namaBarang || '').toUpperCase();
            const isMine = (salesTrans === cleanNama) || salesTrans.includes(cleanNama) || cleanNama.includes(salesTrans);
            if (isMine && kat === 'GARANSI' && brg.includes('UFO CARE')) totalUC += Number(x.qty || 1);
        });
        const absensiP = allAbsensiAll[key] || {};
        let totalTerlambat = 0;
        Object.values(absensiP).forEach(a => { if (a && String(a.terlambat || '').toUpperCase() === 'YA') totalTerlambat++; });
        const isIkutUC = String(p.ikutUC || 'YA').toUpperCase() !== 'TIDAK';
        const targetUC = isIkutUC ? Number(p.targetUC || TARGET) : 0;
        const kurangUC = (isIkutUC && totalUC < targetUC) ? (targetUC - totalUC) : 0;
        const dendaUC = kurangUC * DENDA_UC;
        const dendaLate = totalTerlambat * DENDA_LATE;
        const totalDenda = dendaUC + dendaLate;
        html += `<div class="card ${totalDenda > 0 ? 'warning' : 'success'}">
            <div class="tanggal">${escapeHtml(p.namaAbsen || '-')}</div>
            <div class="row"><span>Denda UFO CARE</span><span style="color:${dendaUC > 0 ? '#f87171' : '#34d399'};">Rp ${dendaUC.toLocaleString('id-ID')}</span></div>
            <div class="row"><span>Denda Late (${totalTerlambat}x)</span><span style="color:${dendaLate > 0 ? '#facc15' : '#34d399'};">Rp ${dendaLate.toLocaleString('id-ID')}</span></div>
            <div class="row" style="border-top:1px solid rgba(255,255,255,0.1); margin-top:6px; padding-top:6px; font-weight:700;">
              <span>TOTAL DENDA</span><span style="color:${totalDenda > 0 ? '#f87171' : '#34d399'};">Rp ${totalDenda.toLocaleString('id-ID')}</span>
            </div>
          </div>`;
    });
    html += `</div>`;
    return html;
}

/* ===== THEME ===== */
function toggleTheme() {
  const isLight = document.body.classList.toggle('light-mode');
  localStorage.setItem('ufo_theme', isLight ? 'light' : 'dark');
}
window.toggleTheme = toggleTheme;
(function() { if (localStorage.getItem('ufo_theme') === 'light') document.body.classList.add('light-mode'); })();

/* ===== LOGOUT ===== */
function logoutPromotor() {
  const old = document.getElementById('logoutModal');
  if (old) old.remove();
  const isLight = document.body.classList.contains('light-mode');
  const modal = document.createElement('div');
  modal.id = 'logoutModal';
  modal.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:${isLight ? 'rgba(241,245,249,0.7)' : 'rgba(3,7,18,0.85)'};backdrop-filter:blur(10px);display:flex;justify-content:center;align-items:center;z-index:999999;padding:16px;opacity:0;transition:opacity 0.25s ease;`;
  modal.innerHTML = `<div id="logoutModalCard" style="background:${isLight ? 'linear-gradient(135deg,#ffffff,#fef9ec)' : 'linear-gradient(135deg,rgba(17,24,39,0.98),rgba(35,28,15,0.95))'};border:2px solid rgba(212,175,55,0.5);border-radius:20px;padding:32px 28px;max-width:380px;width:100%;text-align:center;transform:scale(0.85);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);">
      <div style="width:72px;height:72px;margin:0 auto 18px;border-radius:50%;background:rgba(239,68,68,0.15);border:2px solid rgba(239,68,68,0.4);display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" style="width:36px;height:36px;stroke:#f87171;stroke-width:2;fill:none;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <div style="font-size:19px;font-weight:800;color:${isLight ? '#111827' : '#fff'};margin-bottom:8px;">Konfirmasi Keluar</div>
      <div style="font-size:13.5px;color:${isLight ? '#64748b' : '#94a3b8'};margin-bottom:26px;">Yakin ingin keluar?</div>
      <div style="display:flex;gap:10px;">
        <button id="logoutCancelBtn" style="flex:1;padding:13px;background:${isLight ? '#f1f5f9' : 'rgba(148,163,184,0.1)'};border:1px solid ${isLight ? '#cbd5e1' : 'rgba(148,163,184,0.3)'};border-radius:11px;color:${isLight ? '#475569' : '#cbd5e1'};font-weight:700;cursor:pointer;">Batal</button>
        <button id="logoutConfirmBtn" style="flex:1;padding:13px;background:linear-gradient(135deg,#ef4444,#b91c1c);border:none;border-radius:11px;color:#fff;font-weight:800;cursor:pointer;">Keluar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  requestAnimationFrame(() => { modal.style.opacity = '1'; document.getElementById('logoutModalCard').style.transform = 'scale(1)'; });
  const closeModal = () => { modal.style.opacity = '0'; document.getElementById('logoutModalCard').style.transform = 'scale(0.9)'; setTimeout(() => modal.remove(), 250); };
  document.getElementById('logoutCancelBtn').onclick = closeModal;
  document.getElementById('logoutConfirmBtn').onclick = async () => {
    closeModal();
    try { await window.firebaseSignOut(window.firebaseAuth); } catch(e) {}
    setTimeout(() => location.reload(), 400);
  };
  modal.onclick = (e) => { if (e.target === modal) closeModal(); };
}
window.logoutPromotor = logoutPromotor;
</script>
