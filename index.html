.hidden { display: none !important; }

/* ===== LOGIN SCREEN ===== */
body.login-active { 
    margin: 0; padding: 0; background: #050814; 
    height: 100vh; height: 100dvh; overflow: hidden; 
    display: flex; align-items: center; justify-content: center;
}

    display: flex; align-items: center; justify-content: center;

}
.fut-grid {

.fut-orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.6; 
    animation: futOrbFloat 12s ease-in-out infinite; pointer-events: none; z-index: 1; }
.fut-orb-1 { width: 400px; height: 400px; background: #0ea5e9; top: -100px; left: -100px; }
.fut-orb-2 { width: 300px; height: 300px; background: #a855f7; bottom: -80px; right: -80px; animation-delay: -4s; }
.fut-orb-3 { width: 350px; height: 350px; background: #06b6d4; top: 40%; left: 45%; animation-delay: -8s; opacity: 0.4; }

.fut-particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }

.fut-container { position: relative; z-index: 10; display: grid;

}

.fut-left { color: #ffffff; text-align: center; padding: 20px; }

}
.fut-live-status { display: inline-flex; align-items: center; gap: 10px;

.fut-pulse-dot { width: 8px; height: 8px; background: #22d3ee; 
    border-radius: 50%; animation: futDotPulse 1.5s infinite; }
.fut-right { display: flex; justify-content: center; }
.fut-card { width: 100%; max-width: 400px; background: rgba(15, 23, 42, 0.7); 
    backdrop-filter: blur(24px); border: 1px solid rgba(34,211,238,0.2);

    box-shadow: 0 0 60px rgba(14,165,233,0.15);

.fut-logo { width: 110px; height: 110px; margin: 0 auto 20px;

/* Login Tabs */
.login-tabs { display: flex; gap: 8px; margin-bottom: 22px;

.login-tab { flex: 1; padding: 10px 12px; background: transparent; border: none;

.login-tab:hover { color: #22d3ee; background: rgba(34, 211, 238, 0.08); }

.fut-field { margin-bottom: 18px; position: relative; }

.fut-select { width: 100%; padding: 14px 16px; background: rgba(2,6,23,0.6);

.fut-select span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.fut-menu { position: absolute; left: 0; right: 0; top: 100%; margin-top: 6px; 
    background: rgba(15,23,42,0.98); backdrop-filter: blur(20px); 
    border: 1px solid rgba(34,211,238,0.3); border-radius: 12px;

.fut-menu.open { opacity: 1 !important; visibility: visible !important; 
    transform: translateY(0) !important; }
.fut-menu .option { padding: 10px 14px; border-radius: 8px; font-size: 14px; 
    font-weight: 600; color: #e2e8f0; cursor: pointer; }
.fut-menu .option:hover { background: rgba(34,211,238,0.15); color: #22d3ee; }
.fut-menu .option.selected { background: rgba(34,211,238,0.25); color: #22d3ee; }
.fut-menu .option.empty { color: #64748b; font-style: italic; text-align: center; }

.fut-input { width: 100%; padding: 14px 16px; background: rgba(2,6,23,0.6);

.fut-input::placeholder { color: rgba(148,163,184,0.4); }
.fut-input:focus { border-color: #22d3ee; box-shadow: 0 0 25px rgba(34,211,238,0.4); }

.fut-input-admin { width: 100%; padding: 14px 16px; background: rgba(2, 6, 23, 0.6);

    transition: all 0.25s ease; letter-spacing: 1px; text-align: left; }
.fut-input-admin:focus { border-color: #d4af37; box-shadow: 0 0 25px rgba(212, 175, 55, 0.4); }
.fut-input-admin::placeholder { color: rgba(148, 163, 184, 0.4); font-weight: 500; }

.fut-error { color: #f87171; font-size: 12px; font-weight: 700; text-align: center; 
    min-height: 18px; margin-bottom: 8px; display: flex; align-items: center; 
    justify-content: center; gap: 6px; }

.fut-btn { width: 100%; padding: 16px; 
    background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #a855f7 100%); 
    color: #ffffff; border: none; border-radius: 12px; font-size: 14px; 
    font-weight: 800; text-transform: uppercase; letter-spacing: 2px;

    gap: 10px; box-shadow: 0 0 30px rgba(34,211,238,0.4); }
.fut-btn:active { transform: scale(0.98); }
.fut-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.fut-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.5; fill: none; }

.fut-footer { text-align: center; font-size: 12px; color: #64748b; 
    margin: 20px 0 0 0; font-weight: 500; }
.fut-footer span { color: #22d3ee; font-weight: 700; }

.spinner { display: inline-block; width: 14px; height: 14px; 
    border: 2px solid rgba(255,255,255,0.3); border-top-color: white; 
    border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.login-toast-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); 
    display: flex; justify-content: center; align-items: center; z-index: 999999; 
    opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 16px; }
.login-toast-overlay.active { opacity: 1; visibility: visible; }
.login-toast-card { background: var(--cyber-card); padding: 32px 40px; 
    border-radius: 24px; text-align: center; border: 2px solid var(--cyber-cyan); 
    box-shadow: 0 0 40px rgba(56, 189, 248, 0.5), 0 25px 60px rgba(0, 0, 0, 0.6); 
    transform: scale(0.8); 
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);

.login-toast-overlay.active .login-toast-card { transform: scale(1); }
.login-toast-icon { width: 72px; height: 72px; border-radius: 50%; 
    background: linear-gradient(135deg, #10b981, #059669); 
    display: inline-flex; align-items: center; justify-content: center; 
    margin-bottom: 16px; box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
.login-toast-icon svg { width: 40px; height: 40px; stroke: #ffffff; stroke-width: 3; fill: none; }
.login-toast-title { font-size: 18px; font-weight: 800; color: #ffffff; margin-bottom: 4px; }
.login-toast-subtitle { font-size: 13px; font-weight: 600; color: #94a3b8; }
.login-toast-name { color: var(--cyber-cyan); font-weight: 800;

/* Responsive Login */
@media (max-width: 900px) {
    #login-screen { padding: 12px; align-items: flex-start; padding-top: 20px; overflow-y: auto; }
    .fut-container { grid-template-columns: 1fr; gap: 16px; max-width: 480px; margin: 0 auto; }
    .fut-left { padding: 8px; }
    .fut-headline { font-size: 26px; margin-bottom: 4px; }
    .fut-subheadline { font-size: 12px; margin-bottom: 14px; }
    .fut-tagline { font-size: 10px; padding: 5px 12px; margin-bottom: 12px; }
    .fut-characters .team-3d-img { max-height: 180px; }
    .fut-live-status { font-size: 11px; padding: 7px 14px; }
    .fut-card { padding: 24px 20px; border-radius: 20px; }
    .fut-logo { width: 90px; height: 90px; margin-bottom: 14px; padding: 10px; }
    .fut-field { margin-bottom: 14px; }
    .fut-select { padding: 12px 14px; font-size: 13px; }
    .fut-input { padding: 12px 14px; font-size: 20px; letter-spacing: 8px; }
    .fut-btn { padding: 14px; font-size: 13px; letter-spacing: 1.5px; }
    .fut-footer { font-size: 11px; margin-top: 14px; }
    .fut-orb-1 { width: 250px; height: 250px; }

}
@media (max-width: 400px) {
    #login-screen { padding: 8px; }
    .fut-container { gap: 12px; }
    .fut-headline { font-size: 22px; }
    .fut-subheadline { font-size: 11px; margin-bottom: 10px; }
    .fut-characters .team-3d-img { max-height: 140px; }
    .fut-card { padding: 20px 16px; border-radius: 16px; }
    .fut-logo { width: 80px; height: 80px; margin-bottom: 10px; padding: 8px; }
    .fut-select { padding: 11px 12px; font-size: 12px; }
    .fut-input { padding: 11px 12px; font-size: 18px; letter-spacing: 6px; }
    .fut-btn { padding: 13px; font-size: 12px; }
    .fut-field label { font-size: 10px; }
    .login-tab { font-size: 11px; padding: 9px 8px; }

/* ===== DASHBOARD ===== */

/* Custom Dropdown Menu */
.custom-dropdown-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: rgba(15, 23, 42, 0.98);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(212, 175, 55, 0.4);

    z-index: 999;

    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: all 0.2s ease;
}
.custom-dropdown-menu.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}
.custom-dropdown-menu .dd-option {
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #e2e8f0;

}

    background: rgba(212, 175, 55, 0.25);

/* ============================================================ */
/* ===== FIREBASE READY ======================================= */
/* ============================================================ */
window.addEventListener('firebase-ready', () => {
  initParticles();
  loadPromotorList();
  loadInfoRealtime();
  const saved = localStorage.getItem('ufo_promotor_session_v3');
  if (saved) {

      const data = JSON.parse(saved);
      currentUser = data;
      tampilkanDashboard();

/* ============================================================ */
/* ===== PARTICLES ============================================ */
/* ============================================================ */
function initParticles() {
    const container = document.getElementById('fut-particles');
    if (!container) return;
    for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'fut-particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        const colors = ['#22d3ee', '#a855f7', '#3b82f6'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        p.style.background = color;
        p.style.boxShadow = `0 0 6px ${color}, 0 0 12px ${color}`;
        container.appendChild(p);
    }
}

/* ============================================================ */
/* ===== LOGIN TAB SWITCH ===================================== */
/* ============================================================ */
function switchLoginTab(mode) {
    loginMode = mode;
    const tabPromotor = document.getElementById('tab-promotor');
    const tabAdmin = document.getElementById('tab-admin');
    const formPromotor = document.getElementById('form-promotor');
    const formAdmin = document.getElementById('form-admin');
    const btnText = document.getElementById('btn-login-text');
    
    if (mode === 'promotor') {
        tabPromotor.classList.add('active');
        tabAdmin.classList.remove('active');
        formPromotor.style.display = 'block';
        formAdmin.style.display = 'none';
        btnText.innerText = 'MASUK';
    } else {
        tabAdmin.classList.add('active');
        tabPromotor.classList.remove('active');
        formPromotor.style.display = 'none';
        formAdmin.style.display = 'block';
        btnText.innerText = 'MASUK ADMIN';
    }
    document.getElementById('login-error').innerHTML = '';
}
window.switchLoginTab = switchLoginTab;
/* ============================================================ */
/* ===== SET DEFAULT PROMOTOR UNTUK ADMIN ==================== */
/* ============================================================ */
function setDefaultPromotorAdmin() {
  if (!currentUser || currentUser.role !== 'ADMIN') return;
  
  // Kalau promotorTerpilih sudah valid, jangan di-reset
  if (promotorTerpilih && allPromotor[promotorTerpilih]) {
    console.log('✅ promotorTerpilih sudah valid:', promotorTerpilih);
    return;
  }
  
  // Ambil promotor pertama
  const promotorKeys = Object.keys(allPromotor || {}).filter(k => allPromotor[k].aktif !== false);
  if (promotorKeys.length === 0) {
    console.log('⚠️ Belum ada promotor terdaftar');
    promotorTerpilih = null;
    return;
  }
  
  promotorTerpilih = promotorKeys[0];
  console.log('✅ Auto-set promotorTerpilih:', promotorTerpilih);
  
  // Update dropdown label
  const menu = document.getElementById('dropdownMenu');
  const labelEl = document.getElementById('dropdownLabel');
  if (menu && labelEl) {
    const opt = menu.querySelector(`.dd-option[data-value="${promotorTerpilih}"]`);
    if (opt) {
      menu.querySelectorAll('.dd-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      labelEl.innerText = opt.innerText;
    }
  }
  
  // Re-render kalau sedang buka absensi / penjualan / uc / brand
  if (currentMenu && ['absensi', 'penjualan', 'uc', 'brand'].includes(currentMenu)) {
    tampilkanDetail(currentMenu);
  }
}
window.setDefaultPromotorAdmin = setDefaultPromotorAdmin;
/* ============================================================ */
/* ===== LOAD PROMOTOR LIST ================================== */
/* ============================================================ */
function loadPromotorList() {
  window.dbOnValue(window.dbRef(window.db, 'users/promotor'), snap => {
    const liveEl = document.getElementById('live-status-text');
    if (!snap.exists()) {
      renderCustomSelectOptions([]);
      if (liveEl) liveEl.innerText = 'Belum ada promotor';
      return;
    }
    allPromotor = snap.val();
    const list = Object.keys(allPromotor).map(k => ({ key: k, ...allPromotor[k] }))
      .filter(p => p.aktif !== false)
      .sort((a,b) => (a.namaAbsen || '').localeCompare(b.namaAbsen || ''));
    renderCustomSelectOptions(list);
    if (liveEl) liveEl.innerText = `${list.length} promotor terdaftar`;
    
    // Isi dropdown promotor custom
    isiDropdownPromotor(list);
    setDefaultPromotorAdmin();
  });
}

function isiDropdownPromotor(list) {
  const menuEl = document.getElementById('dropdownMenu');
  const labelEl = document.getElementById('dropdownLabel');
  if (!menuEl) return;
  
  if (!list || list.length === 0) {
    menuEl.innerHTML = '<div class="dd-option" style="color:#64748b;font-style:italic;justify-content:center;">Belum ada promotor</div>';
    if (labelEl) labelEl.innerText = '-- Belum ada promotor --';
    return;
  }
  
  let html = '';
  list.forEach(p => {
    const key = String(p.key).replace(/"/g, '&quot;');
    const label = String(p.namaAbsen || '-').replace(/</g, '&lt;');
    html += `<div class="dd-option" data-value="${key}" onclick="pilihDropdownPromotor('${key}', '${label.replace(/'/g, "\\'")}')">${label}</div>`;
  });
  menuEl.innerHTML = html;
  
  if (promotorTerpilih) {
    const selectedOpt = menuEl.querySelector(`.dd-option[data-value="${promotorTerpilih}"]`);
    if (selectedOpt) {
      selectedOpt.classList.add('selected');

async function loginPromotor() {
    const errEl = document.getElementById('login-error');
    const btn = document.getElementById('btn-login-promotor');
    const pin = document.getElementById('login-pin-input').value.trim();
    errEl.innerHTML = '';
    
    if (!pin) {
        errEl.innerHTML = 'Masukkan PIN!';
        return;
    }
    
    const asli = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Memeriksa...';
    
    try {
        if (loginMode === 'promotor') {
            const key = document.getElementById('login-pilih-sales').value;
            if (!key) {
                errEl.innerHTML = 'Pilih nama promotor dulu!';
                btn.disabled = false; btn.innerHTML = asli; return;
            }
            
            const snap = await window.dbGet(window.dbRef(window.db, 'users/promotor/' + key));
            if (!snap.exists()) {
                errEl.innerHTML = 'Promotor tidak ditemukan.';
                btn.disabled = false; btn.innerHTML = asli; return;
            }
            
            const data = snap.val();
            if (String(data.pin) !== pin) {
                errEl.innerHTML = 'PIN salah!';
                document.getElementById('login-pin-input').value = '';
                document.getElementById('login-pin-input').focus();
                btn.disabled = false; btn.innerHTML = asli; return;
            }
            
            if (data.aktif === false) {
                errEl.innerHTML = 'Akun promotor ini tidak aktif.';
                btn.disabled = false; btn.innerHTML = asli; return;
            }
            
            currentUser = { key, ...data, role: 'PROMOTOR', loginType: 'promotor' };
            localStorage.setItem('ufo_promotor_session_v3', JSON.stringify(currentUser));
            
        } else {
            const username = document.getElementById('login-admin-username').value.trim().toUpperCase();
            if (!username) {
                errEl.innerHTML = 'Masukkan username admin!';
                btn.disabled = false; btn.innerHTML = asli; return;
            }
            
            const snap = await window.dbGet(window.dbRef(window.db, 'users/admin'));
            if (!snap.exists()) {
                errEl.innerHTML = 'Belum ada admin terdaftar.';
                btn.disabled = false; btn.innerHTML = asli; return;
            }
            
            const admins = snap.val();
            let foundKey = null, foundData = null;
            Object.keys(admins).forEach(k => {
                const a = admins[k];
                if (a && String(a.username || '').toUpperCase() === username) {
                    foundKey = k;
                    foundData = a;
                }
            });
            
            if (!foundKey) {
                errEl.innerHTML = 'Username admin tidak ditemukan.';
                btn.disabled = false; btn.innerHTML = asli; return;
            }
            
            if (String(foundData.pin) !== pin) {
                errEl.innerHTML = 'PIN admin salah!';
                document.getElementById('login-pin-input').value = '';
                document.getElementById('login-pin-input').focus();
                btn.disabled = false; btn.innerHTML = asli; return;
            }
            
            if (foundData.aktif === false) {
                errEl.innerHTML = 'Akun admin ini tidak aktif.';
                btn.disabled = false; btn.innerHTML = asli; return;
            }
            
            currentUser = {
                key: foundKey,
                username: foundData.username,
                namaAbsen: foundData.nama || foundData.username,
                namaSales: '',
                pin: foundData.pin,
                role: 'ADMIN',
                loginType: 'admin'
            };
            localStorage.setItem('ufo_promotor_session_v3', JSON.stringify(currentUser));
        }
        
        document.getElementById('login-toast-name').innerText = currentUser.namaAbsen;
        const toast = document.getElementById('login-toast');
        toast.classList.add('active');
        
        setTimeout(() => {
            tampilkanDashboard();
            document.getElementById('login-pin-input').value = '';
            document.getElementById('login-admin-username').value = '';
            errEl.innerHTML = '';
            btn.disabled = false; btn.innerHTML = asli;
            setTimeout(() => { toast.classList.remove('active'); }, 600);
        }, 1000);
        
    } catch (err) {
        console.error('Login error:', err);
        errEl.innerHTML = err.message;
        btn.disabled = false; btn.innerHTML = asli;
    }
}

document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('btn-login-promotor');
  if (btn) btn.onclick = loginPromotor;

function tampilkanDashboard() {

  document.getElementById('dashboard').classList.remove('hidden');
  
  const isAdmin = currentUser.role === 'ADMIN';
  
  // === DEFAULT PROMOTOR ===

  // Nanti akan auto-set di setDefaultPromotorAdmin() setelah allPromotor siap
  if (isAdmin) {
    // Kalau promotorTerpilih belum valid, biarkan null dulu
    // Akan di-set oleh setDefaultPromotorAdmin() saat listener promotor selesai
    if (!promotorTerpilih || !allPromotor[promotorTerpilih]) {
      // Coba set sekarang kalau allPromotor sudah ada
      const promotorKeys = Object.keys(allPromotor || {}).filter(k => allPromotor[k].aktif !== false);
      if (promotorKeys.length > 0) {

      }

      `${ICONS.crown} <b>${currentUser.namaAbsen}</b> <span class="admin-badge-inline">ADMIN</span>`;
    document.getElementById('topBar').classList.add('admin-mode');
  } else {
    promotorTerpilih = currentUser.key;
    document.getElementById('promotorSelector').classList.add('hidden');
    document.getElementById('userNama').innerHTML = 
      `<span style="color:#34d399;">●</span> <b>${currentUser.namaAbsen}</b>`;
    document.getElementById('topBar').classList.remove('admin-mode');
  }
  
  // Load penjualan
  window.dbOnValue(window.dbRef(window.db, 'penjualan'), snap => {
    allPenjualan = [];
    if (snap.exists()) {
      Object.values(snap.val()).forEach(item => {
        if (item && item.namaSales) allPenjualan.push(item);
      });
    }
    if (!currentMenu) renderMenuGrid();
    else tampilkanDetail(currentMenu);
  });
  
  // Load absensi
  // Load absensi secara real-time untuk semua promotor atau inisialisasi
  window.dbOnValue(window.dbRef(window.db, 'absensi'), snap => {
    if (snap.exists()) {
      allAbsensiAll = snap.val(); // simpan semua absensi
      if (currentUser.role === 'ADMIN' && promotorTerpilih) {
        allAbsensi = allAbsensiAll[promotorTerpilih] || {};
      } else if (currentUser.role !== 'ADMIN') {
        allAbsensi = allAbsensiAll[currentUser.key] || {};
      }
    } else {
      allAbsensi = {};
    }
    if (currentMenu === 'absensi') {
      tampilkanDetail('absensi');
    }
  });
  
  renderMenuGrid();
  
  // ✅ FIX: Cek lagi setelah 1.5 detik (kalau allPromotor belum siap)
  setTimeout(() => {
    if (isAdmin) setDefaultPromotorAdmin();
  }, 1500);
}

function tanggalKeNama(tglStr) {
  if (!tglStr) return '-';
  const parts = String(tglStr).split('/');
  if (parts.length !== 3) return tglStr;
  const mm = parseInt(parts[0]);
  const dd = parseInt(parts[1]);
  const yyyy = parts[2];
  if (isNaN(dd) || isNaN(mm)) return tglStr;
  const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                     'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  return `${dd} ${namaBulan[mm - 1] || '?'} ${yyyy}`;
}

function parseTanggal(str) {
  if (!str) return null;
  const p = String(str).split('/');
  if (p.length !== 3) return null;
  return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
}

function getDataSaya() {
    if (!currentUser) return [];
    
    const targetKey = (currentUser.role === 'ADMIN' && promotorTerpilih) 
        ? promotorTerpilih 
        : currentUser.key;
    
    const dataP = allPromotor[targetKey] || currentUser;
    const namaAbsenUser = String(dataP.namaAbsen || '').trim().toUpperCase();
    const namaSalesUser = String(dataP.namaSales || '').trim().toUpperCase();
    
    const semuaPenjualan = typeof allPenjualan !== 'undefined' ? allPenjualan : []; 
    return semuaPenjualan.filter(x => {
        if (!x) return false;
        const salesTrans = String(x.namaSales || '').trim().toUpperCase();
        const isMatch = (namaSalesUser && salesTrans === namaSalesUser) || 
                        (namaAbsenUser && (salesTrans.includes(namaAbsenUser) || namaAbsenUser.includes(salesTrans)));
        return isMatch;
    });
}

function getPromotorTerpilih() {
    const targetKey = (currentUser.role === 'ADMIN' && promotorTerpilih) 
        ? promotorTerpilih 
        : currentUser.key;
    return allPromotor[targetKey] || currentUser;
}

/* ===== RENDER: ABSENSI ===================================== */
/* ============================================================ */
function renderAbsensi() {
  const isAdmin = currentUser.role === 'ADMIN';
  let entries = [];
  
  // Ambil key promotor yang sedang aktif dilihat
  const targetKey = isAdmin ? (promotorTerpilih || currentUser.key) : currentUser.key;
  
  // Ambil data absensi langsung dari master allAbsensiAll atau allAbsensi
  let dataP = {};
  if (typeof allAbsensiAll !== 'undefined' && allAbsensiAll[targetKey]) {
    dataP = allAbsensiAll[targetKey];
  } else if (allAbsensi) {
    dataP = allAbsensi;
  }

  Object.values(dataP).forEach(item => {
    if (item && typeof item === 'object' && (item.hari || item.masuk || item.pulang)) {
      entries.push(item);
    }
  });
  
  entries.sort((a, b) => (Number(a.hari) || 0) - (Number(b.hari) || 0));

  if (entries.length === 0) {
    return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data absensi</div></div>`;
  }

  let totalTerlambat = 0, tidakMasuk = 0, tidakPulang = 0;
  entries.forEach(x => {
    const isNoMasuk = !x.masuk || String(x.masuk).trim() === '' || x.masuk === '-';
    const isNoPulang = !x.pulang || String(x.pulang).trim() === '' || x.pulang === '-';
    const terr = String(x.terlambat || '').trim().toUpperCase();
    if (terr === 'YA' || terr === 'Y' || terr === 'YES' || terr === 'TRUE') totalTerlambat++;
    if (isNoMasuk) tidakMasuk++;
    if (isNoPulang) tidakPulang++;
  });

  const dataProm = getPromotorTerpilih();
  const namaTampil = dataProm.namaAbsen || '-';

  let html = `
    <div class="summary-card">
      <h2>${ICONS.trophy} ${namaTampil}</h2>
      <p>Total Hari Absen : <b>${entries.length}</b></p>
      <p>Datang Terlambat : <b>${totalTerlambat}</b></p>
      <p>Tidak Finger Masuk : <b style="color:#f87171;">${tidakMasuk}</b></p>
      <p>Tidak Finger Pulang : <b style="color:#f87171;">${tidakPulang}</b></p>
    </div>
    <div class="card-grid">
  `;

  entries.forEach(x => {
    const isTerlambat = String(x.terlambat || "").toUpperCase() === "YA";
    const isNoMasuk = !x.masuk || String(x.masuk).trim() === "" || x.masuk === "-";
    const isNoPulang = !x.pulang || String(x.pulang).trim() === "" || x.pulang === "-";

    let statusText = "Lengkap";
    if (isNoMasuk && isNoPulang) statusText = "Tidak Finger";
    else if (isNoMasuk) statusText = "Tidak Finger Masuk";
    else if (isNoPulang) statusText = "Tidak Finger Pulang";

    const status = `<span class="${(isNoMasuk || isNoPulang || isTerlambat) ? 'status-warning' : 'status-ok'}">${statusText}</span>`;

    let tglAbsenStr = String(x.hari || '').trim();
    if (!tglAbsenStr.includes('/') && !tglAbsenStr.includes('-')) {
        const hariAngka = tglAbsenStr.padStart(2, '0');
        tglAbsenStr = `10/${hariAngka}/2026`;
    }
    const formatTglFinal = tanggalKeNama(tglAbsenStr);

    html += `
      <div class="card ${isNoMasuk || isNoPulang ? 'warning' : 'success'}">
        <div class="tanggal">${ICONS.calendar} ${formatTglFinal}<br>${status}</div>
        <div class="row"><span>Masuk</span>${isNoMasuk ? '<span class="kosong">TIDAK FINGER</span>' : `<span class="ok">${x.masuk}</span>`}</div>
        <div class="row"><span>Istirahat 1</span>${x.istirahat1 ? `<span class="ok">${x.istirahat1}</span>` : '<span class="kosong">-</span>'}</div>
        <div class="row"><span>Kembali 1</span>${x.kembali1 ? `<span class="ok">${x.kembali1}</span>` : '<span class="kosong">-</span>'}</div>
        <div class="row"><span>Istirahat 2</span>${x.istirahat2 ? `<span class="ok">${x.istirahat2}</span>` : '<span class="kosong">-</span>'}</div>
        <div class="row"><span>Kembali 2</span>${x.kembali2 ? `<span class="ok">${x.kembali2}</span>` : '<span class="kosong">-</span>'}</div>
        <div class="row"><span>Pulang</span>${isNoPulang ? '<span class="kosong">TIDAK FINGER</span>' : `<span class="ok">${x.pulang}</span>`}</div>
      </div>
    `;
  });

  html += `</div>`;
  return html;
}
/* ============================================================ */
/* ===== RENDER: UC ========================================== */
/* ============================================================ */
function renderUC() {
    const listAll = getDataSaya();
    const list = listAll.filter(x => {
        if (!x) return false;
        const tgl = String(x.tanggal || '');
        const noFaktur = String(x.nomorFaktur || x.noFaktur || '').toUpperCase();
        const kat = String(x.kategori || '').trim().toUpperCase();
        const namaBrd = String(x.namaBarang || '').trim().toUpperCase();
        const isOktoberFaktur = noFaktur.includes('2610');
        const isOktoberTgl = tgl.includes('/10/2026') || tgl.includes('2026-10');
        const isMurniUC = (kat === 'GARANSI') && namaBrd.includes('UFO CARE');
        return (isOktoberFaktur || isOktoberTgl) && isMurniUC;
    });

    let totalUC = 0;
    list.forEach(x => { totalUC += Number(x.qty || 1); });

    const dataProm = getPromotorTerpilih();
    const namaPromotor = dataProm.namaAbsen || "Promotor";

    let html = `
        <div class="summary-card">
            <h2>${ICONS.uc} ${namaPromotor}</h2>
            <p>Periode : <b>Bulan Ini</b></p>
            <p>Total UC : <b>${totalUC}</b></p>
        </div>
    `;

    if (list.length === 0) {
        return html + `<div class="card"><div style="text-align:center; padding:20px; color:#9ca3af;">Belum ada data UC bulan ini</div></div>`;
    }

    html += `<div class="card-grid">`;
    list.forEach(x => {
        const namaProduk = x.namaBarang || x.produk || "-";
        const qtyTrans = x.qty || 1;
        html += `
        <div class="card success">
            <div class="tanggal">${ICONS.calendar} ${x.tanggal || '-'}</div>
            <div style="font-size:12.5px; font-weight:600; line-height:1.3; margin:8px 0; color:#e5e7eb;">${namaProduk}</div>
            <div class="row"><span>Qty</span><span>${qtyTrans}</span></div>
        </div>`;
    });
    html += `</div>`;
    return html;
}

/* ============================================================ */
/* ===== RENDER: BRAND ======================================= */
/* ============================================================ */
function renderBrand() {
    const listAll = getDataSaya();
    const dataProm = getPromotorTerpilih();
    const brandPromotor = dataProm && dataProm.merk ? String(dataProm.merk).trim().toUpperCase() : "";
    
    const list = listAll.filter(x => {
        if (!x) return false;
        const tgl = String(x.tanggal || '');
        const noFaktur = String(x.nomorFaktur || x.noFaktur || '').toUpperCase();
        const merkBarang = String(x.merk || '').trim().toUpperCase();
        const kat = String(x.kategori || '').trim().toUpperCase();
        if (kat === 'GARANSI' || kat === 'ONGKOS') return false;
        const isOktoberFaktur = noFaktur.includes('2610');
        const isOktoberTgl = tgl.includes('/10/2026') || tgl.includes('2026-10');
        const isMatchBrand = !brandPromotor || (merkBarang === brandPromotor || merkBarang.includes(brandPromotor));
        return (isOktoberFaktur || isOktoberTgl) && isMatchBrand;
    });

    let totalBrandQty = 0, totalOmzetBrand = 0;
    list.forEach(x => {
        totalBrandQty += Number(x.qty || 1);
        totalOmzetBrand += Number(x.subtotal || x.omzet || 0);
    });

    const namaPromotor = dataProm ? dataProm.namaAbsen : "Promotor";
    const infoMerk = dataProm && dataProm.merk ? dataProm.merk : "Semua Brand";

    let html = `
        <div class="summary-card">
            <h2>${ICONS.brand} ${namaPromotor}</h2>
            <p>Brand : <b>${infoMerk}</b></p>
            <p>Periode : <b>Bulan Ini</b></p>
            <p>Total Perolehan Unit : <b>${totalBrandQty} Unit</b></p>
            <p>Total Omzet Brand : <span style="font-weight:bold; color:#34d399;">Rp ${totalOmzetBrand.toLocaleString("id-ID")}</span></p>
        </div>
    `;

    if (list.length === 0) {
        return html + `<div class="card"><div style="text-align:center; padding:20px; color:#9ca3af;">Belum ada data penjualan untuk brand ${infoMerk}</div></div>`;
    }

    const grupTanggal = {};
    list.forEach(x => {
        const tglKey = x.tanggal || 'Tanpa Tanggal';
        if (!grupTanggal[tglKey]) grupTanggal[tglKey] = [];
        grupTanggal[tglKey].push(x);
    });

    const keysSorted = Object.keys(grupTanggal).sort((a, b) => {
        const da = parseTanggal(a), db = parseTanggal(b);
        return (db || 0) - (da || 0);
    });

    html += `<div class="card-grid">`;
    keysSorted.forEach(tgl => {
        const items = grupTanggal[tgl];
        let subQty = 0, subOmzet = 0;
        let isiProduk = '';
        items.forEach((it, idx) => {
            const q = Number(it.qty || 1);
            const om = Number(it.subtotal || it.omzet || 0);
            subQty += q;
            subOmzet += om;
            isiProduk += `
                <div style="${idx > 0 ? 'margin-top:8px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.05);' : ''}">
                    <div style="font-size:11px; color:#d4af37; margin-bottom:2px;">Brand: ${it.merk || infoMerk}</div>
                    <div style="font-size:11px; color:#9ca3af; margin-bottom:2px;">Kategori: ${it.kategori || '-'}</div>
                    <div style="font-size:12.5px; font-weight:600; line-height:1.3; margin-bottom:4px; color:#e5e7eb;">${it.namaBarang || it.produk || '-'}</div>
                    <div class="row"><span>Qty</span><span>${q} Unit</span></div>
                    <div class="row"><span>Omzet</span><span>Rp ${om.toLocaleString("id-ID")}</span></div>
                </div>
            `;
        });
        html += `
        <div class="card success">
            <div class="tanggal">${ICONS.calendar} ${tanggalKeNama(tgl)}</div>
            ${isiProduk}
            <div class="row" style="font-weight:700; font-size:13px; margin-top:6px; border-top:1px solid rgba(255,255,255,0.1); padding-top:6px;">
                <span>Total Hari Ini</span>
                <span style="color:#34d399;">${subQty} Unit (Rp ${subOmzet.toLocaleString("id-ID")})</span>
            </div>
        </div>`;
    });
    html += `</div>`;
    return html;
}

/* ============================================================ */
/* ===== RENDER: INFO LIST (Promo/SOP) ======================= */
/* ============================================================ */
function renderInfoList(arr, jenis) {
  if (!arr || arr.length === 0) {
    return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data</div></div>`;
  }
  if (jenis === 'promo') {
    return arr.map(x => `
      <div class="info-block" style="background: rgba(17, 24, 39, 0.75); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 16px; padding: 18px; margin-bottom: 12px;">
        <div class="judul" style="color:#d4af37; font-weight: 700; font-size: 15px; margin-bottom: 6px; display:flex; align-items:center; gap:6px;">${ICONS.promo} ${x.judul || '-'}</div>
        ${x.periode ? `<div class="meta" style="color:#9ca3af; font-size: 12.5px;"><b>Periode:</b> ${x.periode}</div>` : ''}
        <div class="deskripsi" style="margin-top:8px; border-top:1px solid rgba(255,255,255,0.05); padding-top:8px; color:#d1d5db; font-size: 13px; line-height: 1.5;">${x.detail || '-'}</div>
      </div>
    `).join('');
  } else if (jenis === 'rules') {
    return arr.map(x => `
      <div class="info-block" style="background: rgba(17, 24, 39, 0.75); border: 1px solid rgba(212, 175, 55, 0.25); border-radius: 16px; padding: 18px; margin-bottom: 12px;">
        <div class="judul" style="color:#d4af37; font-weight: 700; font-size: 15px; margin-bottom: 6px; display:flex; align-items:center; gap:6px;">${ICONS.sop} ${x.poin || '-'}</div>
        <div class="deskripsi" style="margin-top:6px; color:#d1d5db; font-size: 13px; line-height: 1.5;">${x.deskripsi || '-'}</div>
      </div>
    `).join('');
  }
  return '';
}

/* ============================================================ */
/* ===== RENDER: PEROLEHAN (ADMIN) =========================== */
/* ============================================================ */
function renderPerolehan() {
    if (!allPenjualan || allPenjualan.length === 0) {
        return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data penjualan</div></div>`;
    }

    const perPromotor = {};
    Object.keys(allPromotor).forEach(key => {
        const p = allPromotor[key];
        if (p.aktif === false) return;
        perPromotor[key] = {
            key: key,
            nama: p.namaAbsen || '-',
            omzet: 0,
            unit: 0,
            transaksi: 0,
            uc: 0
        };
    });

    allPenjualan.forEach(x => {
        if (!x || !x.namaSales) return;
        const salesName = String(x.namaSales).trim().toUpperCase();
        const kat = String(x.kategori || '').trim().toUpperCase();
        const brg = String(x.namaBarang || '').toUpperCase();
        
        Object.keys(perPromotor).forEach(k => {
            const p = allPromotor[k];
            const pSales = String(p.namaSales || '').trim().toUpperCase();
            const pAbsen = String(p.namaAbsen || '').trim().toUpperCase();
            
            if (salesName === pSales || salesName.includes(pAbsen) || pAbsen.includes(salesName)) {
                perPromotor[k].omzet += Number(x.subtotal || x.omzet || 0);
                perPromotor[k].unit += Number(x.qty || 1);
                perPromotor[k].transaksi += 1;
                
                if (kat === 'GARANSI' && brg.includes('UFO CARE')) {
                    perPromotor[k].uc += Number(x.qty || 1);
                }
            }
        });
    });

    const arr = Object.values(perPromotor).sort((a, b) => b.omzet - a.omzet);
    const totalOmzetSemua = arr.reduce((s, x) => s + x.omzet, 0);
    const totalUCSemua = arr.reduce((s, x) => s + x.uc, 0);

    let html = `
        <div class="summary-card">
            <h2>${ICONS.chart} Perolehan All Promotor</h2>
            <p>${ICONS.users} Jumlah Promotor : <b>${arr.length}</b></p>
            <p>${ICONS.moneySmall} Total Omzet Toko : <span style="font-weight:bold; color:#34d399;">Rp ${totalOmzetSemua.toLocaleString('id-ID')}</span></p>
            <p>${ICONS.diamondSmall} Total UC : <b>${totalUCSemua}</b></p>
        </div>
        <div class="summary-card">
    `;

    arr.forEach((p, i) => {
        const rank = i + 1;
        const omzetVal = Number(p.omzet || 0);

        let warnaOmzet = '#ef4444';
        if (omzetVal >= 100000000) warnaOmzet = '#34d399';
        else if (omzetVal >= 80000000) warnaOmzet = '#f59e0b';

        const isSelected = (currentUser.role === 'ADMIN' && promotorTerpilih === p.key);
        const bgStyle = isSelected ? 'background:rgba(212,175,55,0.15); border-radius:8px; padding:10px 12px; margin:4px 0;' : '';

        html += `
            <div class="row-perolehan" style="display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); gap:10px; ${bgStyle}">
                <div style="display:flex; align-items:center; gap:10px; min-width:0; flex:1;">
                    <div style="width:26px; height:26px; border-radius:50%; background:#1f2937; border:1px solid rgba(212,175,55,0.3); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0; color:#d4af37;">
                        ${rank}
                    </div>
                    <div style="font-weight:600; font-size:13.5px; color:#ffffff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                        ${p.nama}
                    </div>
                </div>
                <div style="text-align:right; white-space:nowrap; flex-shrink:0;">
                    <div style="font-weight:700; font-size:13.5px; color:${warnaOmzet};">
                        Rp ${omzetVal.toLocaleString('id-ID')}
                    </div>
                    <div style="font-size:11.5px; font-weight:600; color:#d4af37; margin-top:2px; display:flex; align-items:center; justify-content:flex-end; gap:3px;">
                        ${ICONS.star} UC : ${p.uc || 0}
                    </div>
                </div>
            </div>
        `;
    });

    html += `</div>`;
    return html;
}

/* ============================================================ */
/* ===== RENDER: DENDA (ADMIN) =============================== */
/* ============================================================ */
function renderDenda() {
    const DENDA_UC_PER_UNIT = 5000;
    const DENDA_LATE_PER_KALI = 10000;
    const TARGET_UC_DEFAULT = 16;

    if (!allPromotor || Object.keys(allPromotor).length === 0) {
        return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data promotor</div></div>`;
    }

    let html = `
        <div class="summary-card">
            <h2>${ICONS.warning} Denda & Keterlambatan Semua Promotor</h2>
            <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:8px;">
                <div style="flex:1; min-width:140px; background:rgba(239,68,68,0.1); padding:10px; border-radius:10px; border:1px solid rgba(239,68,68,0.3);">
                    <div style="font-size:10px; color:#9ca3af; font-weight:700;">DENDA UC</div>
                    <div style="font-size:12.5px; color:#f87171; font-weight:700; margin-top:2px;">Rp 5.000 / Unit</div>
                </div>
                <div style="flex:1; min-width:140px; background:rgba(250,204,21,0.1); padding:10px; border-radius:10px; border:1px solid rgba(250,204,21,0.3);">
                    <div style="font-size:10px; color:#9ca3af; font-weight:700;">DENDA LATE</div>
                    <div style="font-size:12.5px; color:#facc15; font-weight:700; margin-top:2px;">Rp 10.000 / Kali</div>
                </div>
            </div>
        </div>
        <div class="card-grid">
    `;

    Object.keys(allPromotor).forEach(key => {
        const p = allPromotor[key];
        if (p.aktif === false) return;

        const cleanNama = String(p.namaSales || p.namaAbsen || '').trim().toUpperCase();
        let totalUC = 0;
        allPenjualan.forEach(x => {
            if (!x || !x.namaSales) return;
            const salesTrans = String(x.namaSales).trim().toUpperCase();
            const kat = String(x.kategori || '').trim().toUpperCase();
            const brg = String(x.namaBarang || '').toUpperCase();
            const isMine = (salesTrans === cleanNama) || salesTrans.includes(cleanNama) || cleanNama.includes(salesTrans);
            if (isMine && kat === 'GARANSI' && brg.includes('UFO CARE')) {
                totalUC += Number(x.qty || 1);
            }
        });

        const absensiP = allAbsensi[key] || {};
        let totalTerlambat = 0;
        Object.values(absensiP).forEach(a => {
            if (a && String(a.terlambat || '').toUpperCase() === 'YA') totalTerlambat++;
        });

        const isIkutUC = String(p.ikutUC || 'YA').toUpperCase() !== 'TIDAK';
        const targetUC = isIkutUC ? Number(p.targetUC || TARGET_UC_DEFAULT) : 0;
        const kurangUC = (isIkutUC && totalUC < targetUC) ? (targetUC - totalUC) : 0;
        const dendaUC = kurangUC * DENDA_UC_PER_UNIT;
        const dendaLate = totalTerlambat * DENDA_LATE_PER_KALI;
        const totalDenda = dendaUC + dendaLate;

        html += `
            <div class="card ${totalDenda > 0 ? 'warning' : 'success'}">
                <div class="tanggal">${p.namaAbsen || '-'}</div>
                <div class="row"><span>Denda UC</span><span style="color:${dendaUC > 0 ? '#f87171' : '#34d399'};">Rp ${dendaUC.toLocaleString('id-ID')}</span></div>
                <div class="row"><span>Denda Late (${totalTerlambat}x)</span><span style="color:${dendaLate > 0 ? '#facc15' : '#34d399'};">Rp ${dendaLate.toLocaleString('id-ID')}</span></div>
                <div class="row" style="border-top:1px solid rgba(255,255,255,0.1); margin-top:6px; padding-top:6px; font-weight:700;">
                    <span>TOTAL DENDA</span>
                    <span style="color:${totalDenda > 0 ? '#f87171' : '#34d399'};">Rp ${totalDenda.toLocaleString('id-ID')}</span>
                </div>
            </div>
        `;
    });

    html += `</div>`;
    return html;
}

/* ===== LOGOUT =============================================== */
/* ============================================================ */
function logoutPromotor() {
  if (!confirm("Yakin ingin keluar?")) return;
  localStorage.removeItem('ufo_promotor_session_v3');
  currentUser = null;
  allPenjualan = [];
  currentMenu = null;
  loginMode = 'promotor';
  promotorTerpilih = null;
  
  document.getElementById('dashboard').classList.add('hidden');
  document.body.classList.remove('dashboard-active');
  document.body.classList.add('login-active');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pilih-sales').value = '';
  document.getElementById('login-pin-input').value = '';
  document.getElementById('login-admin-username').value = '';
  document.getElementById('custom-select-label').innerText = '-- Pilih Nama Anda --';
  document.getElementById('custom-select-menu').querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  
  switchLoginTab('promotor');
  document.getElementById('topBar').classList.remove('admin-mode');
}
window.logoutPromotor = logoutPromotor;
