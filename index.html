<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNj8nRMP0ijH1GUXKeJlsE-EG5AYCkHBU",
  authDomain: "dashboardpromotor.firebaseapp.com",
  databaseURL: "https://dashboardpromotor-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dashboardpromotor",
  storageBucket: "dashboardpromotor.firebasestorage.app",
  messagingSenderId: "474469951678",
  appId: "1:474469951678:web:f769fed156a36505cbd6ef"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

signInAnonymously(auth).then(() => {
  window.db = db; window.dbRef = ref; window.dbSet = set; window.dbGet = get;
  window.dbUpdate = update; window.dbRemove = remove; window.dbOnValue = onValue;

}).catch(err => alert("Gagal koneksi Firebase: " + err.message));

onAuthStateChanged(auth, user => {
  if (!user) setTimeout(() => location.reload(), 1000);
});
</script>

        <div class="fut-field">
          <label>Masukkan PIN</label>
          <input type="password" id="login-pin-input" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="••••" autocomplete="off" class="fut-input">
        </div>
        <div id="login-error" class="fut-error"></div>
        <button type="button" id="btn-login-promotor" class="fut-btn">
          <span>MASUK</span>
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>

  <div class="dashboard-container">

        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

<script>
let allPenjualan = [];
let allPromotor = {};
let allAbsensi = {};
let infoData = { promo: [], rules: [] };
let currentUser = null;
let currentMenu = null;

const ICONS = {
  absensi: `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/></svg>`,
  penjualan: `<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`,
  uc: `<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
  brand: `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
  promo: `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
  sop: `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`,
  back: `<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
  empty: `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`
};

window.addEventListener('firebase-ready', () => {
  initParticles();
  loadPromotorList();
  loadInfoRealtime();
  const saved = localStorage.getItem('ufo_promotor_session_v3');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      currentUser = data;
      tampilkanDashboard();
    } catch(e) {}
  }
});

function initParticles() {
  const container = document.getElementById('fut-particles');
  if (!container) return;
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'fut-particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    const colors = ['#22d3ee', '#a855f7', '#3b82f6'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    p.style.background = color;
    p.style.boxShadow = `0 0 6px ${color}, 0 0 12px ${color}`;
    container.appendChild(p);
  }
}

function loadPromotorList() {
  window.dbOnValue(window.dbRef(window.db, 'users/promotor'), snap => {
    const liveEl = document.getElementById('live-status-text');
    if (!snap.exists()) {
      renderCustomSelectOptions([]);
      if (liveEl) liveEl.innerText = 'Belum ada promotor';
      return;
    }
    allPromotor = snap.val();
    const list = Object.keys(allPromotor).map(k => ({ key: k, ...allPromotor[k] }))
      .filter(p => p.aktif !== false)
      .sort((a,b) => (a.namaAbsen || '').localeCompare(b.namaAbsen || ''));
    renderCustomSelectOptions(list);
    if (liveEl) liveEl.innerText = `${list.length} promotor terdaftar`;
  });
}

function loadInfoRealtime() {
  window.dbOnValue(window.dbRef(window.db, 'info'), snap => {
    if (snap.exists()) {
      const data = snap.val();
      infoData.promo = data.promo || [];
      infoData.rules = data.rules || [];
    }
    if (currentMenu === 'promo' || currentMenu === 'sop') {
      tampilkanDetail(currentMenu);
    }
  });
}

function toggleCustomSelect() {
  const menu = document.getElementById('custom-select-menu');
  const trigger = document.getElementById('custom-select-trigger');
  if (!menu || !trigger) return;
  const isOpen = menu.classList.contains('open');
  if (isOpen) { menu.classList.remove('open'); trigger.classList.remove('open'); }
  else { menu.classList.add('open'); trigger.classList.add('open'); }
}

function pilihOpsiCustom(key, label) {
  document.getElementById('login-pilih-sales').value = key;
  document.getElementById('custom-select-label').innerText = label;
  const menu = document.getElementById('custom-select-menu');
  menu.querySelectorAll('.option').forEach(opt => opt.classList.toggle('selected', opt.dataset.value === key));
  menu.classList.remove('open');
  document.getElementById('custom-select-trigger').classList.remove('open');
}

function renderCustomSelectOptions(list) {
  const menu = document.getElementById('custom-select-menu');
  const labelEl = document.getElementById('custom-select-label');
  if (!menu || !labelEl) return;
  if (!list || list.length === 0) {
    menu.innerHTML = '<div class="option empty">-- Belum ada promotor --</div>';
    labelEl.innerText = '-- Belum ada promotor --';
    return;
  }
  labelEl.innerText = '-- Pilih Nama Anda --';
  menu.innerHTML = list.map(p => {
    const safeKey = String(p.key).replace(/"/g, '&quot;');
    const safeLabel = String(p.namaAbsen).replace(/"/g, '&quot;').replace(/'/g, "&#39;");
    return `<div class="option" data-value="${safeKey}" onclick="pilihOpsiCustom('${safeKey}', '${safeLabel}')">${p.namaAbsen}</div>`;
  }).join('');
}

document.addEventListener('click', (e) => {
  const wrap = document.getElementById('custom-select-trigger');
  const menu = document.getElementById('custom-select-menu');
  if (!wrap || !menu) return;
  if (!wrap.contains(e.target) && !menu.contains(e.target)) {
    menu.classList.remove('open');
    wrap.classList.remove('open');
  }
});

async function loginPromotor() {
  const key = document.getElementById('login-pilih-sales').value;
  const pin = document.getElementById('login-pin-input').value.trim();
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-login-promotor');
  errEl.innerHTML = '';
  if (!key) { errEl.innerHTML = '⚠️ Pilih nama dulu!'; return; }
  if (!pin) { errEl.innerHTML = '⚠️ Masukkan PIN!'; return; }
  const asli = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Memeriksa...';
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'users/promotor/' + key));
    if (!snap.exists()) {
      errEl.innerHTML = '⚠️ Promotor tidak ditemukan.';
      btn.disabled = false; btn.innerHTML = asli; return;
    }
    const data = snap.val();
    if (String(data.pin) !== pin) {
      errEl.innerHTML = '⚠️ PIN salah!';
      document.getElementById('login-pin-input').value = '';
      document.getElementById('login-pin-input').focus();
      btn.disabled = false; btn.innerHTML = asli; return;
    }
    currentUser = { key, ...data };
    localStorage.setItem('ufo_promotor_session_v3', JSON.stringify(currentUser));
    document.getElementById('login-toast-name').innerText = data.namaAbsen;
    const toast = document.getElementById('login-toast');
    toast.classList.add('active');
    setTimeout(() => {
      tampilkanDashboard();
      document.getElementById('login-pin-input').value = '';
      errEl.innerHTML = '';
      btn.disabled = false; btn.innerHTML = asli;
      setTimeout(() => { toast.classList.remove('active'); }, 600);
    }, 1000);
  } catch (err) {
    errEl.innerHTML = '⚠️ ' + err.message;
    btn.disabled = false; btn.innerHTML = asli;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('btn-login-promotor');
  if (btn) btn.onclick = loginPromotor;
  const pin = document.getElementById('login-pin-input');
  if (pin) {
    pin.addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); });
    pin.addEventListener('keypress', e => { if (e.key === 'Enter') loginPromotor(); });
  }
});

function tampilkanDashboard() {
  document.body.classList.remove('login-active');
  document.body.classList.add('dashboard-active');
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('userNama').innerText = currentUser.namaAbsen + ' (PROMOTOR)';

  window.dbOnValue(window.dbRef(window.db, 'penjualan'), snap => {
    allPenjualan = [];
    if (snap.exists()) {
      Object.values(snap.val()).forEach(item => {
        if (item && item.namaSales) allPenjualan.push(item);
      });
    }
    if (!currentMenu) renderMenuGrid();
    else tampilkanDetail(currentMenu);
  });

  window.dbOnValue(window.dbRef(window.db, 'absensi/' + currentUser.key), snap => {
    allAbsensi = snap.exists() ? snap.val() : {};
    if (currentMenu === 'absensi') tampilkanDetail('absensi');
  });

  renderMenuGrid();
}

function renderMenuGrid() {
  currentMenu = null;
  document.getElementById('detailView').classList.add('hidden');
  document.getElementById('detailView').innerHTML = '';
  const grid = document.getElementById('menuGrid');
  grid.classList.remove('hidden');
  const menus = [
    { key: 'absensi', icon: 'absensi', title: 'Absensi', desc: 'Rekap kehadiran finger', color: 't-absensi' },
    { key: 'penjualan', icon: 'penjualan', title: 'Penjualan', desc: 'Omzet harian', color: 't-penjualan' },
    { key: 'uc', icon: 'uc', title: 'UC', desc: 'Poin UC promotor', color: 't-uc' },
    { key: 'brand', icon: 'brand', title: 'Perolehan Brand', desc: 'Rekap brand Anda', color: 't-brand' },
    { key: 'promo', icon: 'promo', title: 'Promo Toko', desc: 'Promo aktif', color: 't-promo' },
    { key: 'sop', icon: 'sop', title: 'SOP Promotor', desc: 'Aturan kerja', color: 't-sop' }
  ];
  grid.innerHTML = menus.map(m => `
    <div class="menu-card" onclick="tampilkanDetail('${m.key}')">
      <div class="menu-icon ${m.color}">${ICONS[m.icon]}</div>
      <div class="menu-content">
        <div class="menu-title">${m.title}</div>
        <div class="menu-desc">${m.desc}</div>
      </div>
    </div>
  `).join('');
}

function kembaliKeMenu() {
  currentMenu = null;
  document.getElementById('detailView').classList.add('hidden');
  document.getElementById('detailView').innerHTML = '';
  document.getElementById('menuGrid').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function tampilkanDetail(menuKey) {
  currentMenu = menuKey;
  document.getElementById('menuGrid').classList.add('hidden');
  const detailEl = document.getElementById('detailView');
  detailEl.classList.remove('hidden');
  const titles = {
    absensi: { title: 'Absensi', subtitle: 'Rekap kehadiran dan status finger harian' },
    penjualan: { title: 'Penjualan', subtitle: 'Omzet produk harian dan perolehan unit' },
    uc: { title: 'UC', subtitle: 'Pencapaian poin UC promotor' },
    brand: { title: 'Perolehan Brand', subtitle: 'Rekap penjualan khusus brand Anda' },
    promo: { title: 'Promo Toko', subtitle: 'Daftar promo produk & program toko aktif' },
    sop: { title: 'SOP Promotor', subtitle: 'Aturan kerja & standar operasional' }
  };
  const t = titles[menuKey] || { title: 'Detail', subtitle: '' };
  let content = '';
  if (menuKey === 'absensi') content = renderAbsensi();
  else if (menuKey === 'penjualan') content = renderPenjualan();
  else if (menuKey === 'uc') content = renderUC();
  else if (menuKey === 'brand') content = renderBrand();
  else if (menuKey === 'promo') content = renderInfoList(infoData.promo, 'promo');
  else if (menuKey === 'sop') content = renderInfoList(infoData.rules, 'rules');

  detailEl.innerHTML = `
    <div class="back-bar">
      <button class="back-btn" onclick="kembaliKeMenu()">${ICONS.back} Kembali ke Menu</button>
    </div>
    <h2 class="detail-title">${t.title}</h2>
    <p class="detail-subtitle">${t.subtitle}</p>
    ${content}
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function tanggalKeNama(tglStr) {
  if (!tglStr) return '-';
  const parts = String(tglStr).split('/');
  if (parts.length !== 3) return tglStr;
  const mm = parseInt(parts[0]);
  const dd = parseInt(parts[1]);
  const yyyy = parts[2];
  if (isNaN(dd) || isNaN(mm)) return tglStr;
  const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                     'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  return `${dd} ${namaBulan[mm - 1] || '?'} ${yyyy}`;
}

function parseTanggal(str) {
  if (!str) return null;
  const p = String(str).split('/');
  if (p.length !== 3) return null;
  return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
}
function isBulanIni(tgl) {
  const d = parseTanggal(tgl); if (!d) return false;
  const n = new Date();
  return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
}
function getDataSaya() {
  return allPenjualan.filter(x => x.namaSales === currentUser.namaSales);
}

// PENJUALAN
function renderPenjualan() {
  const list = getDataSaya();
  const totalOmzet = list.reduce((s, x) => {
    if (x.kategori === 'GARANSI' || x.kategori === 'ONGKOS') return s;
    return s + (Number(x.subtotal) || 0);
  }, 0);
  const totalUnit = list.reduce((s, x) => {
    if (x.kategori === 'GARANSI' || x.kategori === 'ONGKOS') return s;
    return s + (Number(x.qty) || 0);
  }, 0);

  let tglPertama = '-', tglTerakhir = '-';
  if (list.length > 0) {
    const tglSort = list.map(x => x.tanggal).filter(Boolean).sort((a, b) => {
      const da = parseTanggal(a), db = parseTanggal(b);
      return (da || 0) - (db || 0);
    });
    tglPertama = tglSort[0] || '-';
    tglTerakhir = tglSort[tglSort.length - 1] || '-';
  }

  let html = `
    <div style="background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(212,175,55,0.06)); border: 1px solid rgba(212,175,55,0.45); border-radius: 16px; padding: 18px; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(212,175,55,0.25);">
        <svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:#d4af37;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span style="font-size: 15px; font-weight: 800; color: #d4af37; letter-spacing: 0.5px; text-transform: uppercase;">${currentUser.namaAbsen || '-'}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; font-size: 13.5px;">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
          <span style="color: #94a3b8; flex-shrink: 0;">Periode</span>
          <b style="color: #ffffff; text-align: right;">${tanggalKeNama(tglPertama)} - ${tanggalKeNama(tglTerakhir)}</b>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: #94a3b8;">Total Unit</span>
          <b style="color: #38bdf8; font-size: 15px;">${totalUnit}</b>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: #94a3b8;">Total Omzet</span>
          <b style="color: #34d399; font-size: 15px;">Rp ${totalOmzet.toLocaleString('id-ID')}</b>
        </div>
      </div>
    </div>
  `;
if (list.length === 0) {
    return html + `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada transaksi</div></div>`;
  }

  const grupTanggal = {};
  list.forEach(x => {
    if (!grupTanggal[x.tanggal]) grupTanggal[x.tanggal] = [];
    grupTanggal[x.tanggal].push(x);
  });

  const keysSorted = Object.keys(grupTanggal).sort((a, b) => {
    const da = parseTanggal(a), db = parseTanggal(b);
    return (db || 0) - (da || 0);
  });

  html += `<div class="card-grid">`;

  keysSorted.forEach(tgl => {
    const items = grupTanggal[tgl];
    const totalHari = items.reduce((s, x) => {
      if (x.kategori === 'GARANSI' || x.kategori === 'ONGKOS') return s;
      return s + (Number(x.subtotal) || 0);
    }, 0);

    let isiProduk = '';
    items.forEach((it, idx) => {
      isiProduk += `
        <div style="${idx > 0 ? 'margin-top:10px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.06);' : ''}">
          <div style="font-size:13px; font-weight:700; line-height:1.4; margin-bottom:6px; color:#f3f4f6; word-break: break-word;">${it.namaBarang || '-'}</div>
          <div style="display:flex; justify-content:space-between; padding:2px 0; color:#9ca3af; font-size:12px;">
            <span>Qty</span><b style="color:#fff;">${it.qty || 0}</b>
          </div>
          <div style="display:flex; justify-content:space-between; padding:2px 0; color:#9ca3af; font-size:12px;">
            <span>Omzet</span><b style="color:#34d399;">Rp ${Number(it.subtotal || 0).toLocaleString('id-ID')}</b>
          </div>
        </div>`;
    });

    // Menggunakan struktur kelas 'card success' agar bentuk, border, dan padding-nya konsisten persis seperti file kedua
    html += `
      <div class="card success" style="margin-bottom: 0;">
        <div class="tanggal" style="display: flex; align-items: center; justify-content: center; gap: 6px;">
          <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#38bdf8;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          ${tanggalKeNama(tgl)}
        </div>
        ${isiProduk}
        <div class="row" style="display: flex; justify-content: space-between; padding-top: 8px; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); font-weight: 700; font-size: 12.5px; color: #fff;">
          <span>Total Hari Ini</span>
          <span style="color: #34d399;">Rp ${totalHari.toLocaleString('id-ID')}</span>
        </div>
      </div>
    `;
  });

  html += `</div>`;
  return html;
// UC
function renderUC() {
  const list = getDataSaya().filter(x => isBulanIni(x.tanggal) && x.kategori === 'GARANSI');
  const totalUC = list.reduce((s, x) => s + (Number(x.qty) || 0), 0);
  const targetUC = Number(currentUser.targetUC) || 0;
  const ikutUC = currentUser.ikutUC === 'YA';
  const kurangUC = ikutUC && totalUC < targetUC ? (targetUC - totalUC) : 0;
  let html = `
    <div class="stat-grid">
      <div class="stat-box">
        <div class="label">UC Bulan Ini</div>
        <div class="value gold">${totalUC}</div>
      </div>
      <div class="stat-box">
        <div class="label">Target UC</div>
        <div class="value ${ikutUC ? '' : 'red'}">${ikutUC ? targetUC : 'Non-Target'}</div>
      </div>
      ${ikutUC ? `
      <div class="stat-box full">
        <div class="label">Status</div>
        <div class="value ${kurangUC > 0 ? 'red' : 'green'}">${kurangUC > 0 ? 'Kurang ' + kurangUC + ' unit' : 'Tercapai'}</div>
      </div>` : ''}
    </div>
  `;
  if (list.length === 0) {
    return html + `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada UC bulan ini</div></div>`;
  }

  html += `<div class="card-grid">`;
  list.forEach(x => {
    html += `
      <div style="background: rgba(10,25,47,0.75); border: 1px solid var(--border); border-left: 5px solid #10b981; border-radius: 14px; padding: 16px;">
        <div style="text-align: center; font-weight: 800; color: #ffffff; font-size: 14px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid rgba(30,58,95,0.8); display: flex; align-items: center; justify-content: center; gap: 6px;">
          <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:#38bdf8;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          ${tanggalKeNama(x.tanggal)}
        </div>
        <div style="font-size:13px; font-weight:700; line-height:1.4; margin-bottom:8px; color:#f3f4f6; word-break: break-word;">${x.namaBarang || '-'}</div>
        <div style="display:flex; justify-content:space-between; padding:3px 0; color:#9ca3af; font-size:12px;">
          <span>Qty</span><b style="color:#fff;">${x.qty || 0}</b>
        </div>
      </div>
    `;
  });
  html += `</div>`;
  return html;
}

// BRAND
function renderBrand() {
  const list = getDataSaya().filter(x => isBulanIni(x.tanggal) && x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS');
  const perBrand = {};
  list.forEach(x => {
    const b = x.merk || 'TANPA MERK';
    if (!perBrand[b]) perBrand[b] = { omzet: 0, unit: 0 };
    perBrand[b].omzet += Number(x.subtotal) || 0;
    perBrand[b].unit += Number(x.qty) || 0;
  });
  const arr = Object.keys(perBrand).map(k => ({ brand: k, ...perBrand[k] })).sort((a, b) => b.omzet - a.omzet);
  if (arr.length === 0) return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada penjualan bulan ini</div></div>`;
  
  let html = `<div class="card-grid">`;
  arr.forEach(x => {
    html += `
      <div style="background: rgba(10,25,47,0.75); border: 1px solid var(--border); border-left: 5px solid #d4af37; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between;">
        <div>
          <div style="font-size: 15px; font-weight: 800; color: #ffffff; margin-bottom: 8px;">${x.brand}</div>
          <div style="font-size: 12.5px; color: #94a3b8; font-weight: 600; margin-bottom: 14px;">${x.unit} unit terjual</div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid rgba(30,58,95,0.8);">
          <span style="font-size: 12px; color: #94a3b8; font-weight: 600;">Total Omzet</span>
          <span style="font-size: 14.5px; font-weight: 800; color: #34d399;">Rp ${x.omzet.toLocaleString('id-ID')}</span>
        </div>
      </div>
    `;
  });
  html += `</div>`;
  return html;
}

// ABSENSI
function renderAbsensi() {
  const entries = Object.values(allAbsensi || {}).filter(x => x && x.hari);
  entries.sort((a, b) => (Number(a.hari) || 0) - (Number(b.hari) || 0));

  if (entries.length === 0) {
    return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data absensi</div></div>`;
  }

  let totalTerlambat = 0, tidakMasuk = 0, tidakPulang = 0;
  entries.forEach(x => {
    const isNoMasuk = !x.masuk || String(x.masuk).trim() === '' || x.masuk === '-';
    const isNoPulang = !x.pulang || String(x.pulang).trim() === '' || x.pulang === '-';
    if (String(x.terlambat).toUpperCase() === 'YA') totalTerlambat++;
    if (isNoMasuk) tidakMasuk++;
    if (isNoPulang) tidakPulang++;
  });

  const svgTrophy = `<svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:#d4af37;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>`;
  const svgCalendar = `<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#38bdf8;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;margin-right:4px;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;

  let html = `
    <div style="background: linear-gradient(135deg, rgba(212,175,55,0.18), rgba(212,175,55,0.06)); border: 1px solid rgba(212,175,55,0.45); border-radius: 16px; padding: 18px; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(212,175,55,0.25);">
        ${svgTrophy}
        <span style="font-size: 15px; font-weight: 800; color: #d4af37; letter-spacing: 0.5px; text-transform: uppercase;">${currentUser.namaAbsen || '-'}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; font-size: 13.5px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: #94a3b8;">Total Hari Absen</span>
          <b style="color: #38bdf8; font-size: 15px;">${entries.length}</b>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: #94a3b8;">Datang Terlambat</span>
          <b style="color: #fbbf24; font-size: 15px;">${totalTerlambat}</b>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: #94a3b8;">Tidak Finger Masuk</span>
          <b style="color: #ef4444; font-size: 15px;">${tidakMasuk}</b>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: #94a3b8;">Tidak Finger Pulang</span>
          <b style="color: #ef4444; font-size: 15px;">${tidakPulang}</b>
        </div>
      </div>
    </div>
    <div class="card-grid">
  `;

  entries.forEach(x => {
    const isTerlambat = String(x.terlambat || "").toUpperCase() === "YA";
    const isNoMasuk = !x.masuk || String(x.masuk).trim() === "" || x.masuk === "-";
    const isNoPulang = !x.pulang || String(x.pulang).trim() === "" || x.pulang === "-";

    let statusText = "Lengkap";
    let statusColor = "#34d399";
    let statusBg = "rgba(16,185,129,0.15)";
    let borderColor = "rgba(16,185,129,0.5)";

    if (isNoMasuk && isNoPulang) {
      statusText = "Tidak Finger";
      statusColor = "#ef4444";
      statusBg = "rgba(239,68,68,0.15)";
      borderColor = "rgba(239,68,68,0.5)";
    } else if (isNoMasuk) {
      statusText = "Tidak Finger Masuk";
      statusColor = "#f59e0b";
      statusBg = "rgba(245,158,11,0.15)";
      borderColor = "rgba(245,158,11,0.5)";
    } else if (isNoPulang) {
      statusText = "Tidak Finger Pulang";
      statusColor = "#f59e0b";
      statusBg = "rgba(245,158,11,0.15)";
      borderColor = "rgba(245,158,11,0.5)";
    } else if (isTerlambat) {
      statusText = "Terlambat";
      statusColor = "#fbbf24";
      statusBg = "rgba(251,191,36,0.15)";
      borderColor = "rgba(251,191,36,0.5)";
    }

    html += `
      <div style="background: rgba(10,25,47,0.75); border: 2px solid ${borderColor}; border-radius: 14px; padding: 14px;">
        <div style="text-align: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(30,58,95,0.8);">
          <div style="font-size: 14px; font-weight: 800; color: #ffffff; margin-bottom: 6px; display:flex; align-items:center; justify-content:center; gap:5px;">
            ${svgCalendar} ${x.hari}
          </div>
          <div style="font-size: 11.5px; font-weight: 800; color: ${statusColor}; background: ${statusBg}; padding: 4px 12px; border-radius: 100px; display: inline-block;">${statusText}</div>
        </div>
        <div style="font-size: 12px; display: flex; flex-direction: column; gap: 7px;">
          <div style="display: flex; justify-content: space-between; color: #94a3b8;">
            <span>Masuk</span>
            <b style="color: ${isNoMasuk ? '#ef4444' : '#ffffff'}; font-family: monospace; font-size: 12.5px;">${isNoMasuk ? 'TIDAK FINGER' : x.masuk}</b>
          </div>
          <div style="display: flex; justify-content: space-between; color: #94a3b8;">
            <span>Istirahat 1</span>
            <span style="color: ${x.istirahat1 ? '#ffffff' : '#64748b'}; font-family: monospace; font-size: 12.5px;">${x.istirahat1 || '-'}</span>
          </div>
          <div style="display: flex; justify-content: space-between; color: #94a3b8;">
            <span>Kembali 1</span>
            <span style="color: ${x.kembali1 ? '#ffffff' : '#64748b'}; font-family: monospace; font-size: 12.5px;">${x.kembali1 || '-'}</span>
          </div>
          <div style="display: flex; justify-content: space-between; color: #94a3b8;">
            <span>Istirahat 2</span>
            <span style="color: ${x.istirahat2 ? '#ffffff' : '#64748b'}; font-family: monospace; font-size: 12.5px;">${x.istirahat2 || '-'}</span>
          </div>
          <div style="display: flex; justify-content: space-between; color: #94a3b8;">
            <span>Kembali 2</span>
            <span style="color: ${x.kembali2 ? '#ffffff' : '#64748b'}; font-family: monospace; font-size: 12.5px;">${x.kembali2 || '-'}</span>
          </div>
          <div style="display: flex; justify-content: space-between; color: #94a3b8; padding-top: 8px; border-top: 1px solid rgba(30,58,95,0.8); margin-top: 6px;">
            <span>Pulang</span>
            <b style="color: ${isNoPulang ? '#ef4444' : '#ffffff'}; font-family: monospace; font-size: 12.5px;">${isNoPulang ? 'TIDAK FINGER' : x.pulang}</b>
          </div>
        </div>
      </div>
    `;
  });

  html += `</div>`;
  return html;
}

// INFO LIST (Promo / Rules)
function renderInfoList(arr, jenis) {
  if (!arr || arr.length === 0) {
    return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data</div></div>`;
  }
  if (jenis === 'promo') {
    return arr.map(x => `
      <div class="info-block">
        <div class="judul">${ICONS.promo} ${x.judul || '-'}</div>
        ${x.periode ? `<div class="meta">${x.periode}</div>` : ''}
        <div class="deskripsi" style="margin-top:10px;">${x.detail || '-'}</div>
      </div>
    `).join('');
  } else if (jenis === 'rules') {
    return arr.map(x => `
      <div class="info-block">
        <div class="judul">${ICONS.sop} ${x.poin || '-'}</div>
        <div class="deskripsi" style="margin-top:10px;">${x.deskripsi || '-'}</div>
      </div>
    `).join('');
  }
  return '';
}

function logoutPromotor() {
  if (!confirm("Yakin ingin keluar?")) return;
  localStorage.removeItem('ufo_promotor_session_v3');
  currentUser = null;
  allPenjualan = [];
  currentMenu = null;
  document.getElementById('dashboard').classList.add('hidden');
  document.body.classList.remove('dashboard-active');
  document.body.classList.add('login-active');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pilih-sales').value = '';
  document.getElementById('login-pin-input').value = '';
  document.getElementById('custom-select-label').innerText = '-- Pilih Nama Anda --';
  document.getElementById('custom-select-menu').querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
}
</script>
