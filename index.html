<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNj8nRMP0ijH1GUXKeJlsE-EG5AYCkHBU",
  authDomain: "dashboardpromotor.firebaseapp.com",
  databaseURL: "https://dashboardpromotor-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dashboardpromotor",
  storageBucket: "dashboardpromotor.firebasestorage.app",
  messagingSenderId: "474469951678",
  appId: "1:474469951678:web:f769fed156a36505cbd6ef"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

signInAnonymously(auth).then(() => {
  window.db = db; window.dbRef = ref; window.dbSet = set; window.dbGet = get;
  window.dbUpdate = update; window.dbRemove = remove; window.dbOnValue = onValue;
  window.dbPush = push;
  window.dispatchEvent(new Event('firebase-ready'));
}).catch(err => alert("Gagal koneksi Firebase: " + err.message));

onAuthStateChanged(auth, user => {
  if (!user) setTimeout(() => location.reload(), 1000);
});
</script>

<script>
let allPenjualan = [];
let allPromotor = {};
let allAbsensi = {};
let infoData = { promo: [], rules: [] };
let currentUser = null;
let currentMenu = null;

const ICONS = {
  absensi: `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/></svg>`,
  penjualan: `<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`,
  uc: `<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
  brand: `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
  promo: `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
  sop: `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`,
  back: `<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
  empty: `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
  money: `<svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#d4af37;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;margin-right:4px;"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
  calendar: `<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:#38bdf8;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;margin-right:4px;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`
};

window.addEventListener('firebase-ready', () => {
  initParticles();
  loadPromotorList();
  loadInfoRealtime();
  const saved = localStorage.getItem('ufo_promotor_session_v3');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      currentUser = data;
      tampilkanDashboard();
    } catch(e) {}
  }
});

function initParticles() {
  const container = document.getElementById('fut-particles');
  if (!container) return;
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'fut-particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    const colors = ['#22d3ee', '#a855f7', '#3b82f6'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    p.style.background = color;
    p.style.boxShadow = `0 0 6px ${color}, 0 0 12px ${color}`;
    container.appendChild(p);
  }
}

function loadPromotorList() {
  window.dbOnValue(window.dbRef(window.db, 'users/promotor'), snap => {
    const liveEl = document.getElementById('live-status-text');
    if (!snap.exists()) {
      renderCustomSelectOptions([]);
      if (liveEl) liveEl.innerText = 'Belum ada promotor';
      return;
    }
    allPromotor = snap.val();
    const list = Object.keys(allPromotor).map(k => ({ key: k, ...allPromotor[k] }))
      .filter(p => p.aktif !== false)
      .sort((a,b) => (a.namaAbsen || '').localeCompare(b.namaAbsen || ''));
    renderCustomSelectOptions(list);
    if (liveEl) liveEl.innerText = `${list.length} promotor terdaftar`;
  });
}

function loadInfoRealtime() {
  window.dbOnValue(window.dbRef(window.db, 'info'), snap => {
    if (snap.exists()) {
      const data = snap.val();
      infoData.promo = data.promo || [];
      infoData.rules = data.rules || [];
    }
    if (currentMenu === 'promo' || currentMenu === 'sop') {
      tampilkanDetail(currentMenu);
    }
  });
}

function toggleCustomSelect() {
  const menu = document.getElementById('custom-select-menu');
  const trigger = document.getElementById('custom-select-trigger');
  if (!menu || !trigger) return;
  const isOpen = menu.classList.contains('open');
  if (isOpen) { menu.classList.remove('open'); trigger.classList.remove('open'); }
  else { menu.classList.add('open'); trigger.classList.add('open'); }
}

function pilihOpsiCustom(key, label) {
  document.getElementById('login-pilih-sales').value = key;
  document.getElementById('custom-select-label').innerText = label;
  const menu = document.getElementById('custom-select-menu');
  menu.querySelectorAll('.option').forEach(opt => opt.classList.toggle('selected', opt.dataset.value === key));
  menu.classList.remove('open');
  document.getElementById('custom-select-trigger').classList.remove('open');
}
window.pilihOpsiCustom = pilihOpsiCustom;
window.toggleCustomSelect = toggleCustomSelect;

function renderCustomSelectOptions(list) {
  const menu = document.getElementById('custom-select-menu');
  const labelEl = document.getElementById('custom-select-label');
  if (!menu || !labelEl) return;
  if (!list || list.length === 0) {
    menu.innerHTML = '<div class="option empty">-- Belum ada promotor --</div>';
    labelEl.innerText = '-- Belum ada promotor --';
    return;
  }
  labelEl.innerText = '-- Pilih Nama Anda --';
  menu.innerHTML = list.map(p => {
    const safeKey = String(p.key).replace(/"/g, '&quot;');
    const safeLabel = String(p.namaAbsen).replace(/"/g, '&quot;').replace(/'/g, "&#39;");
    return `<div class="option" data-value="${safeKey}" onclick="pilihOpsiCustom('${safeKey}', '${safeLabel}')">${p.namaAbsen}</div>`;
  }).join('');
}

document.addEventListener('click', (e) => {
  const wrap = document.getElementById('custom-select-trigger');
  const menu = document.getElementById('custom-select-menu');
  if (!wrap || !menu) return;
  if (!wrap.contains(e.target) && !menu.contains(e.target)) {
    menu.classList.remove('open');
    wrap.classList.remove('open');
  }
});

async function loginPromotor() {
  const key = document.getElementById('login-pilih-sales').value;
  const pin = document.getElementById('login-pin-input').value.trim();
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-login-promotor');
  errEl.innerHTML = '';
  if (!key) { errEl.innerHTML = '⚠️ Pilih nama dulu!'; return; }
  if (!pin) { errEl.innerHTML = '⚠️ Masukkan PIN!'; return; }
  const asli = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Memeriksa...';
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'users/promotor/' + key));
    if (!snap.exists()) {
      errEl.innerHTML = '⚠️ Promotor tidak ditemukan.';
      btn.disabled = false; btn.innerHTML = asli; return;
    }
    const data = snap.val();
    if (String(data.pin) !== pin) {
      errEl.innerHTML = '⚠️ PIN salah!';
      document.getElementById('login-pin-input').value = '';
      document.getElementById('login-pin-input').focus();
      btn.disabled = false; btn.innerHTML = asli; return;
    }
    currentUser = { key, ...data };
    localStorage.setItem('ufo_promotor_session_v3', JSON.stringify(currentUser));
    document.getElementById('login-toast-name').innerText = data.namaAbsen;
    const toast = document.getElementById('login-toast');
    toast.classList.add('active');
    setTimeout(() => {
      tampilkanDashboard();
      document.getElementById('login-pin-input').value = '';
      errEl.innerHTML = '';
      btn.disabled = false; btn.innerHTML = asli;
      setTimeout(() => { toast.classList.remove('active'); }, 600);
    }, 1000);
  } catch (err) {
    errEl.innerHTML = '⚠️ ' + err.message;
    btn.disabled = false; btn.innerHTML = asli;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('btn-login-promotor');
  if (btn) btn.onclick = loginPromotor;
  const pin = document.getElementById('login-pin-input');
  if (pin) {
    pin.addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); });
    pin.addEventListener('keypress', e => { if (e.key === 'Enter') loginPromotor(); });
  }
});

function tampilkanDashboard() {
  document.body.classList.remove('login-active');
  document.body.classList.add('dashboard-active');
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('userNama').innerHTML = `⭕ <b>${currentUser.namaAbsen}</b>`;

  window.dbOnValue(window.dbRef(window.db, 'penjualan'), snap => {
    allPenjualan = [];
    if (snap.exists()) {
      Object.values(snap.val()).forEach(item => {
        if (item && item.namaSales) allPenjualan.push(item);
      });
    }
    if (!currentMenu) renderMenuGrid();
    else tampilkanDetail(currentMenu);
  });

  window.dbOnValue(window.dbRef(window.db, 'absensi/' + currentUser.key), snap => {
    allAbsensi = snap.exists() ? snap.val() : {};
    if (currentMenu === 'absensi') tampilkanDetail('absensi');
  });

  renderMenuGrid();
}

function renderMenuGrid() {
  currentMenu = null;
  document.getElementById('detailView').classList.add('hidden');
  document.getElementById('detailView').innerHTML = '';
  const grid = document.getElementById('menuGrid');
  grid.classList.remove('hidden');
  const menus = [
    { key: 'absensi', icon: 'absensi', title: 'Absensi', desc: 'Rekap kehadiran dan status finger harian' },
    { key: 'penjualan', icon: 'penjualan', title: 'Penjualan', desc: 'Omzet produk harian dan perolehan unit' },
    { key: 'uc', icon: 'uc', title: 'UC', desc: 'Pencapaian poin UC promotor' },
    { key: 'brand', icon: 'brand', title: 'Perolehan Brand', desc: 'Rekap penjualan khusus brand/ID Anda sendiri' },
    { key: 'promo', icon: 'promo', title: 'Promo Toko', desc: 'Daftar promo produk & program toko aktif' },
    { key: 'sop', icon: 'sop', title: 'SOP Promotor', desc: 'Aturan kerja & standar operasional' }
  ];
  grid.innerHTML = menus.map(m => `
    <div class="menu-card" onclick="tampilkanDetail('${m.key}')">
      <div class="menu-icon">${ICONS[m.icon]}</div>
      <div class="menu-content">
        <div class="menu-title">${m.title}</div>
        <p class="menu-desc">${m.desc}</p>
      </div>
    </div>
  `).join('');
}
window.renderMenuGrid = renderMenuGrid;

function kembaliKeMenu() {
  currentMenu = null;
  document.getElementById('detailView').classList.add('hidden');
  document.getElementById('detailView').innerHTML = '';
  document.getElementById('menuGrid').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.kembaliKeMenu = kembaliKeMenu;

function tampilkanDetail(menuKey) {
  currentMenu = menuKey;
  document.getElementById('menuGrid').classList.add('hidden');
  const detailEl = document.getElementById('detailView');
  detailEl.classList.remove('hidden');
  const titles = {
    absensi: { title: 'Absensi', subtitle: 'Rekap kehadiran dan status finger harian' },
    penjualan: { title: 'Penjualan', subtitle: 'Omzet produk harian dan perolehan unit' },
    uc: { title: 'UC', subtitle: 'Pencapaian poin UC promotor' },
    brand: { title: 'Perolehan Brand', subtitle: 'Rekap penjualan khusus brand Anda' },
    promo: { title: 'Promo Toko', subtitle: 'Daftar promo produk & program toko aktif' },
    sop: { title: 'SOP Promotor', subtitle: 'Aturan kerja & standar operasional' }
  };
  const t = titles[menuKey] || { title: 'Detail', subtitle: '' };
  let content = '';
  if (menuKey === 'absensi') content = renderAbsensi();
  else if (menuKey === 'penjualan') content = renderPenjualan();
  else if (menuKey === 'uc') content = renderUC();
  else if (menuKey === 'brand') content = renderBrand();
  else if (menuKey === 'promo') content = renderInfoList(infoData.promo, 'promo');
  else if (menuKey === 'sop') content = renderInfoList(infoData.rules, 'rules');

  detailEl.innerHTML = `
    <div class="back-bar">
      <button class="back-btn" onclick="kembaliKeMenu()">${ICONS.back} Kembali ke Menu</button>
    </div>
    <h2 class="detail-title">${t.title}</h2>
    <p class="detail-subtitle">${t.subtitle}</p>
    ${content}
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.tampilkanDetail = tampilkanDetail;

function tanggalKeNama(tglStr) {
  if (!tglStr) return '-';
  const parts = String(tglStr).split('/');
  if (parts.length !== 3) return tglStr;
  const mm = parseInt(parts[0]);
  const dd = parseInt(parts[1]);
  const yyyy = parts[2];
  if (isNaN(dd) || isNaN(mm)) return tglStr;
  const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                     'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  return `${dd} ${namaBulan[mm - 1] || '?'} ${yyyy}`;
}

function parseTanggal(str) {
  if (!str) return null;
  const p = String(str).split('/');
  if (p.length !== 3) return null;
  return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
}
function isBulanIni(tgl) {
  const d = parseTanggal(tgl); if (!d) return false;
  const n = new Date();
  return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
}
function getDataSaya() {
  return allPenjualan.filter(x => x.namaSales === currentUser.namaSales);
}

// PENJUALAN (Icons updated to SVG)
function renderPenjualan() {
  const list = getDataSaya();
  const totalOmzet = list.reduce((s, x) => {
    if (x.kategori === 'GARANSI' || x.kategori === 'ONGKOS') return s;
    return s + (Number(x.subtotal) || 0);
  }, 0);
  const totalUnit = list.reduce((s, x) => {
    if (x.kategori === 'GARANSI' || x.kategori === 'ONGKOS') return s;
    return s + (Number(x.qty) || 0);
  }, 0);

  let tglPertama = '-', tglTerakhir = '-';
  if (list.length > 0) {
    const tglSort = list.map(x => x.tanggal).filter(Boolean).sort((a, b) => {
      const da = parseTanggal(a), db = parseTanggal(b);
      return (da || 0) - (db || 0);
    });
    tglPertama = tglSort[0] || '-';
    tglTerakhir = tglSort[tglSort.length - 1] || '-';
  }

  let html = `
    <div class="summary-card">
      <h2>${ICONS.money} ${currentUser.namaAbsen || '-'}</h2>
      <p>Periode : <b>${tanggalKeNama(tglPertama)} - ${tanggalKeNama(tglTerakhir)}</b></p>
      <p>Total Unit : <b>${totalUnit}</b></p>
      <p>Total Omzet : <span style="font-weight:bold; color:#34d399;">Rp ${totalOmzet.toLocaleString('id-ID')}</span></p>
    </div>
  `;

  if (list.length === 0) {
    return html + `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada transaksi</div></div>`;
  }

  const grupTanggal = {};
  list.forEach(x => {
    if (!grupTanggal[x.tanggal]) grupTanggal[x.tanggal] = [];
    grupTanggal[x.tanggal].push(x);
  });

  const keysSorted = Object.keys(grupTanggal).sort((a, b) => {
    const da = parseTanggal(a), db = parseTanggal(b);
    return (db || 0) - (da || 0);
  });

  html += `<div class="card-grid">`;

  keysSorted.forEach(tgl => {
    const items = grupTanggal[tgl];
    const totalHari = items.reduce((s, x) => {
      if (x.kategori === 'GARANSI' || x.kategori === 'ONGKOS') return s;
      return s + (Number(x.subtotal) || 0);
    }, 0);

    let isiProduk = '';
    items.forEach((it, idx) => {
      isiProduk += `
        <div style="${idx > 0 ? 'margin-top:8px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.05);' : ''}">
          <div style="font-size:12.5px; font-weight:600; line-height:1.3; margin-bottom:4px; color:#e5e7eb;">${it.namaBarang || '-'}</div>
          <div class="row"><span>Qty</span><span>${it.qty || 0}</span></div>
          <div class="row"><span>Omzet</span><span>Rp ${Number(it.subtotal || 0).toLocaleString('id-ID')}</span></div>
        </div>`;
    });

    html += `
      <div class="card success">
        <div class="tanggal">${ICONS.calendar} ${tanggalKeNama(tgl)}</div>
        ${isiProduk}
        <div class="row" style="font-weight:700; font-size:13px; margin-top:6px;"><span>Total Hari Ini</span><span>Rp ${totalHari.toLocaleString('id-ID')}</span></div>
      </div>
    `;
  });

  html += `</div>`;
  return html;
}

// --- Fungsi Helper untuk Merapikan Format Tanggal (DD/MM/YYYY) ---
function formatTanggalIndo(tglStr) {
    if (!tglStr) return "-";
    let s = String(tglStr).trim();
    
    // Jika formatnya YYYY-MM-DD
    if (s.includes('-')) {
        const parts = s.split(' ')[0].split('-');
        if (parts.length === 3) {
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
    }
    
    // Jika formatnya MM/DD/YYYY dari Excel -> ubah jadi DD/MM/YYYY
    if (s.includes('/')) {
        const parts = s.split(' ')[0].split('/');
        if (parts.length === 3) {
            return `${parts[1]}/${parts[0]}/${parts[2]}`;
        }
    }
    
    return s;
}

// --- Fungsi Utama Render UC (UFO Care+ / Garansi Saja) ---
function renderUC() {
    const listAll = getDataSaya();
    
    const list = listAll.filter(x => {
        if (!x) return false;
        const tgl = String(x.tanggal || '');
        const noFaktur = String(x.nomorFaktur || x.noFaktur || '').toUpperCase();
        const kat = String(x.kategori || '').trim().toUpperCase();
        const namaBrd = String(x.namaBarang || '').trim().toUpperCase();
        
        // Cek apakah transaksi masuk bulan Oktober 2026
        const isOktoberFaktur = noFaktur.includes('2610');
        const isOktoberTgl = tgl.includes('/10/2026') || tgl.includes('2026-10') || tgl.includes('2026-01-10');
        
        // STRICT FILTER: Hanya ambil yang benar-benar UFO Care / Garansi Tambahan murni
        const isMurniUC = (kat === 'GARANSI') && namaBrd.includes('UFO CARE');
        
        return (isOktoberFaktur || isOktoberTgl) && isMurniUC;
    });

    let totalUC = 0;
    list.forEach(x => {
        totalUC += Number(x.qty || 1);
    });

    const namaPromotor = currentUser ? currentUser.namaAbsen : "Promotor";

    let html = `
        <div class="summary-card">
            <h2>💎 ${namaPromotor}</h2>
            <p>Periode : <b>01/10/2026 - 31/10/2026</b></p>
            <p>Total UC : <b>${totalUC}</b></p>
        </div>
    `;

    if (list.length === 0) {
        return html + `<div class="card"><div class="pesan">Belum ada data UC untuk bulan Oktober 2026</div></div>`;
    }

    html += `<div class="card-grid">`;
    list.forEach(x => {
        const namaProduk = x.namaBarang || x.produk || "-";
        // Tanggal otomatis dirapikan jadi DD/MM/YYYY
        const tanggalTrans = formatTanggalIndo(x.tanggal); 
        const qtyTrans = x.qty || 1;

        html += `
        <div class="card success">
            <div class="tanggal">${ICONS.calendar} ${tanggalTrans}</div>
            <div style="font-size:12.5px; font-weight:600; line-height:1.3; margin:8px 0; color:#e5e7eb;">${namaProduk}</div>
            <div class="row"><span>Qty</span><span>${qtyTrans}</span></div>
        </div>`;
    });
    html += `</div>`;
    
    return html;
}
function tampilkanHasilUC(listDetail, namaPromotor, totalUC) {
    const summaryEl = document.getElementById("summary");
    if (summaryEl) {
        summaryEl.innerHTML = `
        <div class="summary-card">
            <h2>💎 ${namaPromotor || 'Promotor'}</h2>
            <p>Periode : <b>01/10/2026 - 31/10/2026</b></p>
            <p>Total UC : <b>${totalUC}</b></p>
        </div>`;
    }

    const hasilEl = document.getElementById("hasil");
    if (!hasilEl) return;

    if (listDetail.length === 0) {
        hasilEl.className = "grid";
        hasilEl.innerHTML = `<div class="card">Belum ada data UC untuk bulan Oktober 2026</div>`;
        return;
    }

    let html = "";
    listDetail.forEach(x => {
        html += `
        <div class="card success">
            <div class="tanggal">📅 ${x.tanggal}</div>
            <div style="font-size:12px; font-weight:600; line-height:1.3; margin:8px 0; color:#e5e7eb;">${x.produk}</div>
            <div class="row"><span>Qty</span><span>${x.qty}</span></div>
        </div>`;
    });

    hasilEl.className = "grid";
    hasilEl.innerHTML = html;
}
function renderBrand() {
  const list = getDataSaya().filter(x => isBulanIni(x.tanggal) && x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS');
  const perBrand = {};
  list.forEach(x => {
    const b = x.merk || 'TANPA MERK';
    if (!perBrand[b]) perBrand[b] = { omzet: 0, unit: 0 };
    perBrand[b].omzet += Number(x.subtotal) || 0;
    perBrand[b].unit += Number(x.qty) || 0;
  });
  const arr = Object.keys(perBrand).map(k => ({ brand: k, ...perBrand[k] })).sort((a, b) => b.omzet - a.omzet);
  if (arr.length === 0) return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada penjualan bulan ini</div></div>`;
  
  let html = `<div class="card-grid">`;
  arr.forEach(x => {
    html += `
      <div class="card success">
        <div style="font-size: 15px; font-weight: 800; color: #ffffff; margin-bottom: 8px;">${x.brand}</div>
        <div style="font-size: 13px; color: #94a3b8; font-weight: 600; margin-bottom: 14px;">${x.unit} unit terjual</div>
        <div class="row" style="font-weight:700;"><span>Total Omzet</span><span style="color:#34d399;">Rp ${x.omzet.toLocaleString('id-ID')}</span></div>
      </div>
    `;
  });
  html += `</div>`;
  return html;
}

// ABSENSI
function renderAbsensi() {
  const entries = Object.values(allAbsensi || {}).filter(x => x && x.hari);
  entries.sort((a, b) => (Number(a.hari) || 0) - (Number(b.hari) || 0));

  if (entries.length === 0) {
    return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data absensi</div></div>`;
  }

  let totalTerlambat = 0, tidakMasuk = 0, tidakPulang = 0;
  entries.forEach(x => {
    const isNoMasuk = !x.masuk || String(x.masuk).trim() === '' || x.masuk === '-';
    const isNoPulang = !x.pulang || String(x.pulang).trim() === '' || x.pulang === '-';
    if (String(x.terlambat).toUpperCase() === 'YA') totalTerlambat++;
    if (isNoMasuk) tidakMasuk++;
    if (isNoPulang) tidakPulang++;
  });

  const svgTrophy = `<svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#d4af37;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;margin-right:4px;"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>`;

  let html = `
    <div class="summary-card">
      <h2>${svgTrophy} ${currentUser.namaAbsen || '-'}</h2>
      <p>Total Hari Absen : <b>${entries.length}</b></p>
      <p>Datang Terlambat : <b>${totalTerlambat}</b></p>
      <p>Tidak Finger Masuk : <b style="color:#f87171;">${tidakMasuk}</b></p>
      <p>Tidak Finger Pulang : <b style="color:#f87171;">${tidakPulang}</b></p>
    </div>
    <div class="card-grid">
  `;

  entries.forEach(x => {
    const isTerlambat = String(x.terlambat || "").toUpperCase() === "YA";
    const isNoMasuk = !x.masuk || String(x.masuk).trim() === "" || x.masuk === "-";
    const isNoPulang = !x.pulang || String(x.pulang).trim() === "" || x.pulang === "-";

    let statusText = "Lengkap";
    if (isNoMasuk && isNoPulang) statusText = "Tidak Finger";
    else if (isNoMasuk) statusText = "Tidak Finger Masuk";
    else if (isNoPulang) statusText = "Tidak Finger Pulang";

    const status = `<span class="${(isNoMasuk || isNoPulang || isTerlambat) ? 'status-warning' : 'status-ok'}">${statusText}</span>`;

    html += `
      <div class="card ${isNoMasuk || isNoPulang ? 'warning' : 'success'} ${isTerlambat ? 'late' : ''}">
        <div class="tanggal">${ICONS.calendar} ${x.hari}<br>${status}</div>
        <div class="row"><span>Masuk</span>${isNoMasuk ? '<span class="kosong">TIDAK FINGER</span>' : `<span class="ok">${x.masuk}</span>`}</div>
        <div class="row"><span>Istirahat 1</span>${x.istirahat1 ? `<span class="ok">${x.istirahat1}</span>` : '<span class="kosong">-</span>'}</div>
        <div class="row"><span>Kembali 1</span>${x.kembali1 ? `<span class="ok">${x.kembali1}</span>` : '<span class="kosong">-</span>'}</div>
        <div class="row"><span>Istirahat 2</span>${x.istirahat2 ? `<span class="ok">${x.istirahat2}</span>` : '<span class="kosong">-</span>'}</div>
        <div class="row"><span>Kembali 2</span>${x.kembali2 ? `<span class="ok">${x.kembali2}</span>` : '<span class="kosong">-</span>'}</div>
        <div class="row"><span>Pulang</span>${isNoPulang ? '<span class="kosong">TIDAK FINGER</span>' : `<span class="ok">${x.pulang}</span>`}</div>
      </div>
    `;
  });

  html += `</div>`;
  return html;
}

// INFO LIST (Promo / Rules)
function renderInfoList(arr, jenis) {
  if (!arr || arr.length === 0) {
    return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data</div></div>`;
  }
  if (jenis === 'promo') {
    return arr.map(x => `
      <div class="info-block">
        <div class="judul" style="color:#d4af37;">🔥 ${x.judul || '-'}</div>
        ${x.periode ? `<div class="meta"><b>Periode:</b> ${x.periode}</div>` : ''}
        <div class="deskripsi" style="margin-top:6px; border-top:1px solid rgba(255,255,255,0.05); padding-top:6px;">${x.detail || '-'}</div>
      </div>
    `).join('');
  } else if (jenis === 'rules') {
    return arr.map(x => `
      <div class="info-block">
        <div class="judul" style="color:#d4af37;">📌 ${x.poin || '-'}</div>
        <div class="deskripsi" style="margin-top:6px;">${x.deskripsi || '-'}</div>
      </div>
    `).join('');
  }
  return '';
}

function logoutPromotor() {
  if (!confirm("Yakin ingin keluar?")) return;
  localStorage.removeItem('ufo_promotor_session_v3');
  currentUser = null;
  allPenjualan = [];
  currentMenu = null;
  document.getElementById('dashboard').classList.add('hidden');
  document.body.classList.remove('dashboard-active');
  document.body.classList.add('login-active');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pilih-sales').value = '';
  document.getElementById('login-pin-input').value = '';
  document.getElementById('custom-select-label').innerText = '-- Pilih Nama Anda --';
  document.getElementById('custom-select-menu').querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
}
window.logoutPromotor = logoutPromotor;
</script>
