<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, get, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNj8nRMP0ijH1GUXKeJlsE-EG5AYCkHBU",
  authDomain: "dashboardpromotor.firebaseapp.com",
  databaseURL: "https://dashboardpromotor-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dashboardpromotor",
  storageBucket: "dashboardpromotor.firebasestorage.app",
  messagingSenderId: "474469951678",
  appId: "1:474469951678:web:f769fed156a36505cbd6ef"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

signInAnonymously(auth).then(() => {
  window.db = db; window.dbRef = ref; window.dbSet = set; window.dbGet = get;
  window.dbUpdate = update; window.dbRemove = remove; window.dbOnValue = onValue;
  window.dbPush = push;
  window.dispatchEvent(new Event('firebase-ready'));
}).catch(err => alert("Gagal koneksi Firebase: " + err.message));

onAuthStateChanged(auth, user => {
  if (!user) setTimeout(() => location.reload(), 1000);
});
</script>

/* ============================================================ */
/* ===== LOGIN SCREEN (CYBER) ================================= */
/* ============================================================ */
body.login-active {

  background: var(--cyber-bg);
  overflow: hidden;
  min-height: 100vh;
}

}
.fut-grid {

}
@keyframes futGridMove { 0% { background-position: 0 0; } 100% { background-position: 40px 40px; } }

.fut-orb-1 { width: 400px; height: 400px; background: #0ea5e9; top: -100px; left: -100px; }
.fut-orb-2 { width: 300px; height: 300px; background: #a855f7; bottom: -80px; right: -80px; animation-delay: -4s; }
.fut-orb-3 { width: 350px; height: 350px; background: #06b6d4; top: 40%; left: 45%; animation-delay: -8s; opacity: 0.4; }
@keyframes futOrbFloat { 0%, 100% { transform: translate(0,0) scale(1); } 33% { transform: translate(40px,-30px) scale(1.1); } 66% { transform: translate(-30px,40px) scale(0.9); } }
.fut-particles { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
.fut-particle { position: absolute; width: 2px; height: 2px; border-radius: 50%; animation: futParticleFloat linear infinite; }

.fut-container { position: relative; z-index: 10; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; max-width: 1100px; width: 100%; animation: futFadeIn 0.8s ease-out; margin: auto; }

.fut-pulse-dot { width: 8px; height: 8px; background: #22d3ee; border-radius: 50%; animation: futDotPulse 1.5s infinite; }
.fut-right { display: flex; justify-content: center; }
.fut-card { width: 100%; max-width: 400px; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(34,211,238,0.2); border-radius: 24px; padding: 40px 32px; box-shadow: 0 0 60px rgba(14,165,233,0.15); position: relative; overflow: hidden; }

.fut-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #a855f7 100%); color: #ffffff; border: none; border-radius: 12px; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 0 30px rgba(34,211,238,0.4); }
.fut-btn:active { transform: scale(0.98); }

.login-toast-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 999999; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 16px; }

.detail-view { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(56, 189, 248, 0.15); border-radius: 20px; padding: 20px; animation: fadeIn 0.3s ease; }

<script>
/* ============================================================ */
/*  STATE                                                       */
/* ============================================================ */
let allPenjualan = [];
let allPromotor = {};
let allAbsensi = {};
let allPelanggaran = {};
let allRewardsSaya = {};
let infoData = { promo: [], rules: [], punishment: [], reward: [] };
let currentUser = null;
let currentMenu = null;

/* SVG ICONS */
const ICONS = {
  absensi: `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/></svg>`,
  penjualan: `<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`,
  uc: `<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
  perolehan: `<svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>`,
  brand: `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
  denda: `<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  promo: `<svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
  sop: `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`,
  punish: `<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  pelanggaran: `<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>`,
  reward: `<svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>`,
  rewardsaya: `<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>`,
  back: `<svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
  empty: `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`
};

/* ============================================================ */
/*  INIT                                                        */
/* ============================================================ */
window.addEventListener('firebase-ready', () => {
  initParticles();
  loadPromotorList();
  loadInfoRealtime();
  const saved = localStorage.getItem('ufo_promotor_session_v4');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      currentUser = data;
      tampilkanDashboard();
    } catch(e) {}
  }
});

function initParticles() {
  const container = document.getElementById('fut-particles');
  if (!container) return;
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'fut-particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    const colors = ['#22d3ee', '#a855f7', '#3b82f6'];
    const color = colors[Math.floor(Math.random() * colors.length)];
    p.style.background = color;
    p.style.boxShadow = `0 0 6px ${color}, 0 0 12px ${color}`;
    container.appendChild(p);
  }
}

function loadPromotorList() {
  window.dbOnValue(window.dbRef(window.db, 'users/promotor'), snap => {
    const liveEl = document.getElementById('live-status-text');
    if (!snap.exists()) {
      renderCustomSelectOptions([]);
      if (liveEl) liveEl.innerText = 'Belum ada promotor';
      return;
    }
    allPromotor = snap.val();
    const list = Object.keys(allPromotor).map(k => ({ key: k, ...allPromotor[k] }))
      .filter(p => p.aktif !== false)
      .sort((a,b) => (a.namaAbsen || "").localeCompare(b.namaAbsen || ""));
    renderCustomSelectOptions(list);
    if (liveEl) liveEl.innerText = `${list.length} promotor terdaftar`;
  });
}

function loadInfoRealtime() {
  window.dbOnValue(window.dbRef(window.db, 'info'), snap => {
    if (snap.exists()) {
      const data = snap.val();
      infoData.promo = data.promo || [];
      infoData.rules = data.rules || [];
      infoData.punishment = data.punishment || [];
      infoData.reward = data.reward || [];
    }
    if (currentMenu === 'promo' || currentMenu === 'sop' || currentMenu === 'punishment' || currentMenu === 'reward') {
      tampilkanDetail(currentMenu);
    }
  });
}

/* ============================================================ */
/*  DROPDOWN CUSTOM                                             */
/* ============================================================ */
function toggleCustomSelect() {
  const menu = document.getElementById('custom-select-menu');
  const trigger = document.getElementById('custom-select-trigger');
  if (!menu || !trigger) return;
  const isOpen = menu.classList.contains('open');
  if (isOpen) { menu.classList.remove('open'); trigger.classList.remove('open'); }
  else { menu.classList.add('open'); trigger.classList.add('open'); }
}

function pilihOpsiCustom(key, label) {
  document.getElementById('login-pilih-sales').value = key;
  document.getElementById('custom-select-label').innerText = label;
  const menu = document.getElementById('custom-select-menu');
  menu.querySelectorAll('.option').forEach(opt => opt.classList.toggle('selected', opt.dataset.value === key));
  menu.classList.remove('open');
  document.getElementById('custom-select-trigger').classList.remove('open');
}

function renderCustomSelectOptions(list) {
  const menu = document.getElementById('custom-select-menu');
  const labelEl = document.getElementById('custom-select-label');
  if (!menu || !labelEl) return;
  if (!list || list.length === 0) {
    menu.innerHTML = '<div class="option empty">-- Belum ada promotor --</div>';
    labelEl.innerText = '-- Belum ada promotor --';
    return;
  }
  labelEl.innerText = '-- Pilih Nama Anda --';
  menu.innerHTML = list.map(p => {
    const safeKey = String(p.key).replace(/"/g, '&quot;');
    const safeLabel = String(p.namaAbsen).replace(/"/g, '&quot;').replace(/'/g, "&#39;");
    return `<div class="option" data-value="${safeKey}" onclick="pilihOpsiCustom('${safeKey}', '${safeLabel}')">${p.namaAbsen}</div>`;
  }).join('');
}

document.addEventListener('click', (e) => {
  const wrap = document.getElementById('custom-select-trigger');
  const menu = document.getElementById('custom-select-menu');
  if (!wrap || !menu) return;
  if (!wrap.contains(e.target) && !menu.contains(e.target)) {
    menu.classList.remove('open');
    wrap.classList.remove('open');
  }
});

/* ============================================================ */
/*  LOGIN PROMOTOR                                              */
/* ============================================================ */
async function loginPromotor() {
  const key = document.getElementById('login-pilih-sales').value;
  const pin = document.getElementById('login-pin-input').value.trim();
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('btn-login-promotor');
  errEl.innerHTML = '';
  if (!key) { errEl.innerHTML = '⚠️ Pilih nama dulu!'; return; }
  if (!pin) { errEl.innerHTML = '⚠️ Masukkan PIN!'; return; }
  const asli = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Memeriksa...';
  try {
    const snap = await window.dbGet(window.dbRef(window.db, 'users/promotor/' + key));
    if (!snap.exists()) {
      errEl.innerHTML = '⚠️ Promotor tidak ditemukan.';
      btn.disabled = false; btn.innerHTML = asli; return;
    }
    const data = snap.val();
    if (String(data.pin) !== pin) {
      errEl.innerHTML = '⚠️ PIN salah!';
      document.getElementById('login-pin-input').value = '';
      document.getElementById('login-pin-input').focus();
      btn.disabled = false; btn.innerHTML = asli; return;
    }
    currentUser = { key, ...data };
    localStorage.setItem('ufo_promotor_session_v4', JSON.stringify(currentUser));
    document.getElementById('login-toast-name').innerText = data.namaAbsen;
    const toast = document.getElementById('login-toast');
    toast.classList.add('active');
    setTimeout(() => {
      tampilkanDashboard();
      document.getElementById('login-pin-input').value = '';
      errEl.innerHTML = '';
      btn.disabled = false; btn.innerHTML = asli;
      setTimeout(() => { toast.classList.remove('active'); }, 600);
    }, 1000);
  } catch (err) {
    errEl.innerHTML = '⚠️ ' + err.message;
    btn.disabled = false; btn.innerHTML = asli;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('btn-login-promotor');
  if (btn) btn.onclick = loginPromotor;
  const pin = document.getElementById('login-pin-input');
  if (pin) {
    pin.addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); });
    pin.addEventListener('keypress', e => { if (e.key === 'Enter') loginPromotor(); });
  }
});

/* ============================================================ */
/*  DASHBOARD                                                   */
/* ============================================================ */
function tampilkanDashboard() {
  document.body.classList.remove('login-active');
  document.body.classList.add('dashboard-active');
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('dashboard').classList.remove('hidden');
  document.getElementById('userNama').innerText = currentUser.namaAbsen + ' (PROMOTOR)';

  window.dbOnValue(window.dbRef(window.db, 'penjualan'), snap => {
    allPenjualan = [];
    if (snap.exists()) {
      Object.values(snap.val()).forEach(item => {
        if (item && item.namaSales) allPenjualan.push(item);
      });
    }
    if (!currentMenu) renderMenuGrid();
    else tampilkanDetail(currentMenu);
  });

  window.dbOnValue(window.dbRef(window.db, 'absensi/' + currentUser.key), snap => {
    allAbsensi = snap.exists() ? snap.val() : {};
    if (currentMenu === 'absensi') tampilkanDetail('absensi');
  });

  window.dbOnValue(window.dbRef(window.db, 'pelanggaran/' + currentUser.key), snap => {
    allPelanggaran = snap.exists() ? snap.val() : {};
    if (currentMenu === 'pelanggaran') tampilkanDetail('pelanggaran');
  });

  window.dbOnValue(window.dbRef(window.db, 'rewardsSaya/' + currentUser.key), snap => {
    allRewardsSaya = snap.exists() ? snap.val() : {};
    if (currentMenu === 'rewardsaya') tampilkanDetail('rewardsaya');
  });

  renderMenuGrid();
}

function renderMenuGrid() {
  currentMenu = null;
  const detailEl = document.getElementById('detailView');
  detailEl.style.display = 'none';
  detailEl.innerHTML = '';
  const grid = document.getElementById('menuGrid');
  grid.style.display = 'grid';

  const menus = [
    { key: 'absensi', icon: 'absensi', title: 'Absensi', desc: 'Rekap kehadiran dan status finger harian', color: 't-absensi' },
    { key: 'penjualan', icon: 'penjualan', title: 'Penjualan', desc: 'Omzet produk harian dan perolehan unit', color: 't-penjualan' },
    { key: 'uc', icon: 'uc', title: 'UC', desc: 'Pencapaian poin UC promotor', color: 't-uc' },
    { key: 'perolehan', icon: 'perolehan', title: 'Perolehan', desc: 'Peringkat & akumulasi omzet seluruh promotor', color: 't-perolehan' },
    { key: 'brand', icon: 'brand', title: 'Perolehan Brand', desc: 'Rekap penjualan khusus brand/ID Anda sendiri', color: 't-brand' },
    { key: 'denda', icon: 'denda', title: 'Denda & Late', desc: 'Rekapitulasi keterlambatan & denda target', color: 't-denda' },
    { key: 'promo', icon: 'promo', title: 'Promo Toko', desc: 'Daftar promo produk & program toko aktif', color: 't-promo' },
    { key: 'sop', icon: 'sop', title: 'SOP Promotor', desc: 'Aturan kerja & standar operasional', color: 't-sop' },
    { key: 'punishment', icon: 'punish', title: 'Punishment', desc: 'Daftar sanksi & ketentuan pelanggaran', color: 't-punish' },
    { key: 'pelanggaran', icon: 'pelanggaran', title: 'Pelanggaran Saya', desc: 'Catatan pelanggaran & sanksi promotor', color: 't-pelanggaran' },
    { key: 'reward', icon: 'reward', title: 'Daftar Rewards', desc: 'Daftar Rewards pencapaian toko', color: 't-reward' },
    { key: 'rewardsaya', icon: 'rewardsaya', title: 'Rewards Saya', desc: 'Riwayat Rewards yang Anda dapatkan', color: 't-rewardsaya' }
  ];

  grid.innerHTML = menus.map(m => `
    <div class="menu-card" onclick="tampilkanDetail('${m.key}')">
      <div class="menu-icon ${m.color}">${ICONS[m.icon]}</div>
      <div class="menu-title">${m.title}</div>
      <div class="menu-desc">${m.desc}</div>
    </div>
  `).join('');
}

function kembaliKeMenu() {
  currentMenu = null;
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('detailView').innerHTML = '';
  document.getElementById('menuGrid').style.display = 'grid';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function tampilkanDetail(menuKey) {
  currentMenu = menuKey;
  document.getElementById('menuGrid').style.display = 'none';
  const detailEl = document.getElementById('detailView');
  detailEl.style.display = 'block';
  const titles = {
    absensi: { title: 'Absensi', subtitle: 'Rekap kehadiran dan status finger harian' },
    penjualan: { title: 'Penjualan', subtitle: 'Omzet produk harian dan perolehan unit' },
    uc: { title: 'UC', subtitle: 'Pencapaian poin UC promotor' },
    perolehan: { title: 'Perolehan', subtitle: 'Peringkat & akumulasi omzet seluruh promotor' },
    brand: { title: 'Perolehan Brand', subtitle: 'Rekap penjualan khusus brand Anda' },
    denda: { title: 'Denda & Late', subtitle: 'Rekapitulasi keterlambatan & denda target' },
    promo: { title: 'Promo Toko', subtitle: 'Daftar promo produk & program toko aktif' },
    sop: { title: 'SOP Promotor', subtitle: 'Aturan kerja & standar operasional' },
    punishment: { title: 'Punishment', subtitle: 'Daftar sanksi & ketentuan pelanggaran' },
    pelanggaran: { title: 'Pelanggaran Saya', subtitle: 'Catatan pelanggaran & sanksi promotor' },
    reward: { title: 'Daftar Rewards', subtitle: 'Daftar Rewards pencapaian toko' },
    rewardsaya: { title: 'Rewards Saya', subtitle: 'Riwayat Rewards yang Anda dapatkan' }
  };
  const t = titles[menuKey] || { title: 'Detail', subtitle: '' };
  let content = '';
  if (menuKey === 'absensi') content = renderAbsensi();
  else if (menuKey === 'penjualan') content = renderPenjualan();
  else if (menuKey === 'uc') content = renderUC();
  else if (menuKey === 'perolehan') content = renderPerolehan();
  else if (menuKey === 'brand') content = renderBrand();
  else if (menuKey === 'denda') content = renderDenda();
  else if (menuKey === 'promo') content = renderInfoList(infoData.promo, 'promo');
  else if (menuKey === 'sop') content = renderInfoList(infoData.rules, 'rules');
  else if (menuKey === 'punishment') content = renderInfoList(infoData.punishment, 'punishment');
  else if (menuKey === 'pelanggaran') content = renderPelanggaranSaya();
  else if (menuKey === 'reward') content = renderInfoList(infoData.reward, 'reward');
  else if (menuKey === 'rewardsaya') content = renderRewardsSaya();

  detailEl.innerHTML = `
    <button class="back-btn" onclick="kembaliKeMenu()">${ICONS.back} Kembali ke Menu</button>
    <h2 class="detail-title">${t.title}</h2>
    <p class="detail-subtitle">${t.subtitle}</p>
    <div id="hasil">${content}</div>
    <div class="export-container" id="exportArea">
      <button class="btn-export btn-excel" onclick="prosesEkspor('excel')">📥 Unduh Excel</button>
      <button class="btn-export btn-pdf" onclick="prosesEkspor('pdf')">📄 Unduh PDF</button>
    </div>
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================ */
/*  HELPERS                                                     */
/* ============================================================ */
function parseTanggal(str) {
  if (!str) return null;
  const p = String(str).split('/');
  if (p.length !== 3) return null;
  return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
}
function isHariIni(tgl) {
  const d = parseTanggal(tgl); if (!d) return false;
  const n = new Date();
  return d.getDate() === n.getDate() && d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
}
function isBulanIni(tgl) {
  const d = parseTanggal(tgl); if (!d) return false;
  const n = new Date();
  return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
}
function getDataSaya() {
  return allPenjualan.filter(x => x.namaSales === currentUser.namaSales);
}
function hitungOmzet(list) {
  return list.filter(x => x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS').reduce((s, x) => s + (Number(x.subtotal) || 0), 0);
}
function hitungUnit(list) {
  return list.filter(x => x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS').reduce((s, x) => s + (Number(x.qty) || 0), 0);
}

/* ============================================================ */
/*  RENDER: ABSENSI                                             */
/* ============================================================ */
function renderAbsensi() {
  const entries = Object.values(allAbsensi || {}).filter(x => x && x.hari);
  entries.sort((a, b) => (Number(a.hari) || 0) - (Number(b.hari) || 0));

  let totalTerlambat = 0, tidakMasuk = 0, tidakPulang = 0;
  entries.forEach(x => {
    const isNoMasuk = !x.masuk || String(x.masuk).trim() === '' || x.masuk === '-';
    const isNoPulang = !x.pulang || String(x.pulang).trim() === '' || x.pulang === '-';
    if (String(x.terlambat).toUpperCase() === 'YA') totalTerlambat++;
    if (isNoMasuk) tidakMasuk++;
    if (isNoPulang) tidakPulang++;
  });

  if (entries.length === 0) {
    return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data absensi</div></div>`;
  }

  let html = `
    <div class="stat-grid">
      <div class="stat-box">
        <div class="label">Total Hari Absen</div>
        <div class="value">${entries.length}</div>
      </div>
      <div class="stat-box">
        <div class="label">Datang Terlambat</div>
        <div class="value gold">${totalTerlambat}</div>
      </div>
      <div class="stat-box">
        <div class="label">⚠️ Tidak Absen Masuk</div>
        <div class="value red">${tidakMasuk}x</div>
      </div>
      <div class="stat-box">
        <div class="label">⚠️ Tidak Absen Pulang</div>
        <div class="value red">${tidakPulang}x</div>
      </div>
    </div>
  `;

  entries.forEach(x => {
    const isTerlambat = String(x.terlambat || "").toUpperCase() === "YA";
    const isNoMasuk = !x.masuk || String(x.masuk).trim() === "" || x.masuk === "-";
    const isNoPulang = !x.pulang || String(x.pulang).trim() === "" || x.pulang === "-";
    const statusText = (isNoMasuk || isNoPulang) ? "Belum Lengkap / Bolong" : "Lengkap";
    const kelas = (isNoMasuk || isNoPulang) ? "warning" : "";
    const kelasLate = isTerlambat ? "late" : "";

    html += `
      <div class="absensi-card ${kelas} ${kelasLate}">
        <div class="absensi-tanggal">
          📅 ${x.hari}<br>
          <span class="${(isNoMasuk || isNoPulang) ? 'status-warning' : 'status-ok'}">${statusText}</span>
          ${isTerlambat ? '<div style="color:#d4af37;font-weight:700;margin-top:4px;">TERLAMBAT</div>' : ''}
        </div>
        <div class="absensi-row"><span>Masuk</span>${isNoMasuk ? '<span class="val-kosong">TIDAK FINGER</span>' : `<span class="val-ok">${x.masuk}</span>`}</div>
        <div class="absensi-row"><span>Istirahat 1</span>${x.istirahat1 ? `<span class="val-ok">${x.istirahat1}</span>` : '<span class="val-kosong">-</span>'}</div>
        <div class="absensi-row"><span>Kembali 1</span>${x.kembali1 ? `<span class="val-ok">${x.kembali1}</span>` : '<span class="val-kosong">-</span>'}</div>
        <div class="absensi-row"><span>Istirahat 2</span>${x.istirahat2 ? `<span class="val-ok">${x.istirahat2}</span>` : '<span class="val-kosong">-</span>'}</div>
        <div class="absensi-row"><span>Kembali 2</span>${x.kembali2 ? `<span class="val-ok">${x.kembali2}</span>` : '<span class="val-kosong">-</span>'}</div>
        <div class="absensi-row"><span>Pulang</span>${isNoPulang ? '<span class="val-kosong">TIDAK FINGER</span>' : `<span class="val-ok">${x.pulang}</span>`}</div>
      </div>
    `;
  });

  return html;
}

/* ============================================================ */
/*  RENDER: PENJUALAN                                           */
/* ============================================================ */
function renderPenjualan() {
  const list = getDataSaya();
  const listBulanIni = list.filter(x => isBulanIni(x.tanggal));
  const listHariIni = list.filter(x => isHariIni(x.tanggal));
  const omzetHari = hitungOmzet(listHariIni);
  const omzetBulan = hitungOmzet(listBulanIni);
  const unitBulan = hitungUnit(listBulanIni);

  let html = `
    <div class="stat-grid">
      <div class="stat-box full">
        <div class="label">Omzet Hari Ini</div>
        <div class="value green">Rp ${omzetHari.toLocaleString('id-ID')}</div>
      </div>
      <div class="stat-box">
        <div class="label">Omzet Bulan Ini</div>
        <div class="value green">Rp ${omzetBulan.toLocaleString('id-ID')}</div>
      </div>
      <div class="stat-box">
        <div class="label">Unit Bulan Ini</div>
        <div class="value">${unitBulan}</div>
      </div>
    </div>
  `;
  if (list.length === 0) {
    html += `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada transaksi</div></div>`;
  } else {
    const grupTanggal = {};
    list.forEach(x => {
      if (!grupTanggal[x.tanggal]) grupTanggal[x.tanggal] = [];
      grupTanggal[x.tanggal].push(x);
    });
    const keysSorted = Object.keys(grupTanggal).sort((a, b) => {
      const da = parseTanggal(a), db = parseTanggal(b);
      return (db || 0) - (da || 0);
    });
    keysSorted.forEach(tgl => {
      const items = grupTanggal[tgl];
      const totalHari = hitungOmzet(items);
      html += `<div style="margin-bottom:16px;">
        <div style="font-size:12px; font-weight:800; color:#38bdf8; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border);">${tgl} — Rp ${totalHari.toLocaleString('id-ID')}</div>
        ${items.map(x => `
          <div class="list-item-dark">
            <div class="kiri">
              <div class="produk">${x.namaBarang || '-'}</div>
              <div class="info">${x.merk || '-'} • ${x.kategori || '-'}</div>
            </div>
            <div class="kanan">
              <div class="harga">Rp ${Number(x.subtotal || 0).toLocaleString('id-ID')}</div>
              <div class="qty">Qty: ${x.qty || 0}</div>
            </div>
          </div>
        `).join('')}
      </div>`;
    });
  }
  return html;
}

/* ============================================================ */
/*  RENDER: UC                                                  */
/* ============================================================ */
function renderUC() {
  const list = getDataSaya().filter(x => isBulanIni(x.tanggal) && x.kategori === 'GARANSI');
  const totalUC = list.reduce((s, x) => s + (Number(x.qty) || 0), 0);
  const targetUC = Number(currentUser.targetUC) || 0;
  const ikutUC = currentUser.ikutUC === 'YA';
  const kurangUC = ikutUC && totalUC < targetUC ? (targetUC - totalUC) : 0;
  let html = `
    <div class="stat-grid">
      <div class="stat-box">
        <div class="label">UC Bulan Ini</div>
        <div class="value gold">${totalUC}</div>
      </div>
      <div class="stat-box">
        <div class="label">Target UC</div>
        <div class="value ${ikutUC ? '' : 'red'}">${ikutUC ? targetUC : 'Non-Target'}</div>
      </div>
      ${ikutUC ? `
      <div class="stat-box full">
        <div class="label">Status</div>
        <div class="value ${kurangUC > 0 ? 'red' : 'green'}">${kurangUC > 0 ? 'Kurang ' + kurangUC + ' unit' : 'Tercapai'}</div>
      </div>` : ''}
    </div>
  `;
  if (list.length === 0) {
    html += `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada UC bulan ini</div></div>`;
  } else {
    html += `<div style="font-size:12px; font-weight:800; color:#38bdf8; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border);">Detail UC</div>`;
    list.forEach(x => {
      html += `
        <div class="list-item-dark">
          <div class="kiri">
            <div class="produk">${x.namaBarang || '-'}</div>
            <div class="info">${x.tanggal} • ${x.merk || '-'}</div>
          </div>
          <div class="kanan"><div class="harga">${x.qty} unit</div></div>
        </div>
      `;
    });
  }
  return html;
}

/* ============================================================ */
/*  RENDER: PEROLEHAN (semua promotor)                          */
/* ============================================================ */
function renderPerolehan() {
  const hariIni = new Date();
  const bulanIni = `${hariIni.getFullYear()}-${String(hariIni.getMonth()+1).padStart(2,'0')}`;
  const perSales = {};
  allPenjualan.forEach(x => {
    if (!x.namaSales) return;
    const tgl = parseTanggal(x.tanggal);
    if (!tgl) return;
    const key = `${tgl.getFullYear()}-${String(tgl.getMonth()+1).padStart(2,'0')}`;
    if (key !== bulanIni) return;
    if (!perSales[x.namaSales]) perSales[x.namaSales] = { omzet: 0, unit: 0, uc: 0 };
    if (x.kategori === 'GARANSI') {
      perSales[x.namaSales].uc += Number(x.qty) || 0;
    } else if (x.kategori !== 'ONGKOS') {
      perSales[x.namaSales].omzet += Number(x.subtotal) || 0;
      perSales[x.namaSales].unit += Number(x.qty) || 0;
    }
  });

  const list = Object.values(allPromotor).map(p => ({
    nama: p.namaAbsen,
    merk: p.merk || '-',
    omzet: perSales[p.namaSales]?.omzet || 0,
    unit: perSales[p.namaSales]?.unit || 0,
    uc: perSales[p.namaSales]?.uc || 0
  })).sort((a, b) => b.omzet - a.omzet);

  const totalOmzet = list.reduce((s, x) => s + x.omzet, 0);
  const totalUC = list.reduce((s, x) => s + x.uc, 0);

  let html = `
    <div class="stat-grid">
      <div class="stat-box"><div class="label">Total Promotor</div><div class="value">${list.length}</div></div>
      <div class="stat-box"><div class="label">Total Unit</div><div class="value">${list.reduce((s,x) => s + x.unit, 0)}</div></div>
      <div class="stat-box"><div class="label">Total UC</div><div class="value gold">${totalUC}</div></div>
      <div class="stat-box full"><div class="label">Total Omzet</div><div class="value green">Rp ${totalOmzet.toLocaleString('id-ID')}</div></div>
    </div>
  `;
  list.forEach((x, i) => {
    html += `
      <div class="list-item-dark">
        <div class="kiri">
          <div class="produk">#${i+1} ${x.nama}</div>
          <div class="info">${x.merk} • ${x.unit} unit • UC: ${x.uc}</div>
        </div>
        <div class="kanan"><div class="harga">Rp ${x.omzet.toLocaleString('id-ID')}</div></div>
      </div>
    `;
  });
  return html;
}

/* ============================================================ */
/*  RENDER: BRAND SAYA                                          */
/* ============================================================ */
function renderBrand() {
  const list = getDataSaya().filter(x => isBulanIni(x.tanggal) && x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS');
  const perBrand = {};
  list.forEach(x => {
    const b = x.merk || 'TANPA MERK';
    if (!perBrand[b]) perBrand[b] = { omzet: 0, unit: 0 };
    perBrand[b].omzet += Number(x.subtotal) || 0;
    perBrand[b].unit += Number(x.qty) || 0;
  });
  const arr = Object.keys(perBrand).map(k => ({ brand: k, ...perBrand[k] })).sort((a, b) => b.omzet - a.omzet);
  if (arr.length === 0) return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada penjualan bulan ini</div></div>`;
  return arr.map(x => `
    <div class="list-item-dark">
      <div class="kiri">
        <div class="produk">${x.brand}</div>
        <div class="info">${x.unit} unit terjual</div>
      </div>
      <div class="kanan"><div class="harga">Rp ${x.omzet.toLocaleString('id-ID')}</div></div>
    </div>
  `).join('');
}

/* ============================================================ */
/*  RENDER: DENDA & LATE                                        */
/* ============================================================ */
function renderDenda() {
  const DENDA_UC_PER_UNIT = 5000;
  const DENDA_LATE_PER_KALI = 10000;
  const hariIni = new Date();
  const bulanIni = `${hariIni.getFullYear()}-${String(hariIni.getMonth()+1).padStart(2,'0')}`;

  const perSalesUC = {};
  allPenjualan.forEach(x => {
    if (!x.namaSales || x.kategori !== 'GARANSI') return;
    const tgl = parseTanggal(x.tanggal); if (!tgl) return;
    const key = `${tgl.getFullYear()}-${String(tgl.getMonth()+1).padStart(2,'0')}`;
    if (key !== bulanIni) return;
    perSalesUC[x.namaSales] = (perSalesUC[x.namaSales] || 0) + (Number(x.qty) || 0);
  });

  const list = Object.values(allPromotor).map(p => {
    const totalUC = perSalesUC[p.namaSales] || 0;
    const isIkutUC = p.ikutUC === 'YA';
    const targetUC = isIkutUC ? (p.targetUC || 16) : 0;
    const kurangUC = isIkutUC && totalUC < targetUC ? (targetUC - totalUC) : 0;
    const dendaUC = kurangUC * DENDA_UC_PER_UNIT;
    const totalDenda = dendaUC; // late belum ada
    return { nama: p.namaAbsen, totalUC, targetUC, isIkutUC, kurangUC, dendaUC, totalDenda };
  }).sort((a, b) => b.totalDenda - a.totalDenda);

  const grandTotal = list.reduce((s, x) => s + x.totalDenda, 0);

  let html = `
    <div class="stat-grid">
      <div class="stat-box"><div class="label">Denda UC</div><div class="value red" style="font-size:14px;">Rp 5.000 / unit</div></div>
      <div class="stat-box"><div class="label">Grand Total</div><div class="value red">Rp ${grandTotal.toLocaleString('id-ID')}</div></div>
    </div>
  `;
  list.forEach(p => {
    html += `
      <div class="list-item-dark">
        <div class="kiri">
          <div class="produk">${p.nama}</div>
          <div class="info">UC: ${p.totalUC}${p.isIkutUC ? `/${p.targetUC}` : ''} • Kurang: ${p.kurangUC} unit</div>
        </div>
        <div class="kanan">
          <div class="harga" style="color:#f87171;">Rp ${p.dendaUC.toLocaleString('id-ID')}</div>
        </div>
      </div>
    `;
  });
  return html;
}

/* ============================================================ */
/*  RENDER: PELANGGARAN SAYA                                    */
/* ============================================================ */
function renderPelanggaranSaya() {
  const entries = Object.values(allPelanggaran || {});
  if (entries.length === 0) {
    return `<div class="empty-state" style="border-color:rgba(16,185,129,0.4); background:rgba(16,185,129,0.05);">
      ${ICONS.sop}
      <div class="pesan" style="color:#34d399;">Bersih dari Pelanggaran</div>
      <div style="font-size:11.5px; color:#94a3b8; margin-top:4px;">Selamat, tidak ada catatan pelanggaran</div>
    </div>`;
  }
  return entries.map(x => `
    <div class="list-item-dark" style="border-left:3px solid #ef4444;">
      <div class="kiri">
        <div class="produk">${x.tanggal}</div>
        <div class="info" style="color:#cbd5e1;">${x.keterangan}</div>
        <div class="info" style="color:#f87171; margin-top:4px; font-weight:700;">Sanksi: ${x.denda}</div>
      </div>
    </div>
  `).join('');
}

/* ============================================================ */
/*  RENDER: REWARDS SAYA                                        */
/* ============================================================ */
function renderRewardsSaya() {
  const entries = Object.values(allRewardsSaya || {});
  if (entries.length === 0) {
    return `<div class="empty-state" style="border-color:rgba(251,191,36,0.4); background:rgba(251,191,36,0.05);">
      ${ICONS.rewardsaya}
      <div class="pesan" style="color:#fbbf24;">Belum Ada Reward</div>
      <div style="font-size:11.5px; color:#94a3b8; margin-top:4px;">Terus semangat mengejar target</div>
    </div>`;
  }
  return entries.map(x => `
    <div class="info-block">
      <div class="judul">${ICONS.reward} ${x.judul || 'Bonus Reward'}</div>
      <div class="meta">${x.tanggal || '-'}</div>
      <div class="deskripsi" style="margin-top:8px;">${x.detail || '-'}</div>
    </div>
  `).join('');
}

/* ============================================================ */
/*  RENDER: INFO LIST (Promo/SOP/Punishment/Reward)             */
/* ============================================================ */
function renderInfoList(arr, jenis) {
  if (!arr || arr.length === 0) {
    return `<div class="empty-state">${ICONS.empty}<div class="pesan">Belum ada data</div></div>`;
  }
  if (jenis === 'promo') {
    return arr.map(x => `
      <div class="info-block">
        <div class="judul">${ICONS.promo} ${x.judul || '-'}</div>
        ${x.periode ? `<div class="meta">${x.periode}</div>` : ''}
        <div class="deskripsi" style="margin-top:8px;">${x.detail || '-'}</div>
      </div>
    `).join('');
  } else if (jenis === 'rules') {
    return arr.map(x => `
      <div class="info-block">
        <div class="judul">${ICONS.sop} ${x.poin || '-'}</div>
        <div class="deskripsi" style="margin-top:8px;">${x.deskripsi || '-'}</div>
      </div>
    `).join('');
  } else if (jenis === 'punishment') {
    return arr.map(x => `
      <div class="info-block">
        <div class="judul">${ICONS.punish} ${x.judul || '-'}</div>
        ${x.level ? `<div class="meta">Sanksi: ${x.level}</div>` : ''}
        <div class="deskripsi" style="margin-top:8px;">${x.detail || '-'}</div>
      </div>
    `).join('');
  } else if (jenis === 'reward') {
    return arr.map(x => `
      <div class="info-block">
        <div class="judul">${ICONS.reward} ${x.judul || '-'}</div>
        ${x.periode ? `<div class="meta">${x.periode}</div>` : ''}
        <div class="deskripsi" style="margin-top:8px;">${x.detail || '-'}</div>
      </div>
    `).join('');
  }
  return '';
}

/* ============================================================ */
/*  EXPORT                                                      */
/* ============================================================ */
function prosesEkspor(format) {
  const namaKaryawan = currentUser.namaAbsen || 'Promotor';
  const namaFile = `Laporan_${currentMenu}_${namaKaryawan.replace(/\s+/g, '_')}`;
  const targetElement = document.getElementById('hasil');
  if (!targetElement) return;

  if (format === 'excel') {
    let rowsArr = [];
    if (currentMenu === 'absensi') {
      rowsArr.push(["LAPORAN ABSENSI PROMOTOR: " + namaKaryawan.toUpperCase()], []);
      rowsArr.push(["Tanggal", "Status", "Masuk", "Istirahat 1", "Kembali 1", "Istirahat 2", "Kembali 2", "Pulang"]);
      targetElement.querySelectorAll(".absensi-card").forEach(card => {
        const tglText = card.querySelector(".absensi-tanggal").innerText.replace(/📅/g, '').split("\n")[0].trim();
        const status = card.querySelector(".absensi-tanggal").innerText.includes("Lengkap") ? "Lengkap" : "Bolong";
        const rows = card.querySelectorAll(".absensi-row");
        rowsArr.push([
          tglText, status,
          rows[0]?.querySelector(".val-ok, .val-kosong")?.innerText || "-",
          rows[1]?.querySelector(".val-ok, .val-kosong")?.innerText || "-",
          rows[2]?.querySelector(".val-ok, .val-kosong")?.innerText || "-",
          rows[3]?.querySelector(".val-ok, .val-kosong")?.innerText || "-",
          rows[4]?.querySelector(".val-ok, .val-kosong")?.innerText || "-",
          rows[5]?.querySelector(".val-ok, .val-kosong")?.innerText || "-"
        ]);
      });
    } else {
      showPopup("Export hanya tersedia untuk Absensi.");
      return;
    }
    if (rowsArr.length > 0) {
      const ws = XLSX.utils.aoa_to_sheet(rowsArr);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, currentMenu);
      XLSX.writeFile(wb, `${namaFile}.xlsx`);
    }
  } else if (format === 'pdf') {
    const elemenPrint = targetElement.cloneNode(true);
    elemenPrint.style.color = "#000";
    elemenPrint.style.background = "#fff";
    elemenPrint.style.padding = "20px";
    html2pdf().set({ margin: 10, filename: `${namaFile}.pdf`, html2canvas: { scale: 2 }, jsPDF: { format: 'a4' } }).from(elemenPrint).save();
  }
}

/* ============================================================ */
/*  LOGOUT                                                      */
/* ============================================================ */
function logoutPromotor() {
  if (!confirm("Yakin ingin keluar?")) return;
  localStorage.removeItem('ufo_promotor_session_v4');
  currentUser = null;
  allPenjualan = [];
  currentMenu = null;
  document.getElementById('dashboard').style.display = 'none';
  document.body.classList.remove('dashboard-active');
  document.body.classList.add('login-active');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pilih-sales').value = '';
  document.getElementById('login-pin-input').value = '';
  document.getElementById('custom-select-label').innerText = '-- Pilih Nama Anda --';
  document.getElementById('custom-select-menu').querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
}

function showPopup(pesan) {
  alert(pesan);
}
