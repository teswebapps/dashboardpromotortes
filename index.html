<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promotor — UFO Kebonsari</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCNj8nRMP0ijH1GUXKeJlsE-EG5AYCkHBU",
  authDomain: "dashboardpromotor.firebaseapp.com",
  databaseURL: "https://dashboardpromotor-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dashboardpromotor",
  storageBucket: "dashboardpromotor.firebasestorage.app",
  messagingSenderId: "474469951678",
  appId: "1:474469951678:web:f769fed156a36505cbd6ef"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

signInAnonymously(auth).then(() => {
  window.db = db; window.dbRef = ref; window.dbGet = get; window.dbOnValue = onValue;
  window.dispatchEvent(new Event('firebase-ready'));
}).catch(err => alert("Gagal koneksi Firebase: " + err.message));

onAuthStateChanged(auth, user => {
  if (!user) setTimeout(() => location.reload(), 1000);
});
</script>

<style>
:root {
  --card: #ffffff; --soft: #f1f5f9; --text: #0f172a;
  --muted: #64748b; --border: #e2e8f0; --primary: #2563eb;
  --success: #059669; --danger: #dc2626; --warning: #d97706; --gold: #d4af37;
}
* { box-sizing: border-box; font-family: 'Inter', sans-serif !important; }
body {
  margin: 0; padding: 16px;
  background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
  color: var(--text); min-height: 100vh;
  display: flex; justify-content: center;
}
.container {
  width: 100%; max-width: 820px;
  background: var(--card); border-radius: 20px;
  padding: 24px; border: 1px solid var(--border);
  box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.05);
  height: fit-content;
}
.header {
  background: linear-gradient(135deg, #0f172a, #1e293b);
  border-radius: 14px; padding: 20px; color: white;
  text-align: center; margin-bottom: 20px;
}
.header h1 { margin: 0; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
.header h1 svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; }
.header p { margin: 6px 0 0; font-size: 12.5px; color: #94a3b8; }
.card {
  background: var(--soft); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px; margin-bottom: 16px;
}
.card h3 {
  margin: 0 0 12px; font-size: 13px; font-weight: 800;
  text-transform: uppercase; color: var(--primary);
  letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px;
}
.card h3 svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2.2; fill: none; }
label {
  display: block; font-size: 11px; font-weight: 700;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 6px; letter-spacing: 0.3px;
}
input, select {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: #f8fafc;
  font-size: 14px; font-weight: 600; color: var(--text);
  outline: none; box-sizing: border-box;
}
input:focus { border-color: var(--primary); background: #fff; }
button {
  width: 100%; padding: 12px 16px; border-radius: 12px;
  font-size: 12px; font-weight: 700; cursor: pointer;
  border: none; text-transform: uppercase;
  letter-spacing: 0.3px; transition: all 0.2s;
  display: inline-flex; justify-content: center; align-items: center; gap: 8px;
}
button svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.4; fill: none; }
.btn-primary { background: var(--primary); color: white; }
.btn-soft { background: var(--soft); color: var(--text); border: 1px solid var(--border); }
.btn-sm { padding: 8px 12px; font-size: 11px; width: auto; }
.hidden { display: none !important; }
.alert { padding: 12px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
.alert svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.4; fill: none; flex-shrink: 0; }
.alert.ok { background: #ecfdf5; color: #065f46; border: 1px solid #6ee7b7; }
.alert.err { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
.alert.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white; border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
.stat-card .label { font-size: 9.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px; }
.stat-card .value { font-size: 16px; font-weight: 900; color: var(--primary); }
.stat-card.full { grid-column: 1 / -1; }
.menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.menu-item {
  background: white; border: 1px solid var(--border);
  border-radius: 14px; padding: 16px 12px;
  text-align: center; cursor: pointer;
  transition: all 0.2s; display: flex;
  flex-direction: column; align-items: center; gap: 8px;
}
.menu-item:hover { border-color: var(--primary); transform: translateY(-2px); }
.menu-item.active { background: var(--primary); border-color: var(--primary); color: white; }
.menu-item svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 1.8; fill: none; color: var(--primary); }
.menu-item.active svg { color: white; }
.menu-item .nama { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3px; }
.absensi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.absensi-hari {
  background: white; border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 8px; text-align: center;
}
.absensi-hari .hari { font-size: 10px; font-weight: 800; color: var(--muted); margin-bottom: 4px; }
.absensi-hari .jam { font-size: 11px; font-weight: 700; color: var(--text); }
.absensi-hari .ket { font-size: 9px; margin-top: 2px; }
.absensi-hari .ket.late { color: var(--danger); font-weight: 800; }
.absensi-hari .ket.ok { color: var(--success); }
.rekap-tabel { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
.rekap-tabel th { background: #f1f5f9; color: var(--muted); font-weight: 800; text-transform: uppercase; font-size: 10px; padding: 8px 6px; text-align: center; border-bottom: 2px solid var(--border); }
.rekap-tabel th.kolom-nama { text-align: left; padding-left: 12px; }
.rekap-tabel td { padding: 10px 6px; text-align: center; font-weight: 700; border-bottom: 1px solid var(--border); color: var(--text); }
.rekap-tabel td.kolom-nama { text-align: left; padding-left: 12px; font-weight: 800; }
.rekap-tabel td.angka-deal { color: #059669; }
.rekap-tabel td.angka-lihat { color: #d97706; }
.rekap-tabel td.angka-nosale { color: #dc2626; }
.list-item {
  background: white; border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; margin-bottom: 8px;
}
.list-item .nama { font-size: 13px; font-weight: 700; }
.list-item .detail { font-size: 11px; color: var(--muted); margin-top: 2px; }
.progress-wrap { background: #e2e8f0; border-radius: 20px; height: 20px; overflow: hidden; margin-top: 6px; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #2563eb, #059669); display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; font-weight: 800; }
@media (max-width: 480px) {
  body { padding: 12px; }
  .container { padding: 16px; border-radius: 16px; }
  .menu-grid { grid-template-columns: 1fr 1fr; }
  .absensi-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Dashboard Promotor
    </h1>
    <p>UFO Malang Kebonsari</p>
  </div>

  <!-- LOGIN -->
  <div id="loginBox">
    <div class="card">
      <h3><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Login Promotor</h3>
      <label>Nama Absen</label>
      <input type="text" id="loginNama" placeholder="Nama Absen Anda" autocomplete="off">
      <div style="height:10px;"></div>
      <label>PIN</label>
      <input type="password" id="loginPin" placeholder="••••" maxlength="6" inputmode="numeric"
        style="text-align:center; font-size:18px; letter-spacing:6px; font-weight:800;"
        oninput="this.value = this.value.replace(/\D/g,'')"
        onkeypress="if(event.key === 'Enter') loginPromotor()">
      <div style="height:10px;"></div>
      <button class="btn-primary" onclick="loginPromotor()">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Masuk
      </button>
      <div id="loginError" class="alert err hidden" style="margin-top:10px;"></div>
    </div>
  </div>

  <!-- PANEL PROMOTOR -->
  <div id="panelPromotor" class="hidden">
    <div class="card" style="background:linear-gradient(135deg,#2563eb,#1e40af);color:white;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:11px;opacity:0.8;font-weight:700;text-transform:uppercase;">Selamat datang</div>
          <div id="welcomeNama" style="font-size:16px;font-weight:900;margin-top:2px;"></div>
        </div>
        <button class="btn-soft btn-sm" onclick="logoutPromotor()" style="width:auto;">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div class="menu-grid" id="menuGrid"></div>
    <div style="height:12px;"></div>
    <div id="kontenMenu"></div>
  </div>
</div>

<script>
let currentUser = null;
let currentMenu = '';
let dataPenjualan = {};
let dataAbsensi = {};
let dataInfo = {};
let dataPelanggaran = {};
let dataRewardsSaya = {};

window.addEventListener('firebase-ready', () => {
  const saved = localStorage.getItem('ufo_promotor_login');
  if (saved) {
    try {
      const u = JSON.parse(saved);
      currentUser = u;
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('panelPromotor').classList.remove('hidden');
      document.getElementById('welcomeNama').textContent = u.namaAbsen;
      mulaiPromotor();
    } catch(e) { localStorage.removeItem('ufo_promotor_login'); }
  }
});

async function loginPromotor() {
  const nama = document.getElementById('loginNama').value.trim();
  const pin = document.getElementById('loginPin').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  if (!nama || !pin) { errEl.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> Isi nama & PIN!'; errEl.classList.remove('hidden'); return; }

  try {
    // Ambil semua promotor, cari berdasarkan namaAbsen (case-insensitive)
    const snap = await window.dbGet(window.dbRef(window.db, 'users/promotor'));
    if (!snap.exists()) { errEl.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> Belum ada data promotor. Hubungi admin.'; errEl.classList.remove('hidden'); return; }

    const all = snap.val();
    let found = null;
    for (const key of Object.keys(all)) {
      if (all[key].namaAbsen && all[key].namaAbsen.toLowerCase() === nama.toLowerCase()) {
        found = all[key]; break;
      }
    }
    if (!found) { errEl.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> Nama tidak ditemukan'; errEl.classList.remove('hidden'); return; }
    if (String(found.pin) !== pin) { errEl.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> PIN salah!'; errEl.classList.remove('hidden'); return; }

    currentUser = found;
    localStorage.setItem('ufo_promotor_login', JSON.stringify(found));
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('panelPromotor').classList.remove('hidden');
    document.getElementById('welcomeNama').textContent = found.namaAbsen;
    mulaiPromotor();
  } catch (err) {
    errEl.innerText = 'Gagal: ' + err.message;
    errEl.classList.remove('hidden');
  }
}

function logoutPromotor() {
  localStorage.removeItem('ufo_promotor_login');
  currentUser = null;
  location.reload();
}

function mulaiPromotor() {
  window.dbOnValue(window.dbRef(window.db, 'penjualan'), snap => {
    dataPenjualan = snap.exists() ? snap.val() : {};
    if (currentMenu) renderKonten();
  });
  window.dbOnValue(window.dbRef(window.db, 'absensi'), snap => {
    dataAbsensi = snap.exists() ? snap.val() : {};
    if (currentMenu) renderKonten();
  });
  window.dbOnValue(window.dbRef(window.db, 'info'), snap => {
    dataInfo = snap.exists() ? snap.val() : {};
    if (currentMenu) renderKonten();
  });
  window.dbOnValue(window.dbRef(window.db, 'pelanggaran'), snap => {
    dataPelanggaran = snap.exists() ? snap.val() : {};
    if (currentMenu) renderKonten();
  });
  window.dbOnValue(window.dbRef(window.db, 'rewardsSaya'), snap => {
    dataRewardsSaya = snap.exists() ? snap.val() : {};
    if (currentMenu) renderKonten();
  });
  renderMenu();
}

function renderMenu() {
  const menus = [
    { id: 'absensi', nama: 'Absensi', icon: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>' },
    { id: 'penjualan', nama: 'Penjualan', icon: '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>' },
    { id: 'uc', nama: 'UC', icon: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>' },
    { id: 'perolehan', nama: 'Perolehan Brand', icon: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>' },
    { id: 'promo', nama: 'Promo', icon: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>' },
    { id: 'sop', nama: 'SOP', icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>' },
    { id: 'punishment', nama: 'Punishment', icon: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>' },
    { id: 'pelanggaran', nama: 'Pelanggaran', icon: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' },
    { id: 'daftarReward', nama: 'Daftar Rewards', icon: '<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>' },
    { id: 'rewardSaya', nama: 'Rewards Saya', icon: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>' }
  ];
  document.getElementById('menuGrid').innerHTML = menus.map(m => `
    <div class="menu-item ${currentMenu === m.id ? 'active' : ''}" onclick="pilihMenu('${m.id}')">
      <svg viewBox="0 0 24 24">${m.icon}</svg>
      <div class="nama">${m.nama}</div>
    </div>
  `).join('');
}

function pilihMenu(id) {
  currentMenu = id;
  renderMenu();
  renderKonten();
}

function renderKonten() {
  const el = document.getElementById('kontenMenu');
  if (currentMenu === 'absensi') el.innerHTML = renderAbsensi();
  else if (currentMenu === 'penjualan') el.innerHTML = renderPenjualan();
  else if (currentMenu === 'uc') el.innerHTML = renderUC();
  else if (currentMenu === 'perolehan') el.innerHTML = renderPerolehanBrand();
  else if (currentMenu === 'promo') el.innerHTML = renderInfoCard('promo', 'Promo Aktif');
  else if (currentMenu === 'sop') el.innerHTML = renderInfoCard('rules', 'SOP & Rules');
  else if (currentMenu === 'punishment') el.innerHTML = renderInfoCard('punishment', 'Punishment');
  else if (currentMenu === 'pelanggaran') el.innerHTML = renderPelanggaran();
  else if (currentMenu === 'daftarReward') el.innerHTML = renderInfoCard('reward', 'Daftar Rewards');
  else if (currentMenu === 'rewardSaya') el.innerHTML = renderRewardSaya();
  else el.innerHTML = '<div class="card"><p style="text-align:center;color:var(--muted);">Pilih menu di atas</p></div>';
}

/* ===== ABSENSI ===== */
function renderAbsensi() {
  const clean = sanitizeKey(currentUser.namaAbsen);
  const data = dataAbsensi[clean] || {};
  const items = Object.values(data).filter(x => x && x.hari);
  items.sort((a, b) => a.hari - b.hari);

  const totalHari = items.length;
  const totalTerlambat = items.filter(x => String(x.terlambat).toUpperCase() === 'YA').length;

  if (items.length === 0) {
    return `<div class="card"><h3>Absensi</h3><div class="alert warn">Belum ada data absensi</div></div>`;
  }

  return `
    <div class="card">
      <h3><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Rekap Absensi</h3>
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Total Hari</div><div class="value">${totalHari}</div></div>
        <div class="stat-card"><div class="label">Terlambat</div><div class="value" style="color:var(--danger);">${totalTerlambat}</div></div>
        <div class="stat-card"><div class="label">Bulan</div><div class="value" style="font-size:12px;">${items[0].bulan || '-'}</div></div>
      </div>
    </div>
    <div class="card">
      <h3>Detail per Hari</h3>
      <div class="absensi-grid">
        ${items.map(item => {
          const late = String(item.terlambat).toUpperCase() === 'YA';
          return `
            <div class="absensi-hari">
              <div class="hari">Hari ${item.hari}</div>
              <div class="jam">${item.masuk || '-'}</div>
              <div class="jam" style="color:var(--muted);">${item.pulang || '-'}</div>
              <div class="ket ${late ? 'late' : 'ok'}">${late ? 'TERLAMBAT' : 'OK'}</div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/* ===== PENJUALAN ===== */
function renderPenjualan() {
  const namaSales = currentUser.namaSales;
  const items = Object.values(dataPenjualan).filter(x => x && x.namaSales === namaSales);

  const hariIni = new Date();
  const bulanIni = `${hariIni.getFullYear()}-${String(hariIni.getMonth()+1).padStart(2,'0')}`;

  const perTanggal = {};
  let totalOmzet = 0, totalUnit = 0, totalTrans = 0;

  items.forEach(x => {
    if (!x.tanggal) return;
    if (!perTanggal[x.tanggal]) perTanggal[x.tanggal] = { omzet: 0, unit: 0, trx: 0, items: [] };
    perTanggal[x.tanggal].items.push(x);
    perTanggal[x.tanggal].trx++;
    if (x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS') {
      perTanggal[x.tanggal].omzet += Number(x.subtotal) || 0;
      totalOmzet += Number(x.subtotal) || 0;
    }
    perTanggal[x.tanggal].unit += Number(x.qty) || 0;
    totalUnit += Number(x.qty) || 0;
    totalTrans++;
  });

  const tanggalList = Object.keys(perTanggal).sort((a, b) => {
    const da = parseTanggal(a), dbb = parseTanggal(b);
    return (dbb?.getTime() || 0) - (da?.getTime() || 0);
  });

  if (items.length === 0) {
    return `<div class="card"><h3>Penjualan</h3><div class="alert warn">Belum ada data penjualan</div></div>`;
  }

  return `
    <div class="card">
      <h3><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Ringkasan Penjualan</h3>
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Total Transaksi</div><div class="value">${totalTrans}</div></div>
        <div class="stat-card"><div class="label">Total Unit</div><div class="value">${totalUnit}</div></div>
        <div class="stat-card"><div class="label">Hari Aktif</div><div class="value">${tanggalList.length}</div></div>
        <div class="stat-card full">
          <div class="label">Total Omzet</div>
          <div class="value" style="color:var(--success);font-size:20px;">Rp ${totalOmzet.toLocaleString('id-ID')}</div>
        </div>
      </div>
    </div>
    ${tanggalList.map(tgl => {
      const d = perTanggal[tgl];
      return `
        <div class="card">
          <h3 style="color:var(--muted);">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            ${tgl} — ${d.trx} trx • Rp ${d.omzet.toLocaleString('id-ID')}
          </h3>
          <table class="rekap-tabel">
            <thead><tr><th class="kolom-nama">Barang</th><th>Qty</th><th>Subtotal</th></tr></thead>
            <tbody>
              ${d.items.map(it => `
                <tr>
                  <td class="kolom-nama">${it.namaBarang} <span style="color:var(--muted);font-size:10px;">${it.kategori}</span></td>
                  <td>${it.qty}</td>
                  <td class="angka-deal">Rp ${(Number(it.subtotal)||0).toLocaleString('id-ID')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }).join('')}
  `;
}

/* ===== UC ===== */
function renderUC() {
  if (currentUser.ikutUC !== 'YA') {
    return `<div class="card"><h3>UC</h3><div class="alert warn">Anda tidak ikut program UC</div></div>`;
  }
  const namaSales = currentUser.namaSales;
  const targetUC = currentUser.targetUC || 16;
  const items = Object.values(dataPenjualan).filter(x => x && x.namaSales === namaSales && x.kategori === 'GARANSI');
  const totalUC = items.reduce((s, x) => s + (Number(x.qty) || 0), 0);
  const persen = Math.min(100, (totalUC / targetUC) * 100);
  const kurang = Math.max(0, targetUC - totalUC);
  const dendaUC = kurang * 5000;

  return `
    <div class="card">
      <h3><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Progress UC</h3>
      <div class="stats-grid">
        <div class="stat-card"><div class="label">Target</div><div class="value">${targetUC}</div></div>
        <div class="stat-card"><div class="label">Tercapai</div><div class="value" style="color:var(--success);">${totalUC}</div></div>
        <div class="stat-card"><div class="label">Kurang</div><div class="value" style="color:var(--danger);">${kurang}</div></div>
      </div>
      <div style="margin-top:14px;">
        <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:4px;">
          <span>PROGRESS</span><span>${persen.toFixed(1)}%</span>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar" style="width:${persen}%;">${persen >= 15 ? Math.round(persen)+'%' : ''}</div>
        </div>
      </div>
      ${kurang > 0 ? `
        <div class="alert err" style="margin-top:14px;">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Potensi denda UC: Rp ${dendaUC.toLocaleString('id-ID')}
        </div>
      ` : `
        <div class="alert ok" style="margin-top:14px;">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          Target UC tercapai! 🎉
        </div>
      `}
    </div>
    ${items.length > 0 ? `
      <div class="card">
        <h3>Detail UC</h3>
        <table class="rekap-tabel">
          <thead><tr><th class="kolom-nama">Tanggal</th><th>Barang</th><th>Qty</th></tr></thead>
          <tbody>
            ${items.map(it => `
              <tr>
                <td class="kolom-nama">${it.tanggal}</td>
                <td style="font-size:11px;">${it.namaBarang}</td>
                <td class="angka-lihat">${it.qty}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    ` : ''}
  `;
}

/* ===== PEROLEHAN BRAND ===== */
function renderPerolehanBrand() {
  const namaSales = currentUser.namaSales;
  const items = Object.values(dataPenjualan).filter(x => x && x.namaSales === namaSales && x.kategori !== 'GARANSI' && x.kategori !== 'ONGKOS');
  const perBrand = {};
  items.forEach(x => {
    const merk = x.merk || 'LAINNYA';
    if (!perBrand[merk]) perBrand[merk] = { omzet: 0, unit: 0, trx: 0 };
    perBrand[merk].omzet += Number(x.subtotal) || 0;
    perBrand[merk].unit += Number(x.qty) || 0;
    perBrand[merk].trx++;
  });
  const list = Object.keys(perBrand).map(k => ({ merk: k, ...perBrand[k] })).sort((a,b) => b.omzet - a.omzet);
  const totalOmzet = list.reduce((s,x) => s + x.omzet, 0);

  if (list.length === 0) {
    return `<div class="card"><h3>Perolehan Brand</h3><div class="alert warn">Belum ada data</div></div>`;
  }

  return `
    <div class="card">
      <h3><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg> Rekap Perolehan Brand</h3>
      <div class="stat-card full" style="background:white;border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;">
        <div class="label">Total Omzet</div>
        <div class="value" style="color:var(--success);font-size:20px;">Rp ${totalOmzet.toLocaleString('id-ID')}</div>
      </div>
    </div>
    <div class="card">
      <table class="rekap-tabel">
        <thead><tr><th class="kolom-nama">Brand</th><th>Transaksi</th><th>Unit</th><th>Omzet</th></tr></thead>
        <tbody>
          ${list.map(b => `
            <tr>
              <td class="kolom-nama">${b.merk}</td>
              <td>${b.trx}</td>
              <td>${b.unit}</td>
              <td class="angka-deal">Rp ${b.omzet.toLocaleString('id-ID')}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* ===== INFO CARD (Promo/SOP/Punishment/Reward) ===== */
function renderInfoCard(key, judul) {
  const list = dataInfo[key] || [];
  if (!Array.isArray(list) || list.length === 0) {
    return `<div class="card"><h3>${judul}</h3><div class="alert warn">Belum ada informasi</div></div>`;
  }
  return `
    <div class="card">
      <h3><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg> ${judul}</h3>
      ${list.map(item => `
        <div class="list-item">
          <div class="nama">${item.judul || item.poin || '-'}</div>
          ${item.periode ? `<div class="detail">📅 ${item.periode}</div>` : ''}
          ${item.level ? `<div class="detail">Level: <b>${item.level}</b></div>` : ''}
          ${item.deskripsi ? `<div class="detail">${item.deskripsi}</div>` : ''}
          ${item.detail ? `<div class="detail">${item.detail}</div>` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

/* ===== PELANGGARAN ===== */
function renderPelanggaran() {
  const clean = sanitizeKey(currentUser.namaAbsen);
  const data = dataPelanggaran[clean] || {};
  const items = Object.values(data).filter(x => x && x.tanggal);
  items.sort((a,b) => {
    const da = parseTanggal(a.tanggal), dbb = parseTanggal(b.tanggal);
    return (dbb?.getTime() || 0) - (da?.getTime() || 0);
  });
  if (items.length === 0) {
    return `<div class="card"><h3>Pelanggaran Saya</h3><div class="alert ok"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Tidak ada pelanggaran. Bagus! 🎉</div></div>`;
  }
  return `
    <div class="card">
      <h3><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Pelanggaran Saya (${items.length})</h3>
      ${items.map(it => `
        <div class="list-item">
          <div class="nama">${it.keterangan || '-'}</div>
          <div class="detail">📅 ${it.tanggal || '-'} ${it.denda ? `• Denda: <b style="color:var(--danger);">Rp ${Number(it.denda).toLocaleString('id-ID')}</b>` : ''}</div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ===== REWARDS SAYA ===== */
function renderRewardSaya() {
  const clean = sanitizeKey(currentUser.namaAbsen);
  const data = dataRewardsSaya[clean] || {};
  const items = Object.values(data).filter(x => x && x.judul);
  items.sort((a,b) => {
    const da = parseTanggal(a.tanggal), dbb = parseTanggal(b.tanggal);
    return (dbb?.getTime() || 0) - (da?.getTime() || 0);
  });
  if (items.length === 0) {
    return `<div class="card"><h3>Rewards Saya</h3><div class="alert warn">Belum ada rewards</div></div>`;
  }
  return `
    <div class="card">
      <h3><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Rewards Saya (${items.length})</h3>
      ${items.map(it => `
        <div class="list-item">
          <div class="nama">🏆 ${it.judul}</div>
          ${it.detail ? `<div class="detail">${it.detail}</div>` : ''}
          ${it.tanggal ? `<div class="detail">📅 ${it.tanggal}</div>` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

/* ===== UTIL ===== */
function parseTanggal(str) {
  if (!str) return null;
  const p = String(str).split('/');
  if (p.length !== 3) return null;
  return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
}

function sanitizeKey(nama) {
  return String(nama || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_');
}
